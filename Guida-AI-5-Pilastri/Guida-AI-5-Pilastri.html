Elenca TUTTE le differenze in una tabella: sezione | testo prima | testo dopo | impatto pratico per noi.
Non tralasciare modifiche piccole su numeri, date, importi, obblighi e parole come “può/deve”.
In fondo indica le 3 modifiche più importanti.`,
  tip:'Per contratti importanti, fai verificare le modifiche rilevanti a chi segue la parte legale.'},
 {c:'documenti', lv:'intermedio', w:'chat', t:'Da bando o normativa a checklist e scadenze',
  sit:'Un bando o una nuova norma di 60 pagine: devi capire requisiti, documenti e scadenze.',
  ott:'Checklist dei requisiti, elenco documenti da preparare e calendario delle scadenze, con i riferimenti.',
  p:`Ti allego il testo di [bando / normativa].
Usa solo il documento. Per ogni punto indica articolo o pagina e la frase esatta tra virgolette.
Crea:
1. Checklist dei requisiti per partecipare (o per essere in regola): requisito | riferimento | ci riguarda? (lasciare vuoto)
2. Documenti da preparare: documento | chi lo fornisce | riferimento
3. Scadenze: data | cosa fare | riferimento
4. Punti ambigui da chiarire con l’ente
Restituiscimi tutto in un Excel e scrivi NON INDICATO dove il documento non dice nulla.`,
  tip:'Le date sono il punto più delicato: controllale tutte sul testo originale.'},
 {c:'documenti', lv:'intermedio', w:'docs', t:'Una base di conoscenza sui manuali interni',
  sit:'Procedure, manuali e regolamenti sparsi: i colleghi fanno sempre le stesse domande.',
  ott:'Uno spazio dove chiedere “come si fa…” e ricevere risposte citate dai documenti ufficiali.',
  p:`[Carica nel progetto o notebook tutti i manuali e le procedure aggiornate.]

Rispondi alle domande usando SOLO i documenti caricati.
Per ogni risposta:
- indica documento e pagina (o sezione)
- riporta la frase esatta quando si tratta di regole o importi
- se i documenti si contraddicono, mostralo e indica il più recente
- se la risposta non c’è, scrivi “non presente nei documenti” e suggerisci a chi chiedere.

Prima domanda: [es. qual è la procedura per il reso di un prodotto difettoso?]`,
  tip:'Quando una procedura cambia, sostituisci il documento vecchio: altrimenti le risposte mescolano le versioni.'},
 {c:'documenti', lv:'intermedio', w:'chat', t:'Da appunti sparsi a procedura operativa con schema',
  sit:'Una procedura esiste solo nella testa di un collega o in appunti disordinati.',
  ott:'Procedura in Word con passi numerati, responsabilità, errori tipici e schema del flusso.',
  p:`Trasforma questi appunti in una procedura operativa per un collega nuovo.
Struttura: scopo; quando si applica; chi fa cosa (tabella RACI semplice); strumenti necessari; passi numerati; errori da evitare; cosa fare se qualcosa va storto.
Aggiungi uno schema del flusso con le decisioni (sì/no).
Dove mancano informazioni scrivi [DA COMPLETARE: domanda], non inventare.
Restituiscimi un documento Word.

<appunti>
[incolla qui]
</appunti>`,
  tip:'Fai seguire la procedura alla lettera a chi non l’ha mai fatta: ogni dubbio è un [DA COMPLETARE].'},
 {c:'documenti', lv:'avanzato', w:'chat', w2:'local', t:'Matrice di risposta a una gara o richiesta di offerta',
  sit:'Una richiesta di offerta con decine di requisiti tecnici e amministrativi: nessuno deve sfuggire.',
  ott:'Una matrice che collega ogni requisito alla risposta, al documento e al responsabile, con i requisiti scoperti.',
  p:`Ti allego il capitolato [e i nostri documenti: presentazione aziendale, certificazioni, schede prodotto].
1. Estrai TUTTI i requisiti (obbligatori e premianti) con il riferimento: numera ognuno.
2. Crea una matrice Excel: n. | requisito | tipo (obbligatorio/premiante) | punteggio se indicato | come lo copriamo | documento che lo dimostra | responsabile | stato (coperto / parziale / scoperto).
3. Compila “come lo copriamo” e “documento” SOLO se l’informazione è nei nostri documenti, altrimenti “scoperto”.
4. Elenca i requisiti scoperti e le domande di chiarimento da inviare entro la scadenza prevista.
Controlla alla fine che il numero di requisiti nella matrice sia uguale a quelli trovati nel capitolato.`,
  tip:'Rileggi il capitolato a campione: i requisiti nascosti in allegati e note sono i più facili da perdere.'},
 {c:'documenti', lv:'base', w:'chat', t:'Capire una lettera di ente, banca o Comune',
  sit:'Una comunicazione scritta in linguaggio burocratico e non è chiaro cosa bisogna fare.',
  ott:'Spiegazione semplice, scadenze, documenti necessari e bozza di risposta.',
  p:`Spiegami in parole semplici la comunicazione allegata:
- cosa mi chiede e perché
- entro quando (riporta la data esatta)
- cosa succede se non rispondo
- quali documenti servono
Poi prepara una bozza di risposta. Se ci sono riferimenti di legge, riportali come sono scritti e dimmi di verificarli.`,
  tip:'Per multe, tributi o contenziosi usa la spiegazione per capire, poi senti il consulente.'},
 {c:'documenti', lv:'intermedio', w:'chat', t:'Traduzione tecnica con glossario aziendale',
  sit:'Un manuale o una scheda tecnica da tradurre mantenendo termini e formattazione.',
  ott:'Documento tradotto nel formato originale, glossario coerente e frasi incerte segnalate.',
  p:`Traduci in [lingua] il documento allegato, mantenendo titoli, tabelle ed elenchi.
Usa SEMPRE questi termini: [termine = traduzione; …]. Non tradurre nomi di prodotti e codici.
Prima di tutto proponi un glossario degli altri termini tecnici ricorrenti e aspetta la mia conferma.
Alla fine: restituiscimi il documento tradotto in Word e l’elenco delle frasi dove la traduzione è incerta.`,
  tip:'Fai rileggere a un madrelingua almeno avvertenze di sicurezza e garanzie.'},

/* ---------- PRESENTAZIONI ---------- */
 {c:'ppt', lv:'base', w:'chat', t:'Presentazione da un documento',
  sit:'Devi presentare in riunione il contenuto di un documento lungo.',
  ott:'Una presentazione PowerPoint con scaletta approvata, slide leggere e note del relatore.',
  p:`Crea una presentazione PowerPoint dal documento allegato per [pubblico], durata [10] minuti.
Prima proponimi la scaletta (massimo 8 slide: titolo e messaggio) e aspetta la mia conferma.
Poi: una idea per slide, titolo che dice il messaggio, massimo 40 parole, note del relatore per ogni slide.
[Usa il modello allegato modello.pptx.]`,
  tip:'Il titolo di ogni slide dovrebbe bastare da solo a raccontare la storia.'},
 {c:'ppt', lv:'intermedio', w:'chat', w2:'local', t:'Slide con grafici partendo da un Excel',
  sit:'I numeri del trimestre sono in Excel e servono slide chiare per la direzione.',
  ott:'4–6 slide con grafici corretti e conclusioni, ogni numero tracciabile.',
  p:`Dal file Excel allegato crea 5 slide PowerPoint:
1. i 3 numeri chiave del trimestre
2. andamento mensile con grafico
3. confronto con l’anno precedente
4. prodotti o aree migliori e peggiori
5. tre conclusioni e una decisione richiesta
Calcola tutto eseguendo codice. Ogni grafico con titolo, unità di misura e fonte (nome foglio).
Alla fine elenca i numeri usati con il foglio e la cella di origine.`,
  tip:'Controlla i numeri della slide 1 con l’Excel: sono quelli che tutti ricorderanno.'},
 {c:'ppt', lv:'intermedio', w:'chat', t:'Migliorare una presentazione e prepararsi alle domande',
  sit:'Hai già le slide ma sono piene di testo e temi le domande difficili.',
  ott:'Proposte slide per slide, versione migliorata e una simulazione di domande con risposte.',
  p:`Analizza la presentazione allegata. Il pubblico è [chi], l’obiettivo è [ottenere cosa].
1. Tabella per slide: numero | problema | titolo migliore | testo ridotto a 3 punti | grafico o immagine consigliati.
2. Restituiscimi la versione migliorata in PowerPoint, senza cambiare i numeri.
3. Fai la parte del pubblico più critico: 10 domande difficili che potrebbero farmi, con una risposta breve e i dati a supporto presi dalle slide.`,
  tip:'Esercitati a voce sulle 3 domande che ti mettono più in difficoltà.'},
 {c:'ppt', lv:'avanzato', w:'appchat', t:'Pagina interattiva invece delle slide',
  sit:'Devi condividere dei risultati con persone che li guarderanno da sole, al computer o al telefono.',
  ott:'Una pagina web in un solo file, con grafici cliccabili, filtri e testo essenziale, da aprire o condividere.',
  p:`Crea una pagina web interattiva in un unico file HTML per presentare [i risultati del sondaggio / l’andamento delle vendite].
Dati: [incolla la tabella o allega il CSV].
Contenuto: titolo e messaggio principale; 3 indicatori grandi; 2 grafici interattivi (al passaggio del mouse mostrano i valori); un filtro per [reparto/anno]; una sezione “Cosa facciamo adesso”.
Stile sobrio, leggibile da telefono, nessun servizio esterno: deve funzionare anche offline.
Mostramela in anteprima e poi dammi il file da scaricare.`,
  tip:'Controlla che i numeri nei grafici coincidano con la tabella di partenza prima di condividerla.', go:'p4-crea'},

/* ---------- EMAIL E TESTI ---------- */
 {c:'testi', lv:'base', w:'chat', t:'Risposta a una richiesta frequente',
  sit:'Ricevi ogni giorno le stesse domande su tempi, documenti, prezzi.',
  ott:'Una risposta corretta e cortese, senza informazioni inventate.',
  p:`Scrivi una risposta a questa email: [incolla l’email].
Informazioni corrette da usare: [incolla].
Tono cortese e diretto, dare del lei, massimo 120 parole.
Se l’email chiede qualcosa che non è nelle informazioni, non inventare: scrivi [DA VERIFICARE].`,
  tip:'Se la usi spesso, trasformala in una skill: trovi “risposte-richieste-frequenti” nella libreria.'},
 {c:'testi', lv:'base', w:'chat', t:'Mail delicata, in due versioni',
  sit:'Devi sollecitare un pagamento, rifiutare una richiesta o segnalare un errore senza rovinare il rapporto.',
  ott:'Due versioni pronte (più formale e più diretta) tra cui scegliere.',
  p:`Riscrivi questa mail perché sia ferma ma cortese: [incolla la bozza].
Obiettivo: [ottenere il pagamento entro il 30 / rifiutare la richiesta / chiarire l’errore].
Contesto del rapporto: [es. fornitore storico, primo ritardo].
Proponi 2 versioni: una più formale e una più diretta, massimo 150 parole ciascuna. Spiega in una riga la differenza.`,
  tip:'Leggila immaginando di essere il destinatario: se ti irriterebbe, chiedi una terza versione.'},
 {c:'testi', lv:'intermedio', w:'chat', t:'Imparare il tuo stile di scrittura',
  sit:'Le risposte dell’AI “non sembrano tue”.',
  ott:'8 regole del tuo stile, pronte da mettere nelle istruzioni personali, e un testo scritto come lo scriveresti tu.',
  p:`Ti allego 3 testi scritti da me: [email / report / offerte].
1. Analizza il mio stile: lunghezza delle frasi, saluti, tono, parole ricorrenti, struttura.
2. Descrivilo in massimo 8 regole, pronte da incollare nelle mie istruzioni personali.
3. Usa quelle regole per scrivere: [cosa ti serve].`,
  tip:'Incolla le regole nelle istruzioni personali (lezione “Personalizza la tua AI”).', go:'p2-personalizza'},
 {c:'testi', lv:'intermedio', w:'chat', t:'Newsletter interna da notizie sparse',
  sit:'Hai 6 novità (nuovo collega, risultati, procedure, eventi) in email e appunti diversi.',
  ott:'Una newsletter ordinata, con titoli, testi brevi e un oggetto email accattivante.',
  p:`Con le notizie qui sotto crea la newsletter interna di [mese].
Struttura: oggetto email (3 proposte); apertura di 2 righe; una sezione per notizia con titolo e massimo 60 parole; “In breve” per le notizie minori; chiusura con i prossimi appuntamenti.
Tono cordiale, dare del tu, niente enfasi esagerata. Non aggiungere dettagli che non sono nelle notizie.

<notizie>
[incolla]
</notizie>`,
  tip:'Controlla nomi e ruoli delle persone citate: sono gli errori che si notano di più.'},
 {c:'testi', lv:'intermedio', w:'chat', w2:'local', t:'Schede prodotto per catalogo o sito, in serie',
  sit:'Hai un Excel con i dati tecnici di 80 prodotti e servono descrizioni coerenti.',
  ott:'Un Excel con titolo, descrizione breve, descrizione lunga e punti chiave per ogni prodotto.',
  p:`Nel file allegato ci sono i dati tecnici dei prodotti (una riga per prodotto).
Per ogni prodotto scrivi: titolo (max 60 caratteri), descrizione breve (max 160 caratteri), descrizione lunga (80–120 parole), 3 punti chiave.
Regole: usa SOLO i dati della riga; nessuna promessa non dimostrata (es. “il migliore”); tono [professionale e concreto]; stessa struttura per tutti.
Inizia con 3 prodotti e aspetta la mia conferma, poi completa tutti e restituiscimi l’Excel con le nuove colonne.`,
  tip:'Con molti prodotti, usa l’agente sul computer: l’AI in chat può fermarsi a metà elenco.'},
 {c:'testi', lv:'intermedio', w:'chat', t:'Piano editoriale di un mese per LinkedIn',
  sit:'Vuoi comunicare con continuità ma ogni settimana parti da zero.',
  ott:'Calendario di 8 post con obiettivo, bozza e idea visiva, in un Excel.',
  p:`Siamo [descrivi azienda e pubblico]. Obiettivo del mese: [es. farci conoscere dai nuovi fornitori / attrarre candidati].
Crea un piano di 8 post LinkedIn (2 a settimana) in un Excel: data | tema | obiettivo | bozza del post (max 120 parole) | idea per immagine | invito finale.
Varia i formati: storia di un collega, dietro le quinte, dato interessante, consiglio pratico.
Niente frasi fatte né emoji eccessive. Usa solo informazioni che ti fornisco: [incolla novità e dati].`,
  tip:'Chiedi l’autorizzazione ai colleghi prima di citarli o fotografarli.'},
 {c:'testi', lv:'avanzato', w:'chat', t:'Gestire un reclamo in modo completo',
  sit:'Un reclamo articolato, con torti in parte fondati, che richiede risposta e azioni interne.',
  ott:'Analisi dei punti, risposta al reclamo e azioni correttive con responsabili.',
  p:`Ti allego il reclamo ricevuto e la nostra ricostruzione dei fatti [incolla].
1. Elenca i punti sollevati: per ognuno “fondato / non fondato / da verificare” con il motivo, basandoti solo sui fatti forniti.
2. Scrivi la risposta: riconosci ciò che è fondato, spiega senza giustificarti troppo, proponi una soluzione concreta, massimo 250 parole.
3. Proponi azioni correttive interne: azione | responsabile | entro quando | come verifichiamo che ha funzionato.
Segnala se nel reclamo ci sono aspetti legali o di sicurezza che richiedono un esperto.`,
  tip:'Non inviare risposte a reclami con risvolti legali senza averle fatte vedere a chi se ne occupa.'},

/* ---------- RICERCA E DECISIONI ---------- */
 {c:'ricerca', lv:'intermedio', w:'web', t:'Incentivi e bandi con fonti verificabili',
  sit:'Hai sentito parlare di contributi per la tua attività ma non sai quali sono aperti e se ti riguardano.',
  ott:'Un report con i bandi aperti, requisiti, scadenze e link alle fonti ufficiali.',
  p:`Cerca gli incentivi e i bandi aperti per [tipo di impresa, settore, regione, dimensione] per [investimento: es. impianto fotovoltaico, digitalizzazione, formazione].
Usa fonti ufficiali (ministeri, regioni, camere di commercio, enti gestori) e indica link e data di pubblicazione.
Per ogni bando: ente | contributo | requisiti principali | spese ammesse | scadenza | link.
Segnala le informazioni vecchie o incerte e cosa verificare con un consulente.`,
  tip:'Apri sempre il link ufficiale: scadenze e requisiti cambiano spesso.'},
 {c:'ricerca', lv:'intermedio', w:'web', t:'Analisi dei concorrenti',
  sit:'Vuoi capire come si posizionano 5 concorrenti su servizi, prezzi e comunicazione.',
  ott:'Una tabella di confronto con fonti e data, e le opportunità per distinguerti.',
  p:`Analizza questi concorrenti: [elenco con siti].
Per ognuno, usando solo informazioni pubbliche con link e data: servizi offerti, prezzi indicati (se pubblici), a chi si rivolgono, punti di forza dichiarati, recensioni ricorrenti (positive e negative).
Crea una tabella di confronto e, in fondo, 5 opportunità per differenziarci rispetto a noi: [descrivi la tua offerta].
Scrivi NON TROVATO dove l’informazione non è pubblica.`,
  tip:'Le recensioni sono indicative: guarda tendenze ricorrenti, non singoli commenti.'},
 {c:'ricerca', lv:'base', w:'chat', t:'Confrontare opzioni prima di decidere',
  sit:'Devi scegliere tra più soluzioni (software, fornitori, investimenti) e vuoi ragionare con ordine.',
  ott:'Una tabella con criteri pesati e l’elenco di ciò che manca per decidere.',
  p:`Devo scegliere tra [opzione A, B, C] per [scopo].
Criteri per me importanti, con peso da 1 a 5: [costo 5, tempi 3, …].
Crea una tabella di confronto con punteggio pesato, spiegando ogni voto con le informazioni che ti ho dato.
Alla fine indica cosa manca per decidere e quali domande fare. Non decidere al posto mio.`,
  tip:'Cambia i pesi e guarda se la classifica cambia: se sì, la scelta dipende da cosa conta davvero per te.'},
 {c:'ricerca', lv:'avanzato', w:'chat', t:'Analisi dei rischi di un progetto',
  sit:'Sta partendo un progetto importante (trasloco, nuovo gestionale, apertura sede).',
  ott:'Registro dei rischi con probabilità, impatto, prevenzione, piano B e responsabili.',
  p:`Stiamo avviando questo progetto: [descrizione, tempi, budget, persone coinvolte].
1. Individua 12–15 rischi (tecnici, organizzativi, economici, fornitori, persone, normativi).
2. Per ognuno: probabilità (1–5) | impatto (1–5) | priorità | segnali d’allarme | azione di prevenzione | piano B | responsabile.
3. Crea un Excel ordinato per priorità e una matrice probabilità × impatto.
4. Indica i 3 rischi da affrontare questa settimana.
Separa i rischi che derivano dai dati che ti ho dato da quelli generici.`,
  tip:'Rivedi il registro ogni mese: un rischio non aggiornato è un rischio dimenticato.'},
 {c:'ricerca', lv:'avanzato', w:'web', t:'Controllo di un nuovo fornitore prima di firmare',
  sit:'Stai per affidare un lavoro importante a un’azienda che non conosci.',
  ott:'Un dossier con informazioni pubbliche verificate, segnali di rischio e domande da fare.',
  p:`Raccogli informazioni pubbliche sull’azienda [nome, città, partita IVA se nota]:
- dati societari e anni di attività
- notizie rilevanti degli ultimi 3 anni
- certificazioni dichiarate
- recensioni e reputazione
- eventuali segnali di rischio (contenziosi, cambi frequenti di nome, recensioni molto negative)
Ogni informazione con fonte e data. Distingui ciò che è verificato da ciò che è solo dichiarato dall’azienda.
Chiudi con 8 domande da fare al fornitore e i documenti da richiedere (es. visura, DURC, referenze).`,
  tip:'Visura e documenti ufficiali vanno richiesti e controllati: la ricerca online è solo il primo filtro.'},
 {c:'ricerca', lv:'base', w:'chat', t:'Verificare una risposta importante',
  sit:'Hai una risposta dell’AI su cui devi basare una decisione.',
  ott:'La stessa risposta con le affermazioni classificate e quelle non verificabili segnalate.',
  p:VERIFY_PROMPT,
  tip:'Ancora meglio in una chat nuova, dove l’AI non è “affezionata” alla risposta.', go:'p1-allucinazioni'},

/* ---------- APP E STRUMENTI ---------- */
 {c:'app', lv:'base', w:'appchat', t:'Calcolatore dei preventivi',
  sit:'Ogni preventivo lo calcoli a mano con materiali, ore, trasporto e margine, e a volte sbagli.',
  ott:'Una piccola app nel browser: inserisci i valori e ottieni il prezzo con il dettaglio e il testo per la mail.',
  p:`Crea una piccola app in un unico file HTML: “Calcolatore preventivi”.
Campi: descrizione lavoro; righe di materiale (descrizione, quantità, costo unitario, con pulsante “aggiungi riga”); ore di lavoro e costo orario; km di trasporto e costo al km; margine %; IVA %.
Risultato: tabella di dettaglio, totale imponibile, IVA, totale; pulsante “Copia testo per la mail” con un riepilogo cortese.
Formato numeri italiano (1.234,56 €). Nessun servizio esterno, deve funzionare offline. Mostrami l’anteprima.`,
  tip:'Verifica il calcolo con un preventivo vecchio di cui conosci il totale.', go:'p4-crea'},
 {c:'app', lv:'base', w:'appchat', t:'Checklist interattiva da usare ogni giorno',
  sit:'Apertura e chiusura del negozio, controlli di sicurezza, preparazione di un evento: sempre gli stessi passi, a volte dimenticati.',
  ott:'Una checklist da spuntare anche da telefono, con note, data e stampa del riepilogo.',
  p:`Crea un’app in un unico file HTML: “Checklist [chiusura negozio]”.
Voci divise per sezioni: [incolla l’elenco dei controlli].
Funzioni: spunta per ogni voce, campo note, nome di chi compila, data e ora automatiche, barra di avanzamento, pulsante “Stampa / salva PDF del riepilogo”, pulsante “Ricomincia”.
Grande e leggibile da telefono. I dati restano solo sul dispositivo. Nessun servizio esterno.`,
  tip:'Salvala sul telefono come collegamento nella schermata Home per aprirla al volo.', go:'p4-crea'},
 {c:'app', lv:'intermedio', w:'appchat', t:'Quiz di formazione da un manuale',
  sit:'I nuovi colleghi devono imparare procedure e regole di sicurezza, e vuoi verificare che le abbiano capite.',
  ott:'Un quiz interattivo con domande tratte dal manuale, spiegazione di ogni risposta e punteggio finale.',
  p:`Dal manuale allegato crea un quiz di formazione in un unico file HTML.
- 15 domande a scelta multipla sui punti più importanti (sicurezza e errori frequenti per primi)
- dopo ogni risposta: giusto/sbagliato, spiegazione e pagina del manuale
- punteggio finale, elenco degli argomenti da ripassare, pulsante “riprova” che mescola domande e risposte
Usa solo il contenuto del manuale. Nessun servizio esterno. Mostrami prima l’elenco delle domande per approvarle.`,
  tip:'Fai controllare le domande a chi conosce le procedure: un quiz sbagliato insegna errori.', go:'p4-crea'},
 {c:'app', lv:'intermedio', w:'appchat', t:'Mini cruscotto da file CSV',
  sit:'Ogni mese esporti un CSV dal gestionale e rifai gli stessi grafici a mano.',
  ott:'Una pagina che apri, carichi il CSV e vedi subito indicatori, grafici e filtri, senza inviare dati online.',
  p:`Crea un’app in un unico file HTML: “Cruscotto mensile”.
L’utente carica un file CSV con queste colonne: [data; reparto; prodotto; quantità; importo] (separatore punto e virgola, decimali con la virgola).
Mostra: 4 indicatori (totale, variazione sul mese precedente, prodotto migliore, reparto migliore); grafico dell’andamento per giorno; grafico per reparto; tabella filtrabile e ordinabile; pulsante per esportare la tabella filtrata in CSV.
Tutto deve funzionare nel browser senza inviare i dati e senza librerie da internet. Gestisci errori chiari se il file ha colonne sbagliate.`,
  tip:'Prova con un CSV di cui conosci già i totali, poi con uno “sporco” per vedere se gli errori sono chiari.', go:'p4-crea'},
 {c:'app', lv:'intermedio', w:'app', t:'App che rinomina e archivia le fatture PDF',
  sit:'Scarichi decine di fatture con nomi incomprensibili e le archivi a mano.',
  ott:'Un’app sul computer che legge le fatture, le rinomina “data_fornitore_numero” e le sposta per mese, con registro Excel.',
  p:`Costruisci un’app locale per il mio computer: “Archivio fatture”.
Input: una cartella scelta dall’utente con fatture PDF (anche scansioni).
Per ogni PDF: leggi fornitore, numero e data (usa l’OCR se il testo non è selezionabile, con programmi open source).
Rinomina in AAAA-MM-GG_Fornitore_Numero.pdf e sposta in sottocartelle per anno e mese.
Crea registro.xlsx: nome vecchio | nome nuovo | fornitore | numero | data | stato (ok / da verificare).
Regole: fai prima una copia di sicurezza della cartella; i file non letti con certezza vanno in “da-verificare” senza rinominarli; nessun dato inviato su internet.
Interfaccia semplice nel browser con un pulsante “Avvia” e un riepilogo finale. Prima di scrivere codice fammi le domande necessarie.`,
  tip:'Prova su una copia di 10 fatture, controlla il registro, solo dopo usala sulla cartella vera.', go:'p4-crea'},
 {c:'app', lv:'intermedio', w:'app', t:'App che unisce gli Excel delle filiali e segnala gli errori',
  sit:'Ogni mese ricevi file Excel dalle sedi, con piccole differenze di colonne, e li unisci a mano.',
  ott:'Un’app che unisce tutto in un file, uniforma le colonne e produce un report degli errori da rimandare alle sedi.',
  p:`Costruisci un’app locale: “Unisci filiali”.
Input: cartella con un Excel per filiale (nome file = nome filiale). Colonne attese: data, codice prodotto, descrizione, quantità, importo.
Funzioni:
- riconosce colonne con nomi simili (es. “Qtà” = quantità) e chiede conferma la prima volta
- unisce tutto aggiungendo la colonna Filiale
- controlla: date fuori dal mese, quantità negative, codici inesistenti rispetto a listino.xlsx, righe doppie
- crea riepilogo.xlsx (dati, totali per filiale e prodotto) e errori.xlsx (filiale, riga, problema)
Non modificare i file originali. Interfaccia nel browser con istruzioni passo passo. Salva le versioni con Git.`,
  tip:'Il foglio errori.xlsx è il valore aggiunto: mandalo alle filiali perché correggano alla fonte.', go:'p4-crea'},
 {c:'app', lv:'avanzato', w:'app', t:'Generatore di documenti da modello Word ed elenco Excel',
  sit:'Prepari contratti, lettere di incarico o attestati tutti uguali tranne alcuni dati.',
  ott:'Un’app che, scelto il modello e l’elenco, crea tutti i documenti Word/PDF controllando i campi mancanti.',
  p:`Costruisci un’app locale: “Generatore documenti”.
- L’utente sceglie un modello Word con campi tra parentesi graffe (es. {NOME}, {IMPORTO}, {DATA_INIZIO}) e un Excel con una riga per documento.
- L’app mostra quali campi del modello non hanno una colonna corrispondente e blocca finché non è tutto collegato.
- Anteprima dei primi 3 documenti, poi generazione di tutti in Word e PDF, con nome file configurabile (es. {COGNOME}_{NOME}).
- Formati italiani per date e importi.
- Report finale: documenti creati, righe con campi vuoti (non generate).
Nessun dato su internet. Interfaccia semplice nel browser, file di avvio con doppio clic e README.md.`,
  tip:'Apri e confronta 3 documenti generati con i dati dell’Excel prima di inviarli.', go:'p4-crea'},
 {c:'app', lv:'avanzato', w:'appfull', t:'App online per le richieste di ferie e permessi',
  sit:'Le ferie si chiedono via email e un Excel aggiornato a mano: richieste perse e sovrapposizioni.',
  ott:'Un’app online con accesso per dipendenti e responsabili, approvazioni, calendario e export mensile.',
  p:`Ti allego il documento dei requisiti PRD.md [creato nella lezione “Creare app complete”].
Costruisci l’app “Richieste ferie” seguendo il PRD:
- prima proponi un piano a tappe e le tecnologie, con i costi mensili previsti, e aspetta la mia conferma
- tappa 1: schermate con dati finti; tappa 2: database e accesso con ruoli; tappa 3: email di notifica; tappa 4: export Excel
- dopo ogni tappa fermati e dimmi come provarla
- sicurezza: password non nel codice, ogni dipendente vede solo le sue richieste, il responsabile solo il suo reparto
- alla fine guidami passo passo nella pubblicazione e scrivi README.md per la manutenzione.`,
  tip:'Prima della pubblicazione con dati veri coinvolgi IT e privacy: sono dati personali dei dipendenti.', go:'p4-app-complete'},
 {c:'app', lv:'avanzato', w:'appfull', t:'Ticket di assistenza interna con foto da telefono',
  sit:'Guasti e richieste arrivano a voce o su WhatsApp e si perdono.',
  ott:'Un’app online dove si apre un ticket con foto, si assegna a un tecnico e si segue fino alla chiusura.',
  p:`Voglio un’app online “Segnalazioni” per [manutenzione / IT interno].
Prima scrivi il PRD.md facendomi domande una alla volta, poi costruiscila a tappe.
Funzioni previste:
- apertura ticket da telefono: categoria, luogo, descrizione, foto, urgenza
- assegnazione a un tecnico, stati (nuovo, in corso, in attesa, chiuso), commenti
- email automatica a chi ha aperto il ticket a ogni cambio di stato
- elenco filtrabile e statistiche mensili (tempi medi di chiusura per categoria)
- ruoli: chi segnala, tecnico, responsabile
Indica costi mensili dei servizi e come fare backup. Fermati dopo ogni tappa per farmela provare.`,
  tip:'Parti da una sola sede o un solo reparto per un mese, poi allarga.', go:'p4-app-complete'},

/* ---------- AGENTI E AUTOMAZIONI ---------- */
 {c:'agenti', lv:'intermedio', w:'local', t:'Note spese da scontrini e ricevute',
  sit:'Foto e PDF di scontrini del mese da trasformare in nota spese per categoria.',
  ott:'Un Excel con una riga per spesa, totali per categoria e documenti dubbi o doppi segnalati.',
  p:`Nella cartella “originali” ci sono foto e PDF di scontrini e ricevute del mese.
Crea risultati/nota_spese.xlsx: File | Data | Esercente | Categoria (Carburante, Pasti, Trasporti, Alloggio, Altro) | Importo | Pagamento.
Regole: importi e date come scritti, mai stimati; documenti illeggibili → DA VERIFICARE; non toccare gli originali.
Controlli: numero righe = numero file; importi con 2 decimali o DA VERIFICARE; totali per categoria e generale in fondo.
Report finale: documenti DA VERIFICARE e possibili doppioni (stessa data, esercente e importo).`,
  tip:'Controlla 3 importi a caso e tutti i possibili doppioni.', go:'p5-primo'},
 {c:'agenti', lv:'intermedio', w:'local', t:'Mettere ordine in una cartella di 300 file',
  sit:'Una cartella condivisa (o i Download) piena di documenti mischiati e nomi incomprensibili.',
  ott:'File organizzati per tipo e anno, nomi chiari, registro delle modifiche e nessun file perso.',
  p:`La cartella “da-ordinare” (una COPIA) contiene circa 300 file misti.
1. Analizza e proponimi la struttura di sottocartelle e 10 esempi di nuovi nomi (AAAA-MM-GG_descrizione). Aspetta la conferma.
2. Esegui e crea risultati/registro.xlsx: nome vecchio | nome nuovo | cartella.
Regole: non cancellare nulla; possibili doppioni in “possibili-doppioni”; file non riconosciuti in “da-controllare”.
Controlli: numero di file prima e dopo identico; ogni file nel registro.`,
  tip:'Lavora su una copia: solo quando il risultato ti convince sostituisci la cartella originale.', go:'p5-primo'},
 {c:'agenti', lv:'avanzato', w:'local', t:'Scadenzario da una cartella di contratti',
  sit:'Decine di contratti (fornitori, assicurazioni, noleggi) e nessuno sa quando scadono o si rinnovano da soli.',
  ott:'Un Excel con scadenze, rinnovi, preavvisi e date ultime per disdire, ordinato per urgenza.',
  p:`Nella cartella “contratti” ci sono contratti in PDF e Word.
Crea risultati/scadenzario.xlsx: File | Controparte | Oggetto | Scadenza | Rinnovo automatico | Preavviso | Data ultima per disdire | Importo annuo | Penali | Articolo di riferimento.
Regole: solo ciò che è scritto; NON INDICATO dove manca; per ogni dato articolo o pagina.
Controlli: una riga per file; data ultima = scadenza − preavviso; nessuna cella vuota.
Stop: contratto illeggibile dopo 2 tentativi → DA VERIFICARE.
In chat: i contratti da disdire o rinnovare nei prossimi 90 giorni.`,
  tip:'Apri i 5 contratti più costosi e controlla scadenza e preavviso: sono quelli che contano.', go:'p5-primo'},
 {c:'agenti', lv:'avanzato', w:'local', t:'Fascicolo pronto per un audit o una certificazione',
  sit:'Arriva l’ispezione o l’audit (qualità, sicurezza, privacy) e bisogna dimostrare di avere tutti i documenti.',
  ott:'L’elenco dei documenti richiesti con quelli trovati, mancanti o scaduti, e un indice del fascicolo.',
  p:`Nella cartella “requisiti” c’è l’elenco dei documenti richiesti dall’audit [es. checklist ISO 9001 o sicurezza].
Nella cartella “documenti” ci sono le COPIE dei nostri documenti.
1. Per ogni requisito cerca il documento che lo soddisfa (leggendone il contenuto, non solo il nome).
2. Crea risultati/verifica_audit.xlsx: requisito | documento trovato | pagina | data del documento | stato (presente / scaduto / parziale / mancante) | nota.
3. Considera scaduti i documenti con revisione più vecchia di [12] mesi o con date di validità superate.
4. Crea risultati/indice_fascicolo.docx con l’elenco ordinato dei documenti presenti.
Non modificare i documenti. In chat: i requisiti mancanti e scaduti, in ordine di importanza.`,
  tip:'“Parziale” e “mancante” sono la lista delle cose da fare prima dell’audit: assegnale subito.', go:'p5-primo'},
 {c:'agenti', lv:'avanzato', w:'agentweb', t:'Raccogliere dati da più siti in un Excel',
  sit:'Devi confrontare prezzi, tempi e condizioni pubblicati su 15 siti di fornitori.',
  ott:'Un Excel compilato con dati, link e data di rilevazione, e le righe incomplete segnalate.',
  p:`Per ognuno di questi fornitori [elenco siti] raccogli dai loro siti pubblici:
prodotto [descrizione precisa] | prezzo IVA esclusa | unità | quantità minima | tempi di consegna | costi di spedizione | link della pagina | data di rilevazione.
Regole: solo informazioni visibili sul sito, niente accessi con password, niente moduli da inviare.
Controlli: ogni prezzo ha il link; dove l’informazione non è pubblica scrivi NON PUBBLICATO.
Stop: se un sito chiede di registrarsi o non si carica dopo 2 tentativi, segnalo e passa al successivo.
Consegna l’Excel e un riepilogo delle 3 offerte più convenienti a parità di condizioni.`,
  tip:'I prezzi online cambiano: tieni la data di rilevazione e riconferma prima di ordinare.', go:'p5-primo'},
 {c:'agenti', lv:'avanzato', w:'local', t:'Report settimanale che si prepara da solo',
  sit:'Ogni lunedì prendi gli stessi file, fai gli stessi conti e mandi lo stesso tipo di riepilogo.',
  ott:'Un’attività ripetibile (e, se lo strumento lo permette, programmata) che prepara il report pronto da controllare.',
  p:`Ogni lunedì nella cartella “settimana” trovi gli export aggiornati: ordini.xlsx e consegne.xlsx.
Prepara risultati/report_settimana_[data].docx con:
- ordini ricevuti e consegnati della settimana, confronto con la settimana precedente
- ordini in ritardo (consegna prevista superata) con cliente e giorni di ritardo
- 3 punti di attenzione
Controlli: totali coincidenti con i file; nessun ordine contato due volte; se un file manca o è vecchio (data di modifica oltre 3 giorni) fermati e avvisami.
Non inviare email: prepara solo il documento e una bozza di messaggio in chat.
Alla fine proponi come trasformare questo lavoro in una skill e, se il tuo strumento lo consente, in un’attività programmata ogni lunedì alle 8.`,
  tip:'Per le prime 4 settimane controlla il report prima di usarlo; poi basta un controllo a campione.', go:'p5-istruzioni'},

/* ---------- RIUNIONI, PROGETTI, PERSONE ---------- */
 {c:'organizzazione', lv:'base', w:'chat', t:'Verbale da una trascrizione',
  sit:'Hai la trascrizione automatica di una riunione di un’ora.',
  ott:'Sintesi, decisioni, attività con responsabili e punti aperti.',
  p:`Dalla trascrizione allegata crea:
- sintesi in 5 righe
- decisioni prese
- attività: cosa | chi | entro quando
- punti aperti
Usa solo quello che è stato detto. Dove mancano responsabile o data scrivi DA DEFINIRE.`,
  tip:'Avvisa sempre i partecipanti prima di registrare o trascrivere una riunione.'},
 {c:'organizzazione', lv:'base', w:'chat', t:'Preparare una riunione efficace',
  sit:'Una riunione importante e il rischio di un’ora di discussione senza decisioni.',
  ott:'Obiettivo, ordine del giorno con i tempi, domande e materiali da inviare prima.',
  p:`Devo fare una riunione su [tema] con [partecipanti e ruoli], durata [minuti].
Obiettivo: [decidere / allinearci / raccogliere idee].
Preparami: obiettivo in una frase; ordine del giorno con i tempi; per ogni punto la domanda a cui rispondere; materiali da mandare prima; il testo dell’invito.`,
  tip:'Metti le decisioni da prendere nei primi 20 minuti, quando l’attenzione è alta.'},
 {c:'organizzazione', lv:'intermedio', w:'chat', t:'Piano di progetto con attività e diagramma di Gantt',
  sit:'Un progetto con più persone e scadenze (trasloco, lancio prodotto, evento).',
  ott:'Un Excel con attività, dipendenze, responsabili, date e diagramma di Gantt.',
  p:`Progetto: [descrizione], data di fine: [data], persone: [ruoli].
1. Suddividi in fasi e attività (massimo 30), ognuna con durata stimata, responsabile e attività da cui dipende.
2. Calcola le date a ritroso dalla scadenza e segnala le attività critiche (senza margine).
3. Restituiscimi un Excel con la tabella e un diagramma di Gantt a barre colorate per fase.
4. Indica le 3 scadenze intermedie da controllare.
Le durate sono stime: mettile in una colonna modificabile che aggiorna le date.`,
  tip:'Fai rivedere le durate a chi farà davvero le attività: di solito sono ottimistiche.'},
 {c:'organizzazione', lv:'intermedio', w:'chat', t:'Inserimento di un nuovo collega nei primi 30 giorni',
  sit:'Arriva una persona nuova e ogni volta l’inserimento è improvvisato.',
  ott:'Piano giorno per giorno, checklist per il responsabile e documenti da preparare.',
  p:`Arriva un nuovo [ruolo] nel reparto [reparto]. Ti allego la descrizione del ruolo e le procedure principali.
Crea:
1. piano dei primi 30 giorni: settimana | obiettivi | attività | con chi | come verifichiamo
2. checklist per il responsabile (prima dell’arrivo, primo giorno, fine prima settimana, fine mese)
3. elenco degli accessi e dei materiali da preparare
4. 5 domande da fare al nuovo collega a fine mese
Documento Word, tono accogliente e concreto.`,
  tip:'Trasformalo in una skill: il prossimo inserimento richiederà 5 minuti.'},
 {c:'organizzazione', lv:'intermedio', w:'chat', t:'Selezione: annuncio, domande di colloquio e griglia',
  sit:'Devi assumere e vuoi valutare i candidati in modo uniforme ed equo.',
  ott:'Annuncio, domande di colloquio legate alle competenze e una griglia di valutazione.',
  p:`Devo assumere un [ruolo]. Competenze indispensabili: [elenco]. Competenze utili: [elenco].
Crea:
1. annuncio chiaro (max 250 parole, orario, sede, cosa offriamo)
2. 10 domande di colloquio basate su esempi concreti (“raccontami una volta in cui…”), collegate alle competenze
3. griglia di valutazione: competenza | cosa ascoltare per un punteggio 1, 3, 5
Linguaggio inclusivo, nessun requisito non necessario (età, genere, provenienza).
Non valutare tu i candidati e non chiedermi dati personali dei candidati.`,
  tip:'Non caricare CV con dati personali in strumenti non approvati dall’azienda.'}
];
L({id:'fine-ricettario', p:'fine', t:'Ricettario: '+RICETTE.length+' casi pronti', sub:'Excel, documenti, presentazioni, testi, ricerche, app e agenti, dal più semplice al più complesso', min:15, body:()=>{
 const f = S.ric.f, lv = S.ric.l, list = RICETTE.map((r,i)=>[r,i]).filter(([r])=>(f==='tutti'||r.c===f) && (lv==='tutti'||r.lv===lv));
 const count = k => RICETTE.filter(r=>k==='tutti'||r.c===k).length;
 return `
 ${card('Come usare il ricettario', `<p>Ogni caso ti dice <b>la situazione</b>, <b>cosa ottieni</b>, <b>dove farlo${hasTool()?' con '+toolName():''}</b> e il prompt da copiare. Sostituisci le parti tra <b>[parentesi quadre]</b> e allega i file.</p>
  <div class="presets"><span>Argomento:</span>${Object.entries(RIC_CAT).map(([k,l])=>`<button class="chip-btn${f===k?' on':''}" data-act="ric" data-f="${k}">${l} <small>(${count(k)})</small></button>`).join('')}</div>
  <div class="presets"><span>Livello:</span>${Object.entries(RIC_LVL).map(([k,x])=>`<button class="chip-btn${lv===k?' on':''}" data-act="ric-l" data-l="${k}">${x.l}</button>`).join('')}</div>
  ${hasTool() ? '' : `<p class="hint">Scegli il tuo strumento per vedere dove fare ogni caso:</p><div class="actions">${toolButtons()}</div>`}`)}
 ${list.length ? list.map(([r,i])=>`<section class="recipe"><div class="recipe-h">${badge(RIC_CAT[r.c],'#475569')}${badge(RIC_LVL[r.lv].l, RIC_LVL[r.lv].c)}<h3>${r.t}</h3></div>
  <div class="recipe-desc"><p><b>La situazione:</b> ${r.sit}</p><p><b>Cosa ottieni:</b> ${r.ott}</p></div>
  ${whereLine(r.w, r.w2)}
  ${outBox('ric-'+i,'Prompt',r.p)}
  <p class="recipe-tip"><b>✋ Consiglio:</b> ${r.tip}${r.go?` <button class="btn" data-act="go" data-to="${r.go}">Come si fa →</button>`:''}</p></section>`).join('') : card('', '<p>Nessun caso con questi filtri.</p>')}
`; }});

L({id:'fine-problemi', p:'fine', t:'Quando qualcosa non va', sub:'I problemi più comuni e come risolverli', min:6, body:()=>`
 ${card('Problemi e soluzioni', tbl(['Problema','Perché succede','Cosa fare'],[
  ['L’AI dice che non riesce ad aprire il file','Formato non supportato o funzione non attiva','Salva come .xlsx, .docx o .pdf. '+byTool({chatgpt:'Controlla di aver allegato il file dal pulsante +.', claude:'Attiva “Esecuzione codice e creazione file” nelle impostazioni.', gemini:'Prova a caricarlo da Drive o ad aprirlo in Fogli/Documenti.', any:'Controlla le impostazioni dello strumento.'})],
  ['File troppo grande','Ogni strumento ha limiti di dimensione','Togli fogli inutili, salva in CSV, dividi il file. Oppure usa '+where('local')+'.'],
  ['I numeri sono sbagliati','Ha stimato o letto solo una parte del file','Chiedi quante righe ha letto e di <i>“eseguire i calcoli con il codice”</i>. Controlla a campione.'],
  ['Ha inventato informazioni (allucinazione)','Mancavano dati e ha “riempito i buchi”','Scrivi: <i>“usa solo i file allegati; dove manca scrivi NON TROVATO”</i>, chiedi pagine e frasi esatte, usa il prompt di verifica (lezione “Risultati affidabili”).'],
  ['Dimentica le istruzioni date all’inizio','Conversazione troppo lunga','Nuova chat con un riassunto. Le regole fisse mettile in un progetto o in una skill.'],
  ['Non trovo il menu indicato','I nomi cambiano spesso, o il piano non lo include','Cerca il nome della funzione nel centro assistenza. Verifica il tuo piano.'],
  ['“Hai raggiunto il limite di utilizzo”','Chat lunghe, file pesanti, modelli potenti e agenti consumano molti token','Aspetta la ricarica, riparti da un riassunto in una chat nuova, usa un modello più leggero (lezione “Usare meno token”), valuta un piano superiore.'],
  ['La skill non si attiva','Description vaga, o skill non attiva','Controlla che sia attiva, scrivi <i>“usa la skill …”</i> e migliora la description.'],
  ['L’agente gira a vuoto','Controlli vaghi o nessuna condizione di stop','Fermalo. Riscrivi controlli sì/no e un numero massimo di tentativi.'],
  ['L’agente chiede tanti permessi','È normale all’inizio: ti tutela','Consenti letture e creazione di file nella cartella; conferma a mano modifiche, invii, cancellazioni.'],
  ['Il file creato non si apre bene','Formattazione complessa','Chiedi di ricrearlo partendo da un tuo modello, o di semplificare la formattazione.'],
  ['L’app per computer non vede la cartella o i file','Permesso non concesso, o cartella diversa da quella scelta','Scegli di nuovo la cartella e concedi l’accesso; controlla che i file siano davvero lì (non in una cartella cloud non sincronizzata).']
 ]))}
 ${analogy('🆘','La regola d’oro','<p style="margin:4px 0 0">Qualsiasi errore o messaggio che non capisci: <b>copialo e chiedi all’AI in chat</b> <i>“cosa significa e cosa devo fare, passo passo?”</i>. Aggiungi uno screenshot se serve.</p>')}
`});

L({id:'fine-piano', p:'fine', t:'Il tuo piano in 4 settimane', sub:'Dalla teoria alla pratica', min:4, body:()=>`
 ${card('Un passo alla settimana', `<div class="plan">
  <div class="week" style="--pc:#4f46e5"><b>Settimana 1 · Pilastro I</b><ul><li>Scrivi le tue istruzioni personali con le regole di affidabilità</li><li>Usa CRAFT su 5 richieste reali</li><li>Carica un tuo Excel o PDF e fatti fare un riepilogo</li><li>Salva i 3 prompt migliori</li></ul></div>
  <div class="week" style="--pc:#d97706"><b>Settimana 2 · Pilastri III e II</b><ul><li>Mappa 5–10 attività</li><li>Crea un Progetto per il tuo tema principale</li><li>Crea un Assistente per un compito semplice</li></ul></div>
  <div class="week" style="--pc:#0d9488"><b>Settimana 3 · Pilastro II</b><ul><li>Fatti creare dall’AI la skill per l’attività n°1 della mappa</li><li>Provala con dati reali e correggila</li><li>Condividila con un collega</li></ul></div>
  <div class="week" style="--pc:#e11d48"><b>Settimana 4 · Pilastri IV e V</b><ul><li>Installa ${where('local')}</li><li>Fai il primo agente sulle 5 fatture di prova</li><li>Crea una mini-app o prova un caso concreto</li><li>Misura: quanto tempo hai recuperato?</li><li>Fai il quiz finale e ripassa gli argomenti più deboli</li></ul></div>
 </div>`)}
 ${card('Poi ricomincia il ciclo', `<p style="font-size:18px;text-align:center;margin:6px 0"><b>Mappa le attività</b> → <b>Crea le skill</b> → <b>Delega agli agenti</b> → <b>Misura</b> → di nuovo</p>
 <p class="lead" style="text-align:center">Ogni giro libera tempo dalle attività da 2/10 per dedicarlo a quelle da 10/10.</p>`)}
 ${analogy('🛒','E le novità sull’AI?','<p style="margin:4px 0 0">Quando esce qualcosa di nuovo, chiediti: <b>risolve un’attività della mia mappa?</b> Se sì, provalo. Se no, lascialo sullo scaffale.</p>')}
`});

 const last = st.slice(-12);
 const weak = Object.entries(arg).filter(([,[ok,tot]])=>tot>=2).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0];
 return `<section class="qz-hero"><div class="qz-hero-ic">🎓</div><div><div class="qz-kick">QUIZ FINALE · 10 DOMANDE PER GIRO</div><h2>Quanto hai imparato?</h2><p>${QZ.length} domande su tutti gli argomenti della guida. A ogni giro ne escono 10 diverse, dando la precedenza a quelle che non hai ancora visto. Alla fine ricevi un voto e i consigli su cosa ripassare.</p>
  <div class="actions"><button class="qz-start" data-act="qz-start">${n ? '🔄 Nuovo giro di domande' : '🚀 Inizia il quiz'}</button></div></div></section>
 ${n ? `<div class="qz-stats">
  <div><b>${n}</b><span>giri completati</span></div>
  <div><b style="color:${qzColor(best)}">${best}/10</b><span>voto migliore</span></div>
  <div><b style="color:${qzColor(Math.round(media))}">${fmt1(media)}</b><span>media dei voti</span></div>
  <div><b>${viste}/${QZ.length}</b><span>domande viste</span></div></div>
 ${card('I tuoi ultimi giri', `<div class="qz-bars">${last.map((x,i)=>`<div class="qz-bar" title="${new Date(x.t).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}"><i style="height:${Math.max(6,x.voto*10)}%;background:${qzColor(x.voto)}"><em>${x.voto}</em></i><span>${n-last.length+i+1}°</span></div>`).join('')}</div>`)}
 ${card('Come vai per argomento', `<div class="qz-args">${Object.entries(QZ_ARG).map(([k,x])=>{ const [ok,tot] = arg[k] || [0,0], p = tot ? Math.round(ok/tot*100) : null;
   return `<div class="qz-arg"><div class="qz-arg-h"><span>${x.ic} ${x.l}</span><b>${p===null ? '—' : p+'%'}</b></div><div class="meter-bar"><i style="width:${p||0}%;background:${p===null?'#e2e8f0':qzColor(Math.round(p/10))}"></i></div></div>`; }).join('')}</div>
  ${weak ? `<p style="margin:12px 0 0">📌 Da ripassare per primo: <b>${QZ_ARG[weak[0]].ic} ${QZ_ARG[weak[0]].l}</b> <button class="btn" data-act="go" data-to="${QZ_ARG[weak[0]].go}">Vai alla lezione →</button></p>` : ''}`)}
 <div class="actions" style="justify-content:flex-end"><button class="btn" data-act="qz-reset">Azzera i risultati del quiz</button></div>` : note('I risultati restano salvati','<p style="margin:4px 0 0">Voti e progressi del quiz vengono salvati <b>solo in questo browser</b>, su questo dispositivo. Puoi ripetere il quiz tutte le volte che vuoi.</p>')}`;
}
function qzQuestion(){
 const Q = S.qz, q = QZ[Q.set[Q.i]], ord = Q.ordine[Q.i], r = Q.risposte[Q.i], x = QZ_ARG[q.a];
 return `<section class="qz-card" id="qz">
  <div class="qz-top"><span class="qz-num">Domanda ${Q.i+1} di 10</span>${qzDots()}<span class="qz-score">✅ ${Q.risposte.filter(y=>y&&y.ok).length}</span></div>
  <div class="meter-bar" style="height:8px"><i style="width:${(Q.i+(r?1:0))*10}%;background:linear-gradient(90deg,#4f46e5,#0d9488)"></i></div>
  <div class="qz-arg-tag">${x.ic} ${x.l}</div>
  <h2 class="qz-q">${esc(q.q)}</h2>
  <div class="qz-opts">${ord.map((oi,k)=>{ const cls = !r ? '' : oi===0 ? ' ok' : r.scelta===oi ? ' ko' : ' dim';
   return `<button class="qz-opt${cls}" data-act="qz-ans" data-o="${oi}"${r?' disabled':''}><span class="qz-letter">${'ABCD'[k]}</span><span>${esc(q.o[oi])}</span>${r && oi===0 ? '<span class="qz-mark">✓</span>' : r && r.scelta===oi ? '<span class="qz-mark">✗</span>' : ''}</button>`; }).join('')}</div>
  ${r ? `<div class="qz-fb ${r.ok?'ok':'ko'}"><b>${r.ok ? '🎉 Risposta giusta!' : '💡 Non proprio.'}</b> ${esc(q.e)}
   <div class="actions" style="margin-top:10px"><button class="qz-next" data-act="qz-next">${Q.i<9 ? 'Domanda successiva →' : '🏁 Vedi il voto'}</button><button class="btn" data-act="go" data-to="${q.go}">📖 Rivedi la lezione</button></div></div>` : ''}
 </section>`;
}
function qzEnd(){
 const Q = S.qz, v = Q.risposte.filter(y=>y&&y.ok).length, [ic,msg] = qzGiudizio(v);
 const sbagliate = Q.set.map((qi,i)=>[QZ[qi], Q.risposte[i]]).filter(([,r])=>r && !r.ok);
 return `<section class="qz-card qz-end" id="qz">
  <div class="qz-end-top">${qzRing(v)}<div><div class="qz-big-ic">${ic}</div><h2>${msg}</h2><p>Hai risposto correttamente a <b>${v} domande su 10</b>.</p>${qzDots()}</div></div>
  ${v===10 ? '<div class="qz-confetti" aria-hidden="true">🎊 🎉 ✨ 🏆 ✨ 🎉 🎊</div>' : ''}
  <div class="actions" style="margin-top:14px"><button class="qz-start" data-act="qz-start">🔄 Nuovo giro con domande diverse</button><button class="btn" data-act="qz-home">📊 I miei risultati</button></div>
 </section>
 ${sbagliate.length ? card('Da ripassare', sbagliate.map(([q])=>`<div class="qz-review"><div class="qz-arg-tag">${QZ_ARG[q.a].ic} ${QZ_ARG[q.a].l}</div><p style="margin:4px 0"><b>${esc(q.q)}</b></p><p style="margin:0 0 4px">✅ ${esc(q.o[0])}</p><p class="hint" style="margin:0 0 6px">${esc(q.e)}</p><button class="btn" data-act="go" data-to="${q.go}">📖 Rivedi la lezione</button></div>`).join('')) : ''}`;
}
L({id:'fine-quiz', p:'fine', t:'Quiz finale', sub:'10 domande per giro su tutti gli argomenti, con voto e risultati salvati', min:5, body:()=>{
 const Q = S.qz;
 return Q.fase==='domanda' ? qzQuestion() : Q.fase==='fine' ? qzEnd() : qzHome();
}});

  ['*','<b>Progetto</b>','Spazio nella chat con documenti e istruzioni su un tema.'],
  ['chatgpt','<b>GPT</b>','Assistente personalizzato di ChatGPT.'],
  ['gemini','<b>Gem</b>','Assistente personalizzato di Gemini.'],
  ['gemini','<b>Gemini Notebook</b>','Strumento Google (prima NotebookLM) per fare domande solo sui documenti caricati, con citazioni.'],
  ['gemini','<b>Notebook</b>','Spazio nell’app Gemini che raccoglie chat, fonti e istruzioni su un tema.'],
  ['gemini','<b>Google AI Studio</b>','Servizio Google per creare app complete descrivendole e pubblicarle online.'],
  ['chatgpt','<b>Canvas</b>','Spazio di ChatGPT per scrivere documenti lunghi o piccole app con anteprima.'],

  ['claude','<b>Artifact</b>','Documento o piccola app creata da Claude, visibile e utilizzabile accanto alla chat.'],

  ['claude','<b>CLAUDE.md</b>','Istruzioni permanenti di una cartella, lette da Claude Code a ogni avvio.'],
  ['chatgpt','<b>AGENTS.md</b>','Istruzioni permanenti di una cartella, lette da Codex a ogni avvio.'],
  ['gemini','<b>GEMINI.md</b>','Istruzioni permanenti di una cartella, lette da Antigravity a ogni avvio.'],
  ['*','<b>Plugin</b>','Pacchetto che installa insieme più skill e connettori.'],
  ['*','<b>Connettore</b>','Collegamento dell’AI a un’altra applicazione (posta, Drive, calendario, gestionale).'],
  ['*','<b>Agente</b>','AI che lavora in autonomia in più passaggi, verificando da sola il risultato.'],
  ['chatgpt','<b>Work</b>','Agente di ChatGPT per lavori lunghi su documenti, fogli, presentazioni, cartelle e siti.'],
  ['chatgpt','<b>Sites</b>','Funzione di ChatGPT per creare e pubblicare siti e web app.'],
  ['chatgpt','<b>Codex</b>','Agente di OpenAI, incluso nell’app ChatGPT per computer, che lavora sulle cartelle e crea app.'],
  ['claude','<b>Cowork</b>','Agente di Claude per lavorare su documenti e cartelle del computer, senza terminale.'],
  ['claude','<b>Claude Code</b>','Agente di Claude per creare app, programmi e automazioni.'],
  ['claude','<b>Claude in Chrome</b>','Estensione del browser con cui Claude svolge compiti sui siti web.'],
  ['gemini','<b>Antigravity</b>','App di Google con agenti che lavorano sulle cartelle del computer e creano app.'],
  ['gemini','<b>Gemini Spark</b>','Agente personale di Gemini per compiti in più passaggi (non disponibile in Italia e nell’UE).'],
  ['*','<b>Deep Research / Ricerca</b>','Ricerca lunga sul web che produce un report con le fonti.'],

  ['*','<b>Human in the loop</b>','I momenti in cui l’agente deve fermarsi e chiedere a una persona.'],
  ['*','<b>Vibe coding</b>','Creare un’applicazione descrivendola a parole a un’AI che scrive il codice.'],
  ['*','<b>Mini-app / Web app locale</b>','Piccola applicazione su misura che si apre nel browser ma funziona sul tuo computer.'],
  ['*','<b>Macro VBA</b>','Piccolo programma dentro Excel che ripete in automatico una serie di operazioni.'],
  ['*','<b>OCR</b>','Tecnologia che trasforma in testo i documenti scansionati o fotografati.'],
  ['*','<b>Open source</b>','Software gratuito con codice pubblico, spesso riutilizzabile.'],
  ['*','<b>Git / GitHub</b>','Sistema che salva le versioni del codice: puoi tornare indietro se qualcosa si rompe.']
 ].filter(r=>r[0]==='*' || !hasTool() || r[0]===S.tool).map(r=>r.slice(1))))}

/* ============ MOTORE DELLA GUIDA ============ */
const GROUPS = [[null,'Inizia','#38bdf8',''],['p1','Competenze','#4f46e5','I'],['p2','Elimina la frizione','#0d9488','II'],['p3','Progetta prima','#d97706','III'],['p4','Kit AI','#7c3aed','IV'],['p5','Agenti','#e11d48','V'],['fine','Conclusione','#16a34a','✓']];
let cur = 0;
const STORE = 'guida-ai-5-pilastri';
function saveProgress(){ try{ localStorage.setItem(STORE, JSON.stringify({lesson:LESSONS[cur].id, done:S.done, tool:S.tool})); }catch(e){} }
function loadProgress(){ try{ return JSON.parse(localStorage.getItem(STORE) || 'null'); }catch(e){ return null; } }
function renderToolSel(){
 const e = $('#toolsel');
 e.classList.toggle('pick', !hasTool());
 e.innerHTML = `<span>${hasTool() ? 'Uso:' : 'Scegli:'}</span>` + Object.entries(TOOLS).map(([k,x])=>`<button class="${S.tool===k?'on':''}" style="--tc:${x.c}" data-act="set-tool" data-tool="${k}">${x.l}</button>`).join('');
}
const pc = l => l.p && PILLARS[l.p] ? PILLARS[l.p].c : l.p==='fine' ? '#16a34a' : '#38bdf8';
function renderSide(){
 $('#side').innerHTML = `<div class="brand"><div class="brand-logo">AI</div><div><b>Guida AI</b><small>I 5 pilastri</small><div class="rev-line"><span class="rev-tag">Rev. ${REV}</span><span class="by-tag">App by Pippo</span></div></div></div>` +
  GROUPS.map(([k,label,c,n])=>{ const ls = LESSONS.map((l,i)=>[l,i]).filter(([l])=>l.p===k); if(!ls.length) return '';
   return `<div class="grp" style="--gc:${c}">${n?`<i>${n}</i>`:''}${label}</div>` + ls.map(([l,i])=>`<button class="li${i===cur?' on':''}" data-act="goi" data-i="${i}"><span class="ck${S.done[l.id]?' ok':''}">${S.done[l.id]?'✓':''}</span><span>${esc(l.t)}</span></button>`).join(''); }).join('') +
  `<button class="side-reset" data-act="reset">↺ Ricomincia da capo</button>`;
}
function progress(){
 const d = LESSONS.filter(l=>S.done[l.id]).length, pct = Math.round(d/LESSONS.length*100);
 setText('prog-l', `Lezione ${cur+1} di ${LESSONS.length}`); setText('prog-r', `${d} completate · ${pct}%`);
 $('#prog-i').style.width = pct + '%';
}
function render(){
 const l = LESSONS[cur], same = LESSONS.filter(x=>x.p===l.p), pos = same.indexOf(l)+1;
 const kick = l.p && PILLARS[l.p] ? `Pilastro ${PILLARS[l.p].n} · ${PILLARS[l.p].t}` : l.p==='fine' ? 'Conclusione' : 'Inizia da qui';
 const prev = LESSONS[cur-1], next = LESSONS[cur+1];
 $('#page').innerHTML = `<header class="lhead" style="--pc:${pc(l)}"><div class="lkick">${kick}</div><h1>${esc(l.t)}</h1><p>${esc(l.sub)}</p>
  <div class="meta"><span>📖 Lezione ${pos} di ${same.length}</span><span>⏱ circa ${l.min} minuti</span>${S.done[l.id]?'<span>✅ Completata</span>':''}</div></header>` +
  l.body() +
  `<nav class="lnav">${prev?`<button class="btn" data-act="goi" data-i="${cur-1}">← ${esc(prev.t)}</button>`:'<span></span>'}
   ${next?`<button class="btn primary" data-act="next">Ho capito, avanti →</button>`:`<button class="btn green" data-act="next">✓ Ho finito la guida</button>`}</nav>`;
 renderSide(); renderToolSel(); progress(); update(); saveProgress();
 $('#side').classList.remove('open');
 try{ history.replaceState(null,'','#'+l.id); }catch(e){}
}
function update(){ const l = LESSONS[cur]; if(l.update) l.update(); }
function toQz(){ const e = document.getElementById('qz') || $('#page'); window.scrollTo({top: Math.max(0, e.getBoundingClientRect().top + window.scrollY - 80), behavior:'smooth'}); }
function goTo(i){ if(i>=0 && i<LESSONS.length){ cur = i; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
async function copyText(t){
 try{ await navigator.clipboard.writeText(t); }
 catch(e){ const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
 toast('Copiato negli appunti ✓');
}
function onField(e){
 const t = e.target;
 if(t.dataset.k){
  if(t.type==='radio' && !t.checked) return;
  setPath(t.dataset.k, t.type==='checkbox' ? t.checked : t.type==='number' ? (t.value===''?'':Number(t.value)) : t.value);
  update(); return;
 }
 if(t.dataset.row){
  const r = S.map.rows.find(x=>x.id===t.dataset.row); if(!r) return;
  r[t.dataset.f] = ['volte','minuti','nec'].includes(t.dataset.f) ? (t.value===''?'':Number(t.value)) : t.value;
  update();
 }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('click', e=>{
 const el = e.target.closest('[data-act]'); if(!el) return;
 const d = el.dataset;
 switch(d.act){
  case 'goi': goTo(Number(d.i)); break;
  case 'go': goTo(LESSONS.findIndex(l=>l.id===d.to)); break;
  case 'next': S.done[LESSONS[cur].id] = true; if(cur < LESSONS.length-1) goTo(cur+1); else { render(); toast('Complimenti, guida completata! 🎉'); } break;
  case 'menu': $('#side').classList.toggle('open'); break;
  case 'copy': { const p = document.getElementById(d.src); if(p) copyText(p.textContent); break; }
  case 'download': { const p = document.getElementById(d.src); if(p){ download(d.name, p.textContent); toast('File '+d.name+' scaricato'); } break; }
  case 'set-tool': {
   const page = $('#page'), block = el.closest('#page > *'), idx = block ? [...page.children].indexOf(block) : -1, top = block ? block.getBoundingClientRect().top : 0;
   S.tool = d.tool; render();
   if(idx >= 0){ const nb = page.children[idx]; if(nb) window.scrollBy(0, nb.getBoundingClientRect().top - top); }
   toast('Istruzioni per ' + TOOLS[d.tool].l); break; }
  case 'reset': if(confirm('Vuoi azzerare le lezioni completate e lo strumento scelto?')){ try{ localStorage.removeItem(STORE); }catch(e){} initState(); cur = 0; render(); window.scrollTo({top:0}); toast('Guida azzerata'); } break;
  case 'ric': S.ric.f = d.f; render(); break;
  case 'qz-start': { const set = qzPick(); S.qz = {fase:'domanda', set, i:0, risposte:[], ordine:set.map(()=>shuffle([0,1,2,3]))}; render(); toQz(); break; }
  case 'qz-ans': { const Q = S.qz; if(Q.risposte[Q.i]) break; const o = Number(d.o); Q.risposte[Q.i] = {scelta:o, ok:o===0};
   const D = qzLoad(); D.viste[Q.set[Q.i]] = (D.viste[Q.set[Q.i]]||0) + 1; qzSave(D); render(); break; }
  case 'qz-next': { const Q = S.qz; if(Q.i < 9){ Q.i++; render(); toQz(); break; }
   const arg = {}; Q.set.forEach((qi,i)=>{ const a = QZ[qi].a; arg[a] = arg[a] || [0,0]; arg[a][1]++; if(Q.risposte[i] && Q.risposte[i].ok) arg[a][0]++; });
   const D = qzLoad(); D.storico.push({t:Date.now(), voto:Q.risposte.filter(y=>y&&y.ok).length, arg}); qzSave(D);
   Q.fase = 'fine'; render(); toQz(); break; }
  case 'qz-home': S.qz.fase = 'home'; render(); toQz(); break;
  case 'qz-reset': if(confirm('Vuoi azzerare tutti i risultati del quiz?')){ qzSave({storico:[], viste:{}}); S.qz.fase = 'home'; render(); toast('Risultati del quiz azzerati'); } break;
  case 'ric-l': S.ric.l = d.l; render(); break;
  case 'preset': applyPreset(S.prompt, PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'preset-skill': applyPreset(S.skill, SKILL_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'quiz': S.quiz[d.q] = d.a; render(); break;
  case 'add-row': S.map.rows.push({id:nid(), nome:'', volte:1, minuti:30, nec:5, tipo:'semplice'}); render();
   setTimeout(()=>{ const ins = document.querySelectorAll('[data-f="nome"]'); if(ins.length) ins[ins.length-1].focus(); }, 30); break;
  case 'del-row': S.map.rows = S.map.rows.filter(r=>r.id!==d.id); render(); break;
  case 'example-map': S.map.rows = MAP_EXAMPLE.map(r=>Object.assign({id:nid()}, r)); render(); break;
  case 'preset-app': applyPreset(S.app, APP_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'preset-agent': applyPreset(S.agente, AGENT_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
 }
});
initState();
const saved = loadProgress();
if(saved){ S.done = saved.done || {}; if(TOOLS[saved.tool]) S.tool = saved.tool; }
const hadHash = LESSONS.some(l=>'#'+l.id===location.hash);
{ let i = LESSONS.findIndex(l=>'#'+l.id===location.hash); if(i<0 && saved) i = LESSONS.findIndex(l=>l.id===saved.lesson); if(i>=0) cur = i; }
render();
if(saved && cur>0 && !hadHash) toast('Bentornato: riprendi da “' + LESSONS[cur].t + '”');
</script>
</body>
</html>
