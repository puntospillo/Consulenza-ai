<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guida AI · I 5 Pilastri</title>
<style>
:root{--navy:#0f1b2d;--navy2:#1a2b44;--ink:#1e293b;--muted:#5b6b82;--line:#e2e8f0;--bg:#f4f6fb;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--sh:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* Indice */
.side{background:var(--navy);color:#cbd5e1;position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px 24px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 16px;border-bottom:1px solid #22344f;margin-bottom:12px}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#0d9488 50%,#e11d48);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;color:#fff;font-size:16px;line-height:1.2}.brand small{color:#94a3b8;font-size:12.5px}
.grp{margin:12px 0 4px;padding:0 8px;font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gc,#94a3b8);display:flex;align-items:center;gap:8px}
.grp i{width:22px;height:22px;border-radius:6px;background:var(--gc);color:#fff;display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:#cbd5e1;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.3}
.li:hover{background:var(--navy2)}
.li.on{background:#fff;color:var(--ink);font-weight:600}
.ck{width:16px;height:16px;border-radius:50%;border:2px solid #475569;display:grid;place-items:center;font-size:10px;color:#fff}
.ck.ok{background:#22c55e;border-color:#22c55e}
.li.on .ck{border-color:#94a3b8}.li.on .ck.ok{border-color:#22c55e}
/* Barra superiore */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;align-items:center;gap:16px}
.menu-btn{display:none;border:1.5px solid #cbd5e1;background:#fff;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
.prog{flex:1;display:grid;gap:4px}
.prog-t{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.prog-bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#0d9488,#16a34a);transition:width .3s}
#page{max-width:980px;margin:0 auto;padding:26px 28px 40px;display:grid;gap:20px}
/* Intestazione lezione */
.lhead{background:linear-gradient(120deg,var(--navy),#1f3a5f);color:#fff;border-radius:18px;padding:24px 28px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.lhead:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--pc)}
.lkick{font-size:12.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:color-mix(in srgb,var(--pc) 45%,#fff)}
.lhead h1{margin:4px 0 6px;font-size:30px;line-height:1.2}
.lhead p{margin:0;color:#cbd5e1;font-size:17px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.meta span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 12px;font-size:13px}
/* Blocchi di contenuto */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 26px;box-shadow:var(--sh);min-width:0}
.card h2{margin:0 0 8px;font-size:21px}
.card h3{margin:16px 0 6px;font-size:17px}
.card p{margin:0 0 10px}
.card ul,.card ol{margin:0 0 10px;padding-left:22px}
.card li{margin:3px 0}
.lead{color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.analogy{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;background:linear-gradient(90deg,#eef2ff,#fff);border:1px solid #c7d2fe;border-radius:16px;padding:16px 20px}
.analogy .ic{font-size:36px;text-align:center}.analogy b.at{display:block;color:#3730a3}
.keys{background:#f0fdf4;border:1px solid #bbf7d0;border-left:6px solid var(--green);border-radius:14px;padding:16px 22px}
.keys h3{margin:0 0 6px;color:#166534;font-size:15px;text-transform:uppercase;letter-spacing:.8px}
.keys ul{margin:0;padding-left:20px}
.warn{background:#fffbeb;border:1px solid #fde68a;border-left:6px solid var(--amber);border-radius:14px;padding:14px 20px}
.note{background:#eff6ff;border:1px solid #bfdbfe;border-left:6px solid var(--blue);border-radius:14px;padding:14px 20px}
.warn b.t,.note b.t{display:block}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ex>div{border-radius:14px;padding:14px 16px;border:1.5px solid}
.ex .bad{background:#fef2f2;border-color:#fecaca}.ex .good{background:#f0fdf4;border-color:#bbf7d0}
.ex .lab{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.ex .bad .lab{color:#b91c1c}.ex .good .lab{color:#15803d}
.ex pre{margin:0;white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ex .why{font-size:14px;margin-top:8px;color:#334155}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
.steps>li{counter-increment:s;position:relative;padding:3px 0 3px 44px;min-height:32px;margin:0}
.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--pc,var(--blue));color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.letter-card{border-radius:14px;padding:14px;background:#fff;border:1.5px solid #c7d2fe;text-align:center}
.letter-card .L{width:44px;height:44px;border-radius:12px;background:#4f46e5;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;margin:0 auto 6px}
.letter-card b{display:block}.letter-card small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.chat{display:grid;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px}
.bub.u{justify-self:end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.bub.a{justify-self:start;background:#f1f5f9;border-bottom-left-radius:4px}
.bub small{display:block;font-size:11.5px;font-weight:700;opacity:.8;margin-bottom:2px}
/* Tabelle */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{background:#f1f5f9;text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:#475569;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef2f6;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl input,.tbl select{padding:6px 8px;font-size:14px}
code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 6px;font-size:.9em}
/* Esercizio */
.try{border:2px solid var(--pc,#2563eb);border-radius:18px;padding:22px 24px;background:#fff;box-shadow:var(--sh)}
.try-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.try-h span{background:var(--pc,#2563eb);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:1px;border-radius:999px;padding:4px 12px}
.try-h h2{margin:0;font-size:21px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 16px;margin:12px 0}
.field{display:grid;gap:5px;align-content:start}.field.wide{grid-column:1/-1}
.field>span{font-size:14px;font-weight:700;color:#334155}
.hint{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px}.presets>span{font-size:14px;color:var(--muted);font-weight:600}
.chip-btn{border:1.5px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip-btn:hover{background:#e0e7ff}
.btn{border:1.5px solid #cbd5e1;background:#fff;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#94a3b8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.icon-btn{border:0;background:#fee2e2;color:var(--red);width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.out{background:#0b1220;border-radius:14px;overflow:hidden;margin-top:12px}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:#111a2e;color:#93c5fd;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;flex-wrap:wrap}
.out-h div{display:flex;gap:6px}
.out-h button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
.out-h button.dl{background:#16a34a}
.out pre{margin:0;padding:14px 16px;color:#e2e8f0;white-space:pre-wrap;word-wrap:break-word;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:520px;overflow:auto}
.meter{margin:6px 0}.meter-bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}.meter-bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#16a34a);transition:width .25s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#f1f5f9;color:#94a3b8;border:1px solid var(--line)}
.chip.on{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.badge{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--bc) 12%,#fff);color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 35%,#fff)}
.ver{display:grid;gap:6px;margin-top:8px}.ver div{font-size:14px;border-radius:8px;padding:6px 10px}
.ver .ok{background:#dcfce7;color:#166534}.ver .ko{background:#fef3c7;color:#92400e}
/* Markdown */
.md-live{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.md-live textarea{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:340px}
.md-view{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;background:#fcfdff;min-height:340px;overflow:auto}
.md-view h1{font-size:22px;margin:4px 0 8px}.md-view h2{font-size:18px;margin:12px 0 6px}.md-view h3{font-size:16px;margin:10px 0 4px}
.md-view p{margin:0 0 8px}.md-view ul,.md-view ol{margin:0 0 8px;padding-left:22px}
.md-view .fm{background:#f5f3ff;border:1px dashed #a78bfa;border-radius:8px;padding:8px 12px;font:13px/1.5 ui-monospace,Menlo,monospace;color:#5b21b6;margin-bottom:10px;white-space:pre-wrap}
.tree{font:14.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b1220;color:#e2e8f0;border-radius:12px;padding:14px 18px;white-space:pre}
.tree b{color:#93c5fd}.tree i{color:#94a3b8;font-style:normal}
/* Niente scorrimento orizzontale della pagina su telefono */
#page>*,.grid2>*,.grid3>*,.form>*,.steps>li,.how-body,.tab-body{min-width:0}
.tree{overflow-x:auto;max-width:100%}
code,.path{overflow-wrap:anywhere}
.card p,.card li,.note,.warn,.keys{overflow-wrap:break-word}
.diagram svg{width:100%;height:auto;max-height:470px;display:block;margin:0 auto;font-family:inherit}
.clickable{cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scale>div{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--bc) 9%,#fff);border:1px solid color-mix(in srgb,var(--bc) 30%,#fff);border-left:5px solid var(--bc)}
.scale b{display:block;color:var(--bc)}.scale span{font-size:14.5px}
.quiz{display:grid;gap:10px}
.qopt{text-align:left;border:1.5px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}
.qopt:hover{border-color:#2563eb}
.qres{border-radius:12px;padding:12px 16px;background:#0f1b2d;color:#fff;margin-top:6px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.week{border-radius:14px;border:1px solid var(--line);border-top:5px solid var(--pc);padding:14px;background:#fff}
.week b{display:block;color:var(--pc)}.week ul{padding-left:18px;margin:6px 0 0;font-size:14.5px}
.pillar-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.pc{border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left}
.pc:hover{box-shadow:var(--sh)}.pc b{display:block;color:var(--pc);font-size:13px}.pc span{font-size:14px}
/* Navigazione lezioni */
.lnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding:16px 0 0;border-top:1px solid var(--line)}
.lnav .btn{padding:13px 20px;font-size:16px;white-space:normal;max-width:100%}
.btn{max-width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Strumento scelto */
.toolsel{display:flex;align-items:center;gap:3px;background:#f1f5f9;border:1px solid var(--line);border-radius:11px;padding:3px}
.toolsel>span{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px}
.toolsel button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13.5px;color:#475569;cursor:pointer}
.toolsel button:hover{background:#e2e8f0}
.toolsel button.on{background:var(--tc);color:#fff}
.toolsel.pick{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.toolpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.tp{display:grid;gap:4px;align-content:start;text-align:left;border:2px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:14px 16px;background:#fff;cursor:pointer}
.tp:hover{border-color:var(--tc)}
.tp>b{font-size:21px;color:var(--tc)}.tp>small{color:var(--muted);font-size:12.5px;margin-top:-4px}.tp>span{font-size:14px;color:#334155;line-height:1.5}
.tp>i{font-style:normal;font-weight:800;font-size:13px;color:var(--tc);margin-top:6px}
.tp.on{background:color-mix(in srgb,var(--tc) 8%,#fff);border-color:var(--tc)}
.how{border:1px solid color-mix(in srgb,var(--tc,#94a3b8) 40%,#fff);border-radius:14px;overflow:hidden;margin:6px 0;min-width:0}
.how-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--tc,#94a3b8) 10%,#fff);font-size:13.5px;color:#334155}
.how-bar b{color:var(--tc)}
.how-dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.how-body{padding:14px 18px;background:#fff;min-width:0}
.how-body h3:first-child{margin-top:0}
.path{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 7px;font-weight:700;font-size:.92em}
.rule{margin-top:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:15px}
.rule>b:first-child{display:block;color:#166534;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.dl-badge,.ok-badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;line-height:1.6}
.dl-badge{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.ok-badge{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.aimake{border:2px dashed #a78bfa;border-radius:18px;padding:18px 22px;background:linear-gradient(135deg,#faf5ff,#fff);min-width:0}
.aimake-h span{font-size:12px;font-weight:800;letter-spacing:1px;color:#7c3aed}
.aimake-h h2{margin:2px 0 6px;font-size:20px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.levels>div{display:grid;gap:4px;align-content:start;border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:12px;padding:12px;background:#fff}
.levels b{color:var(--pc);font-size:14.5px}.levels span{font-size:13.5px;color:#334155;line-height:1.45}.levels em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}
.where>span:first-child{color:var(--muted);font-weight:600}
.where .alt{flex-basis:100%;color:#475569;font-size:13.5px}
.case,.recipe{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--sh);min-width:0}
.case{border-left:6px solid #e11d48}
.case-h{display:flex;gap:14px;align-items:flex-start}.case-ic{font-size:32px;line-height:1}
.case-h h2{margin:0 0 4px;font-size:19px}.case-h p{margin:0;color:#334155}
.recipe-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.recipe-h h3{margin:0;font-size:17px;flex-basis:100%}
.recipe-desc{margin-top:8px;font-size:15px}.recipe-desc p{margin:0 0 4px}
.recipe-tip{margin:10px 0 0;font-size:14.5px;color:#334155;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip-btn small{opacity:.7;font-weight:600}
.chip-btn.on{background:#4f46e5;border-color:#4f46e5;color:#fff}
.side-reset{display:block;width:calc(100% - 16px);margin:18px 8px 0;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer}
.side-reset:hover{color:#fff;border-color:#64748b}
/* Quiz finale */
.qz-hero{display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,#4f46e5,#0d9488 55%,#e11d48);color:#fff;border-radius:22px;padding:28px 30px;box-shadow:0 14px 34px rgba(79,70,229,.25);position:relative;overflow:hidden}
.qz-hero:after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;border-radius:50%;background:rgba(255,255,255,.12)}
.qz-hero>*{position:relative;z-index:1}
.qz-hero-ic{font-size:68px;line-height:1}
.qz-kick{font-size:12px;font-weight:800;letter-spacing:1.4px;opacity:.9}
.qz-hero h2{margin:4px 0 6px;font-size:30px}.qz-hero p{margin:0 0 16px;opacity:.95;max-width:640px}
.qz-start{border:0;background:#fff;color:#4338ca;font-weight:800;font-size:16px;border-radius:13px;padding:13px 22px;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.18);transition:transform .15s}
.qz-start:hover{transform:translateY(-2px)}
.qz-end .qz-start{background:linear-gradient(90deg,#4f46e5,#0d9488);color:#fff}
.qz-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.qz-stats div{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;text-align:center;box-shadow:var(--sh)}

.qz-bars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:24px}
.qz-bar{flex:1;max-width:58px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.qz-bar i{display:block;width:100%;border-radius:9px 9px 3px 3px;position:relative;animation:qzGrow .6s ease-out}
.qz-bar em{position:absolute;top:-21px;left:0;right:0;text-align:center;font-style:normal;font-weight:800;font-size:13px;color:#334155}
.qz-bar span{font-size:11.5px;color:var(--muted);margin-top:5px}

.qz-card{background:#fff;border-radius:22px;padding:24px 28px;box-shadow:0 12px 32px rgba(79,70,229,.13);border:2px solid #e0e7ff;min-width:0}
.qz-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}

.qz-score{margin-left:auto;font-weight:800;color:#15803d}
.qz-dots{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}

.qz-dots .ok{background:#16a34a;color:#fff}.qz-dots .ko{background:#dc2626;color:#fff}.qz-dots .cur{background:#4f46e5;color:#fff;box-shadow:0 0 0 3px #c7d2fe}
.qz-arg-tag{display:inline-block;margin-top:14px;background:#eef2ff;color:#4338ca;border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.qz-q{font-size:23px;margin:10px 0 18px;line-height:1.35}
.qz-opts{display:grid;gap:10px}
.qz-opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid #e2e8f0;background:#fff;border-radius:14px;padding:12px 14px;font-size:16px;cursor:pointer;transition:all .15s}
.qz-opt:hover:not([disabled]){border-color:#6366f1;background:#f5f3ff;transform:translateX(4px)}
.qz-opt[disabled]{cursor:default}
.qz-letter{flex:none;width:34px;height:34px;border-radius:10px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:800}
.qz-mark{margin-left:auto;font-weight:800;font-size:19px}
.qz-opt.ok{border-color:#16a34a;background:#f0fdf4}.qz-opt.ok .qz-letter{background:#16a34a;color:#fff}.qz-opt.ok .qz-mark{color:#16a34a}
.qz-opt.ko{border-color:#dc2626;background:#fef2f2}.qz-opt.ko .qz-letter{background:#dc2626;color:#fff}.qz-opt.ko .qz-mark{color:#dc2626}
.qz-opt.dim{opacity:.55}

.qz-fb.ok{background:#f0fdf4;border:1px solid #bbf7d0}.qz-fb.ko{background:#fffbeb;border:1px solid #fde68a}
.qz-next{border:0;background:linear-gradient(90deg,#4f46e5,#0d9488);color:#fff;font-weight:800;font-size:15px;border-radius:11px;padding:11px 18px;cursor:pointer}
@keyframes qzIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

@keyframes qzRing{from{stroke-dasharray:0 400}}
.qz-big-ic{font-size:46px;line-height:1}
.qz-end h2{margin:6px 0 4px;font-size:24px}.qz-end p{margin:0 0 6px}
.qz-confetti{text-align:center;font-size:30px;letter-spacing:6px;margin-top:12px;animation:qzIn .6s ease}

.rev-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:4px}

/* ============ HELPER ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v = (x, ph) => (x != null && String(x).trim()) ? String(x).trim() : '[' + ph + ']';
const fmt = n => Math.round(Number(n)||0).toLocaleString('it-IT');
const fmt1 = n => (Number(n)||0).toLocaleString('it-IT',{maximumFractionDigits:1});
const trunc = (s,n) => { s = String(s||''); return s.length > n ? s.slice(0,n-1) + '…' : s; };
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const lines = t => String(t||'').split('\n').map(s=>s.trim().replace(/^[-•]\s*/,'')).filter(Boolean);
function getPath(p){ return p.split('.').reduce((o,k)=> o == null ? undefined : o[k], S); }
function setPath(p,val){ const ks=p.split('.'); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
function setHTML(id,h){ const e=document.getElementById(id); if(e) e.innerHTML=h; }
function setText(id,t){ const e=document.getElementById(id); if(e) e.textContent=t; }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }
function badge(l,c){ return `<span class="badge" style="--bc:${c}">${esc(l)}</span>`; }
const applyPreset = (target, p) => { const {label, ...val} = p; Object.assign(target, val); };

/* Mini renderer Markdown: titoli, elenchi, grassetto, corsivo, codice, frontmatter */
function mdToHtml(src){
 let t = String(src||''), fm = '';
 const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
 if(m){ fm = `<div class="fm">---\n${esc(m[1])}\n---</div>`; t = t.slice(m[0].length); }
 const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>');
 const out = []; let list = null;
 const close = () => { if(list){ out.push(`</${list}>`); list = null; } };
 t.split('\n').forEach(l=>{
  let r;
  if((r = l.match(/^(#{1,3})\s+(.*)/))){ close(); out.push(`<h${r[1].length}>${inline(r[2])}</h${r[1].length}>`); }
  else if((r = l.match(/^\s*[-*]\s+(.*)/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li>${inline(r[1])}</li>`); }
  else if((r = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push(`<li>${inline(r[1])}</li>`); }
  else if(!l.trim()){ close(); }
  else { close(); out.push(`<p>${inline(l)}</p>`); }
 });
 close();
 return fm + out.join('');
}

function fld(k,label,o={}){
 const val = getPath(k) ?? '';
 let ctl;
 if(o.type==='area') ctl = `<textarea data-k="${k}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`;
 else if(o.type==='select') ctl = `<select data-k="${k}">${o.opts.map(([x,l])=>`<option value="${esc(x)}"${String(x)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
 else ctl = `<input type="${o.type||'text'}" data-k="${k}" value="${esc(val)}" placeholder="${esc(o.ph||'')}"${o.min!=null?` min="${o.min}"`:''}>`;
 return `<label class="field${o.wide?' wide':''}"><span>${label}</span>${ctl}${o.hint?`<small class="hint">${o.hint}</small>`:''}</label>`;
}

 chatgpt: `<p><b>Strumento: l’app ChatGPT per computer</b>. Contiene <b>Chat</b>, <b>Work</b> (agente per documenti, fogli, presentazioni e cartelle) e <b>Codex</b> (per creare app e programmi). Non serve il Terminale.</p>` + stepsL(TOOLS.chatgpt.c,[

  'Scarica l’app da <b>claude.com/download</b> (Mac o Windows), installala e accedi.',

  '<b>Modalità di approvazione</b> di Cowork, nella casella: <b>Manuale</b> (predefinita, chiede prima delle azioni) oppure <b>Automatica</b> (procede e controlla la sicurezza di ogni azione). <b>All’inizio usa Manuale.</b> Quando scegli una cartella puoi aggiungere anche <b>istruzioni per quella cartella</b>.',

const DEC_Q = [
 ['file','Su quali file lavori?',[['nessuno','Nessun file, solo testo'],['pochi','1–10 file che posso caricare'],['tanti','Tanti file, in una cartella del computer']]],
 ['riserv','I dati sono riservati (personale, contratti, salute, dati di persone)?',[['no','No'],['si','Sì']]],
 ['web','Serve internet?',[['no','No'],['ricerca','Sì, per cercare informazioni'],['azioni','Sì, per fare azioni sui siti (compilare, raccogliere dati)']]],
 ['consulta','Devi consultare tanti documenti e avere risposte con i riferimenti?',[['no','No'],['si','Sì']]],
 ['ripeti','Vuoi uno strumento da riusare (un’app o un programma)?',[['no','No'],['si','Sì']]]
];
function decide(){
 const D = S.dec, why = [];
 let k = 'chat';
 if(D.ripeti==='si'){ k = D.file==='nessuno' && D.riserv==='no' ? 'appchat' : 'app'; why.push(k==='app' ? 'Vuoi uno strumento da riusare che lavora su file: serve un’app sul computer.' : 'Un’app semplice, senza file: la crei e la provi direttamente nella chat.'); }
 else if(D.consulta==='si'){ k = 'docs'; why.push('Consultare tanti documenti con riferimenti precisi.'); }
 else if(D.file==='tanti' || D.riserv==='si' && D.file!=='nessuno'){ k = 'local'; why.push(D.file==='tanti' ? 'I file sono tanti e stanno in una cartella: meglio un agente che lavora sul computer.' : 'I dati sono riservati: meglio lavorarli sul computer invece di caricarli in chat.'); }
 else if(D.web==='azioni'){ k = 'agentweb'; why.push('Servono azioni in più passaggi sui siti web.'); }
 else if(D.web==='ricerca'){ k = 'web'; why.push('Serve una ricerca sul web con fonti.'); }
 else { why.push(D.file==='pochi' ? 'Pochi file che puoi caricare: basta la chat.' : 'Solo testo: basta la chat con un buon prompt.'); }
 if(D.riserv==='si') why.push('Dati riservati: usa l’account aziendale, anonimizza quando puoi, oppure fatti creare un programma che elabora i dati in locale (Pilastro IV).');
 return {k, why};
}

function buildPrompt(){
 const P = S.prompt, out = [];
 const add = (h,b) => { if(b && String(b).trim()) out.push('# '+h+'\n'+String(b).trim()); };
 add('CONTESTO', P.contesto); add('RUOLO', P.ruolo ? 'Agisci come '+P.ruolo+'.' : '');
 add('AZIONE', (P.azione||'') + (P.destinatario ? '\nDestinatario: '+P.destinatario : ''));
 add('VINCOLI', lines(P.vincoli).map(x=>'- '+x).join('\n'));
 add('FORMATO', P.formato); add('TONO', P.tono);
 if(P.materiali && P.materiali.trim()) out.push('# MATERIALI\nUsa solo le informazioni tra <materiali> e </materiali>.\n<materiali>\n'+P.materiali.trim()+'\n</materiali>');
 const q = [];
 if(P.domande) q.push('- Se ti mancano informazioni importanti, fammi prima le domande necessarie.');
 if(P.assunzioni) q.push('- In fondo elenca le assunzioni che hai fatto e cosa devo verificare.');
 if(q.length && out.length) out.push('# CONTROLLO\n'+q.join('\n'));
 return out.join('\n\n') || 'Compila i campi qui sopra: il prompt si costruisce da solo.';
}
L({id:'p1-prova', p:'p1', t:'Scrivi il tuo primo prompt CRAFT', sub:'Esercizio guidato', min:8, body:()=>`

L({id:'p1-migliorare', p:'p1', t:'Migliorare il risultato', sub:'Domande, prime bozze e correzioni mirate', min:6, body:()=>`

const VERIFY_PROMPT = `Rileggi la tua risposta precedente come un revisore severo.
Per ogni affermazione indica se è:

const ANTI_ALL = `# AFFIDABILITÀ
- Se non sei sicuro di un’informazione, dillo chiaramente: preferisco “non lo so” a una risposta inventata.

- Distingui i fatti dalle tue ipotesi e in fondo elenca le assunzioni fatte.

L({id:'p1-allucinazioni', p:'p1', t:'Risultati affidabili, senza allucinazioni', sub:'Perché l’AI a volte inventa e come impedirlo', min:9, body:()=>`
 ${analogy('🎓','Lo studente all’interrogazione','<p style="margin:4px 0 0">Uno studente che non sa la risposta spesso non resta zitto: dice qualcosa di <b>plausibile</b>. L’AI fa lo stesso. È costruita per produrre testo convincente e, se le mancano informazioni, tende a <b>riempire i buchi</b>. Queste invenzioni si chiamano <b>allucinazioni</b>: sembrano vere, ed è questo il pericolo.</p>')}

  <p class="hint" style="margin-top:8px">Ancora meglio: incolla domanda e risposta in una <b>chat nuova</b>, che non è “affezionata” alla risposta, e chiedi <i>“trova gli errori in questa risposta”</i>.</p>`)}

 ${warn('Cosa controlli sempre tu, prima di usare un risultato','<ul style="margin:6px 0 0"><li><b>Numeri e totali</b>: 2–3 a campione sul file originale.</li><li><b>Nomi, date, importi</b> nei documenti ufficiali.</li><li><b>Riferimenti a leggi, contratti, norme</b>: apri la fonte.</li><li><b>Link e citazioni</b>: cliccali.</li><li>Tutto ciò che <b>invii all’esterno</b> o che porta a una decisione importante.</li></ul><p style="margin:8px 0 0">L’AI prepara, <b>la responsabilità del risultato resta tua</b>.</p>')}

const FILE_TIPI = {
 excel:{l:'Excel o CSV', first:'dimmi quanti fogli, righe e colonne hai letto e mostrami le prime 5 righe.', ctrl:['Esegui i calcoli con il codice, non stimarli.','Segnala celle vuote, doppioni e valori strani invece di correggerli in silenzio.']},
 word:{l:'Word', first:'dimmi quante pagine e sezioni hai letto e fammi un indice in 5 righe.', ctrl:['Per ogni informazione indica la sezione o il paragrafo da cui la prendi.']},
 pdf:{l:'PDF', first:'dimmi quante pagine hai letto e se ci sono pagine scansionate difficili da leggere.', ctrl:['Per ogni informazione indica la pagina.','Riporta numeri e nomi esattamente come sono scritti.']},
 ppt:{l:'PowerPoint', first:'elenca numero e titolo di ogni slide.', ctrl:['Indica sempre a quale slide ti riferisci.']}
};
const USCITE = {
 chat:{l:'Risposta in chat', p:'Rispondi in chat, con titoli brevi e tabelle dove servono.'},
 xlsx:{l:'File Excel da scaricare', p:'Restituiscimi un file Excel (.xlsx) da scaricare, con intestazioni chiare e un foglio per ogni tabella.'},
 docx:{l:'Documento Word da scaricare', p:'Restituiscimi un documento Word (.docx) da scaricare, con titoli e paragrafi ordinati.'},
 pptx:{l:'Presentazione PowerPoint da scaricare', p:'Restituiscimi una presentazione PowerPoint (.pptx) da scaricare: una idea per slide, massimo 40 parole per slide.'},
 pdf:{l:'PDF da scaricare', p:'Restituiscimi un PDF da scaricare, pronto da stampare.'}
};
function fileText(){
 const F = S.file, T = FILE_TIPI[F.tipo] || FILE_TIPI.excel, st = lines(F.passi);
 return `# CONTESTO
Ti allego il file ${F.nome.trim() ? '“'+F.nome.trim()+'”' : '[nome del file]'} (${T.l}).
Contiene: ${v(F.contenuto,'cosa contiene: fogli, colonne, pagine, periodo')}

# OBIETTIVO
${v(F.obiettivo,'cosa vuoi ottenere e a cosa ti serve')}

# COME PROCEDERE
1. Prima di tutto ${T.first}
${st.length ? st.map((x,i)=>(i+2)+'. '+x).join('\n') : '2. Svolgi il lavoro richiesto.'}

# RISULTATO
${(USCITE[F.uscita] || USCITE.chat).p}

# CONTROLLI
${T.ctrl.map(x=>'- '+x).join('\n')}
- Non inventare dati: dove un’informazione manca scrivi DA VERIFICARE.
- In fondo elenca cosa devo controllare io.`;
}
const RIASSUNTO_PROMPT = `Riassumi questa conversazione per continuarla in una chat nuova.
Includi solo:
- obiettivo del lavoro
- decisioni prese
- dati, numeri e nomi importanti
- file usati e cosa contengono
- cosa resta da fare
- regole di stile e formato da rispettare
Massimo 250 parole, in un testo pronto da incollare all’inizio della nuova chat.`;
function tokCalc(){
 const T = S.tok, n = Math.max(1, Math.min(200, Number(T.msg)||1)), perMsg = Math.max(10,(Number(T.parole)||0))*1.5*2, att = Math.max(0,Number(T.pagine)||0)*700, k = Math.max(1, Number(T.ogni)||5);
 let unica = 0; for(let i=1;i<=n;i++) unica += att + i*perMsg;
 let divise = 0; for(let i=1;i<=n;i++){ const pos = ((i-1)%k)+1; divise += att + pos*perMsg + (i>k ? 400 : 0); }
 return {n, unica:Math.round(unica), divise:Math.round(divise)};
}
L({id:'p1-token', p:'p1', t:'Usare meno token (e non finire i limiti)', sub:'Come lavora “il contatore” dell’AI, le abitudini e l’organizzazione di skill e file .md per risparmiare', min:13, body:()=>`
 ${analogy('⛽','Il serbatoio dell’AI','<p style="margin:4px 0 0">Ogni piano ha un “serbatoio” di utilizzo che si ricarica dopo un certo tempo. Si misura in <b>token</b>: pezzi di parole (in italiano, più o meno una sillaba o una parola corta). Si consumano token sia per <b>tutto quello che l’AI legge</b> sia per <b>tutto quello che scrive</b>. Guidare bene fa fare più chilometri con lo stesso pieno.</p>')}
 ${card('Il punto che quasi nessuno sa: a ogni messaggio l’AI rilegge tutto', `<p>Quando scrivi il decimo messaggio di una chat, l’AI non legge solo quello: <b>rilegge tutta la conversazione</b>, gli allegati, le istruzioni personali e quelle del progetto. Per questo una chat lunga consuma sempre di più, anche per domande brevi.</p>
 ${tbl(['Cosa consuma token','Quanto'],[
  ['Una domanda breve in una chat nuova','🟢 Poco'],
  ['Istruzioni personali e del progetto','🟡 Poco, ma a <b>ogni</b> messaggio: tienile brevi'],

  ['Una chat di 40 messaggi sullo stesso tema','🔴 Moltissimo: ogni messaggio rilegge tutto'],
  ['Modelli “ragionamento”, Deep Research, immagini','🔴 Molto'],
  ['Un agente che lavora per un’ora su una cartella','🔴 Moltissimo'],
  ['Una mini-app creata dall’AI che poi lavora da sola','🟢 Zero: il programma non usa l’AI']
 ])}`)}
 ${tryBox('Guarda quanto pesa una chat lunga', `<p>Una stima semplice per capire l’effetto: cambia i numeri e confronta una chat unica con chat nuove ripartendo da un riassunto.</p>
  <div class="form">
   ${fld('tok.msg','Quanti messaggi scrivi sullo stesso lavoro',{type:'number',min:1})}
   ${fld('tok.parole','Parole medie per messaggio (tuo + risposta)',{type:'number',min:10})}
   ${fld('tok.pagine','Pagine di documenti allegati',{type:'number',min:0})}
   ${fld('tok.ogni','Apro una chat nuova ogni … messaggi',{type:'number',min:1})}
  </div><div id="tok-out"></div>`)}
 ${card('Le 12 abitudini che fanno risparmiare', `<ol class="steps" style="--pc:#4f46e5">
  <li><b>Una chat per argomento.</b> Cambi tema? Chat nuova.</li>
  <li><b>Chat lunga? Riassumi e riparti.</b> Usa il prompt qui sotto e incolla il riassunto in una chat nuova.</li>
  <li><b>Correggi modificando il messaggio</b> (icona matita) invece di aggiungere “no, intendevo…”: la parte sbagliata non resta nella conversazione.</li>
  <li><b>Un messaggio completo, non dieci piccoli.</b> Un prompt CRAFT chiaro evita giri di correzioni.</li>
  <li><b>Chiedi solo ciò che serve.</b> “Solo la tabella, senza introduzione né conclusioni.”</li>
  <li><b>Modifiche puntuali.</b> “Riscrivi solo il paragrafo 3” invece di “rifai tutto il documento”.</li>
  <li><b>Il modello giusto.</b> Veloce per compiti semplici; quello con ragionamento solo per analisi difficili.</li>

L({id:'p1-chaining', p:'p1', t:'Lavori complessi: un passo alla volta', sub:'Il prompt chaining', min:6, body:()=>`
 ${card('Non chiedere tutto insieme', `<p>Per lavori importanti (analizzare più documenti, preparare una presentazione, scrivere una proposta) una sola richiesta produce risultati difficili da controllare. Meglio fare come faresti tu: <b>prima capisci, poi imposti, poi scrivi, poi rivedi</b>.</p>
 <p>Il <b>prompt chaining</b> (catena di prompt) divide il lavoro in passaggi. Il risultato di un passaggio diventa il punto di partenza del successivo. <b>Tra un passaggio e l’altro controlli tu.</b></p>
 <div class="diagram">${chainSVG()}</div>`)}
 ${card('Esempio: una presentazione partendo da 3 documenti', `<ol class="steps" style="--pc:#4f46e5">
  <li><b>Analisi</b><br><code>Leggi i 3 documenti allegati. Non scrivere ancora la presentazione. Dividi le informazioni in: dati, decisioni prese, questioni aperte, informazioni mancanti.</code><br><small class="hint">✋ Controlli: i dati sono giusti? Manca qualcosa?</small></li>
  <li><b>Struttura</b><br><code>Usando solo l’analisi qui sopra, proponi la scaletta di 8 slide per la direzione. Per ogni slide: titolo e messaggio chiave.</code><br><small class="hint">✋ Controlli: la scaletta racconta la storia giusta?</small></li>
  <li><b>Bozza</b><br><code>Crea la presentazione PowerPoint seguendo la scaletta approvata. Massimo 40 parole per slide, note del relatore per ogni slide.</code><br><small class="hint">✋ Controlli: contenuto, grafici e tono.</small></li>
  <li><b>Revisione</b><br><code>Rivedi la presentazione: segnala frasi poco chiare, numeri non presenti nei documenti e assunzioni. Poi dammi la versione corretta.</code></li>
 </ol>`)}
 ${card('Altri lavori da fare a catena', tbl(['Lavoro','I passaggi'],[

function persText(){
 const P = S.pers, ev = lines(P.evitare), out = [];
 out.push(`# CHI SONO
${v(P.ruolo,'il tuo ruolo, es. responsabile amministrativo')}${P.lavoro.trim() ? '\n'+P.lavoro.trim() : '\n[in che azienda o settore lavori, di cosa ti occupi]'}
Di solito scrivo per: ${v(P.pubblico,'colleghi, direzione, fornitori…')}`);
 out.push(`# COME VOGLIO LE RISPOSTE
- In italiano. ${({lei:'Nei testi per l’esterno tono formale, dare del lei.', tu:'Tono cordiale, dare del tu.', misto:'Dare del lei nei testi per l’esterno, del tu con i colleghi.'})[P.tono]}
- ${({sintetiche:'Risposte sintetiche: prima la risposta, poi i dettagli solo se servono.', medie:'Risposte complete ma senza giri di parole.', dettagliate:'Risposte dettagliate, con spiegazioni passo passo ed esempi.'})[P.lunghezza]}
${P.formato.trim() ? '- '+P.formato.trim()+'\n' : ''}- Se la richiesta non è chiara, fammi una domanda prima di rispondere.${ev.length ? '\n- Evita: '+ev.join('; ')+'.' : ''}`);
 const a = [];
 if(P.nonloso) a.push('- Se non sei sicuro di un’informazione, dillo chiaramente: preferisco “non lo so” a una risposta inventata.');
 if(P.fonti) a.push('- Quando ti do documenti o file, usa solo quelli e indica pagina o sezione. Dove un dato manca scrivi NON TROVATO.');
 if(P.ipotesi) a.push('- Distingui i fatti dalle tue ipotesi e in fondo elenca le assunzioni fatte.');
 if(P.calcoli) a.push('- Per calcoli e dati da file esegui codice, non stimare.');
 if(P.web) a.push('- Per informazioni che cambiano nel tempo (leggi, prezzi, scadenze) cerca sul web e indica fonte e data, oppure avvisami che potrebbero non essere aggiornate.');
 if(a.length) out.push('# AFFIDABILITÀ\n' + a.join('\n') + '\n- Non inventare nomi, numeri, citazioni, link o riferimenti normativi.');
 return out.join('\n\n');
}

   ${cb('pers.web','Informazioni che cambiano: cercare sul web e indicare fonte e data')}</div>
 </div><div id="pers-out"></div>`)}
 ${card(`Dove incollarle e come usare memoria e stili in ${toolName()}`, howBox('personal'))}
 ${card('Personalizzare con gli esempi: mostra, non spiegare', `<p>Descrivere il proprio stile è difficile; mostrarlo è facile. Dai all’AI <b>2–3 testi fatti bene</b> (email, report, offerte) e chiedile di ricavarne le regole.</p>
 ${ex('Scrivi la mail con il mio stile.',
`Ti allego 3 email che ho scritto io.
1. Analizza il mio stile: lunghezza delle frasi,
   saluti, tono, parole ricorrenti, struttura.
2. Descrivilo in massimo 8 regole.
3. Usa quelle regole per scrivere la risposta
   a questa email: [incolla].`,
 'L’AI non conosce il tuo stile: userà il suo, generico.',
 'Le regole ricavate dagli esempi si possono salvare nelle istruzioni personali, in un Progetto o in una skill.')}
 <ul style="margin-top:12px">
  <li><b>Glossario</b>: un file con i termini della tua azienda (“diciamo <i>commessa</i>, non <i>progetto</i>”).</li>
  <li><b>Guida di stile</b>: un file .md con le regole di scrittura dell’azienda, da mettere nei progetti.</li>
  <li><b>Modelli</b>: il report o l’offerta fatti bene come esempio da imitare.</li>
 </ul>`)}
 ${card('Insegnare con le correzioni', `<ol class="steps" style="--pc:#0d9488">
  <li>Quando un risultato non va, correggilo con precisione: <i>“I prezzi vanno sempre IVA esclusa.”</i></li>
  <li>Se la regola vale sempre, aggiungi: <i>“Ricordalo per le prossime volte.”</i> (serve la memoria attiva), oppure copiala nelle istruzioni personali.</li>
  <li>Se vale solo per un tema, chiedi: <i>“Aggiungi questa regola alle istruzioni del progetto”</i> e incollala lì.</li>

 </ol>`)}
 ${aiMake('ai-pers','Le tue istruzioni personali', `Aiutami a scrivere le mie istruzioni personali per l’AI.
Intervistami con domande semplici, una alla volta, su:
- il mio ruolo e il mio lavoro
- per chi scrivo di solito

Massimo 1.500 caratteri in tutto.`)}
 ${warn('Memoria e privacy','<p style="margin:4px 0 0">La memoria può salvare anche informazioni delicate che scrivi in chat. Controlla periodicamente cosa ricorda e cancella ciò che non serve. Per argomenti riservati usa la chat temporanea (o in incognito) e l’account aziendale.</p>')}

}});

function projText(){
 const P = S.proj, d = lines(P.docs), r = lines(P.regole);
 return `# DI COSA SI OCCUPA QUESTO PROGETTO
${v(P.nome,'nome progetto')}: ${v(P.descr,'descrivi in 2-3 righe il tema, gli obiettivi, le persone coinvolte')}

# DOCUMENTI CARICATI
${d.length ? d.map(x=>'- '+x).join('\n') : '- [elenca i documenti che carichi]'}

# COME DEVI LAVORARE
- Usa i documenti caricati come fonte principale. Se usi informazioni esterne, dillo.
- Se mancano informazioni importanti, fammi prima delle domande.
- In fondo a ogni risposta elenca i punti da verificare.
${r.map(x=>'- '+x).join('\n')}`.trim();
}
L({id:'p2-progetti', p:'p2', t:'I Progetti', sub:'Uno spazio intelligente per ogni tema o attività', min:8, body:()=>`
 ${card('Cos’è un Progetto', `<p>Un Progetto è uno spazio dentro la chat dove metti <b>una volta sola</b> tutto quello che serve su un argomento: documenti, istruzioni, regole. Ogni nuova chat aperta nel progetto <b>conosce già</b> quelle informazioni.</p>
 <div class="grid3">
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Ufficio o tema</b>“Ufficio acquisti”: listini, condizioni dei fornitori, modelli d’ordine.</div>
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Iniziativa</b>“Bando regionale 2026”: testo del bando, requisiti, bozze.</div>
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Attività ricorrente</b>“Report mensile”: modello, report passati, spiegazione degli indicatori.</div>
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Personale</b>“Risorse umane”: regolamento, contratto collettivo, procedure interne.</div>
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Comunicazione</b>“Newsletter”: stile, articoli passati, pubblico.</div>
  <div class="note" style="border-left-color:#0d9488"><b class="t">📁 Qualità</b>“Certificazione ISO”: manuale, procedure, verbali di audit.</div>
 </div>
 <p style="margin-top:12px">Dentro lo stesso progetto fai lavori diversi: una mail, un report, il riassunto di una call. Il contesto è sempre lì.</p>`)}
 ${card(`Come si crea in ${toolName()}`, howBox('project') + '<p class="hint" style="margin-top:8px">I nomi dei menu possono cambiare: se non trovi una voce, cercala nel centro assistenza dello strumento.</p>')}
 ${tryBox('Scrivi le istruzioni del tuo progetto', `<div class="form">
  ${fld('proj.nome','Nome del progetto',{ph:'Ufficio acquisti'})}
  ${fld('proj.docs','Documenti che caricherai (uno per riga)',{type:'area',rows:3,ph:'Listino fornitori 2026\nCondizioni generali di acquisto\nModello di ordine'})}
  ${fld('proj.descr','Di cosa si tratta',{type:'area',rows:3,wide:true,ph:'Ufficio acquisti di un’azienda di 40 persone. Gestiamo ordini a circa 60 fornitori. Obiettivo: confrontare le offerte più in fretta e non perdere scadenze.'})}
  ${fld('proj.regole','Regole di lavoro (una per riga)',{type:'area',rows:3,wide:true,ph:'Prezzi sempre IVA esclusa\nTono formale con i fornitori\nNon inventare codici articolo'})}
 </div>${outBox('p-proj','Istruzioni del progetto da incollare')}`)}
 ${aiMake('ai-proj','Le istruzioni del progetto', `Aiutami a scrivere le istruzioni per un Progetto dedicato a: [tema, es. ufficio acquisti].
Fammi domande semplici, una alla volta, su:
- di cosa si tratta e qual è l’obiettivo
- quali documenti caricherò
- regole da rispettare sempre (tono, formati, cose da evitare)
- come voglio le risposte
Alla fine scrivi le istruzioni complete in Markdown, pronte da incollare.`)}
 ${keys(['Un progetto per ogni tema o attività: “compartimenti stagni”.','Istruzioni + pochi documenti buoni = niente più contesto da riscrivere.','Apri le chat sempre dentro il progetto giusto.'])}
`, update(){ setText('p-proj', projText()); }});

function asstText(){
 const A = S.asst, r = lines(A.regole);
 return `# CHI SEI
Sei l’assistente “${v(A.nome,'nome assistente')}”. Fai una sola cosa: ${v(A.compito,'compito')}.

# COSA RICEVI
${v(A.input,'cosa ti incollerà l’utente')}

# COME LAVORI
1. Controlla che il testo ricevuto sia completo. Se manca qualcosa, chiedi prima di procedere.
2. Svolgi il compito rispettando le regole.
3. Restituisci solo il risultato, senza commenti introduttivi.

# REGOLE
${r.length ? r.map(x=>'- '+x).join('\n') : '- [regole da rispettare sempre]'}
- Non aggiungere informazioni che non sono nel testo ricevuto.

# FORMATO DEL RISULTATO
${v(A.formato,'come deve essere il risultato')}`;
}
L({id:'p2-assistenti', p:'p2', t:'Gli Assistenti personalizzati', sub:'GPT e Gem: un aiutante per ogni compito semplice', min:8, body:()=>`

L({id:'p2-markdown', p:'p2', t:'Cos’è un file .md (Markdown)', sub:'Il formato che l’AI legge meglio', min:7, body:()=>`
 ${card('Testo semplice con pochi simboli', `<p>Un file <b>.md</b> (Markdown) è un normale <b>file di testo</b>, come un appunto, con pochi simboli per indicare titoli, elenchi e grassetti. Si apre con qualsiasi editor di testo, lo leggono bene le persone <b>e</b> l’AI. Per questo skill e istruzioni per agenti si scrivono in .md.</p>
 ${tbl(['Scrivi','Ottieni'],[
  ['<code># Titolo</code>','Un titolo grande'],
  ['<code>## Sottotitolo</code>','Un titolo di sezione'],
  ['<code>- voce</code>','Un elenco puntato'],
  ['<code>1. passo</code>','Un elenco numerato'],
  ['<code>**parola**</code>','<b>parola</b> in grassetto'],
  ['<code>`testo`</code>','<code>testo</code> come codice o nome di file'],
  ['<code>---</code> in cima al file','Blocco di informazioni (“frontmatter”), usato nelle skill']
 ])}`)}
 ${tryBox('Scrivi a sinistra, guarda il risultato a destra', `<div class="md-live"><textarea data-k="md.text" spellcheck="false">${esc(S.md.text)}</textarea><div class="md-view" id="md-view"></div></div>`)}
 ${card('Come salvare un file .md sul computer', `<ol class="steps" style="--pc:#0d9488">
  <li><b>Mac:</b> apri TextEdit → menu Formato → <b>Converti in formato solo testo</b>. <b>Windows:</b> apri il Blocco note.</li>
  <li>Incolla il contenuto (creato dall’AI o da questa guida).</li>
  <li>Salva con un nome che finisce in <b>.md</b>, per esempio <code>SKILL.md</code>. Se il sistema aggiunge “.txt”, toglilo. Su Windows scegli “Tutti i file” come tipo.</li>
  <li>In alternativa: negli esercizi di questa guida c’è il pulsante <b>⬇ Scarica</b> che crea il file già pronto.</li>
 </ol>`)}
 ${card(`Fatti creare i file .md dall’AI in ${toolName()}`, `<p>Non devi imparare a scrivere Markdown: <b>l’AI lo scrive per te</b>. Tu descrivi cosa ti serve e controlli.</p>${howBox('md')}`)}
 ${card('I file .md che incontrerai', tbl(['File','A cosa serve','Chi lo legge e quando'],[
  ['*','<code>SKILL.md</code>','Descrive una skill: quando usarla e come svolgere il lavoro','L’AI, <b>solo quando serve</b> quella skill'],
  ['claude','<code>CLAUDE.md</code>','Istruzioni permanenti in una cartella di lavoro','Claude Code, <b>a ogni avvio</b> in quella cartella'],
  ['chatgpt','<code>AGENTS.md</code>','Istruzioni permanenti in una cartella di lavoro','Codex, <b>a ogni avvio</b> in quella cartella'],
  ['gemini','<code>GEMINI.md</code>','Istruzioni permanenti in una cartella di lavoro','Antigravity, <b>a ogni avvio</b> in quella cartella'],
  ['*','<code>README.md</code>','Spiega a una persona cos’è una cartella o un’app','Le persone (e l’AI se glielo chiedi)']
 ].filter(r=>r[0]==='*' || !hasTool() || r[0]===S.tool).map(r=>r.slice(1))))}
 ${keys(['.md = testo semplice + pochi simboli (#, -, **).','Te lo scrive l’AI: tu lo salvi con estensione .md (o lo scarichi).',`SKILL.md si legge quando serve; ${AGENT_MD[curTool()]} a ogni avvio dell’agente.`])}
`, update(){ setHTML('md-view', mdToHtml(S.md.text)); }});

L({id:'p2-skill', p:'p2', t:'Le Skill', sub:'Pacchetti di competenza riutilizzabili e condivisibili', min:9, body:()=>`
 ${analogy('🎒','Il manuale operativo nello zaino dell’AI','<p style="margin:4px 0 0">Una skill è come il manuale che un collega esperto scrive per spiegare <b>come fa</b> un lavoro: passi, modelli, controlli. L’AI lo tiene “nello zaino” e lo apre <b>solo quando serve</b>.</p>')}
 ${card('Cos’è una Skill, esattamente', `<p>Una skill è una <b>cartella</b> che contiene un file <code>SKILL.md</code> con le istruzioni e, se servono, <b>altri file</b>: modelli di documento, esempi, piccoli programmi. È pensata per <b>lavori complessi</b> che vuoi fare sempre allo stesso modo.</p>
 <div class="grid2"><div><h3>Com’è fatta</h3><div class="tree"><b>report-mensile/</b>
├── <b>SKILL.md</b>               <i>← istruzioni (obbligatorio)</i>
├── assets/
│   └── modello-report.docx   <i>← modelli da compilare</i>
├── references/
│   └── esempio-report.md     <i>← esempi e dettagli</i>
└── scripts/
    └── calcola-kpi.py        <i>← codice (facoltativo)</i></div></div>
 <div><h3>Com’è fatto SKILL.md</h3><div class="tree">---
<b>name:</b> report-mensile
<b>description:</b> Usa questa skill quando
devi preparare il report mensile
vendite per la direzione.
---
# Report mensile
## Passi
1. …</div></div></div>`)}
 ${card('Le due righe più importanti: name e description', `<p>In cima a SKILL.md, tra i due <code>---</code>, ci sono:</p>
 <ul><li><b>name</b>: il nome della skill, in minuscolo e con i trattini (<code>report-mensile</code>).</li>
 <li><b>description</b>: <b>quando</b> usarla. L’AI legge <b>solo questa riga</b> per decidere se aprire la skill. Se è vaga, la skill non verrà usata quando serve.</li></ul>
 ${ex('description: Skill per i report.', 'description: Usa questa skill quando devi preparare\nil report mensile delle vendite per la direzione,\npartendo dall’export Excel del gestionale.', 'Troppo generica: l’AI non capisce quando attivarla.', 'Dice quando, per chi e da quali dati: l’AI la attiva al momento giusto.')}`)}
 ${card('Le regole d’oro per una buona skill', `<ol class="steps" style="--pc:#0d9488">
  <li><b>Una skill, un lavoro.</b> Meglio “verbale-riunione” e “report-mensile” separate che una skill “ufficio” che fa tutto.</li>
  <li><b>Description con le parole che userai.</b> Scrivi quando usarla, per chi, da quali file, e se serve quando <i>non</i> usarla. È l’unica parte che l’AI legge sempre.</li>
  <li><b>SKILL.md snello</b>: sotto le 500 righe, con passi e controlli. Si legge per intero ogni volta che la skill si attiva.</li>
  <li><b>Cartelle standard</b>: <code>assets/</code> per modelli e file da compilare, <code>references/</code> per esempi, definizioni e regole lunghe, <code>scripts/</code> per calcoli e controlli ripetitivi.</li>
  <li><b>Richiama i file in modo esplicito</b> (“per il formato leggi references/esempio-report.md”): l’AI apre un file di supporto solo se SKILL.md lo indica.</li>
  <li><b>Controlli verificabili e regole anti-invenzione</b>: numeri che tornano, NON TROVATO dove manca un dato.</li>
  <li><b>Provala con 3 richieste reali</b>, scritte in modo diverso, e correggi description e passi.</li>
 </ol>`)}
 ${card('Skill che servono in quasi ogni ufficio', tbl(['Skill','Cosa mettere nella cartella'],[
  ['<b>Report mensile</b> da Excel','SKILL.md + assets/modello Word o PowerPoint + references/report ben fatto + scripts/calcoli'],

## Prima di iniziare

Documento Word di una pagina (usa assets/modello-report.docx se presente):

## Prima di iniziare

## Regole
- Non scegliere il fornitore: prepara il confronto per chi decide.

## Controlli prima di consegnare

# Risposte alle richieste frequenti

# Revisione e verifica di un documento

## Procedura
1. Errori: ortografia, punteggiatura, grammatica.
2. Chiarezza: frasi oltre 25 parole, gergo, passaggi ambigui.

5. Tono: adatto al destinatario indicato.

## Risultato

2. Elenco “Da verificare prima di inviare”.
3. Il documento corretto (Word), senza cambiare contenuto e stile oltre il necessario.

## Regole
- Non aggiungere informazioni nuove.
- Non cambiare il significato: se un punto è poco chiaro, proponi e chiedi.
- Se esiste references/guida-stile.md, seguila.

## Controlli prima di consegnare
- Ogni modifica è elencata nella tabella.
- Tutti i numeri del documento sono stati ricontrollati.
- Le affermazioni non verificabili sono segnalate.`},

# Analisi di un contratto

## Avvertenza
Questa analisi aiuta a leggere il contratto ma non sostituisce il parere di un legale. Dillo sempre in fondo.

## Procedura
1. Identifica le parti, l’oggetto e la data.
2. Estrai con l’articolo di riferimento e la frase esatta tra virgolette:

   - rinnovo automatico e preavviso di disdetta
   - recesso

# Pulizia di elenchi Excel

## Prima di iniziare
- Lavora sempre su una copia del file.
- Dimmi righe e colonne lette e mostrami le prime 5 righe.
- Se esiste references/regole-dati.md, usalo per formati e campi obbligatori.

## Procedura
1. Analizza e SEGNALA (senza correggere): doppioni esatti e probabili, celle vuote obbligatorie, email e telefoni non validi, date e numeri in formati diversi, spazi e maiuscole incoerenti.
2. Mostra un riepilogo dei problemi con il numero di righe coinvolte e ASPETTA la conferma.
3. Applica le correzioni confermate eseguendo codice.
4. Metti i doppioni probabili in un foglio separato, non cancellarli.

## Risultato
File Excel con:
- “Pulito”: elenco corretto
- “Modifiche”: riga | campo | prima | dopo
- “Da verificare”: righe dubbie e motivo

## Controlli prima di consegnare
- Righe pulito + da verificare + doppioni rimossi = righe originali.
- Nessuna cella obbligatoria vuota nel foglio “Pulito”.
- Ogni modifica compare nel foglio “Modifiche”.`},

# Requisiti di un’app (PRD)

## Procedura
1. Intervista la persona con domande semplici, UNA ALLA VOLTA:
   - che problema risolve e cosa si fa oggi a mano
   - chi la usa (ruoli) e quante persone
   - le 3–7 funzioni indispensabili
   - quali dati gestisce e se sono personali o riservati
   - accesso: libero, con link, con password, ruoli diversi
   - da quali dispositivi (computer, telefono)
   - collegamenti con altri strumenti (Excel, email, calendario)
   - cosa NON deve fare nella prima versione
2. Proponi cosa tenere nella prima versione (MVP) e cosa rimandare.
3. Scrivi PRD.md.

## Struttura di PRD.md
- Obiettivo e problema
- Utenti e ruoli
- Funzioni della prima versione (con criteri di accettazione verificabili)
- Dati trattati e privacy
- Schermate principali (descritte a parole)
- Fuori dalla prima versione
- Rischi, costi da verificare, domande aperte
- Tipo di app consigliato: file HTML singolo, app sul computer, app online

## Regole
- Linguaggio semplice, niente termini tecnici non spiegati.
- Criteri di accettazione verificabili (es. “l’utente riceve un’email entro 1 minuto”).
- Se ci sono dati personali online, segnala di coinvolgere IT e privacy.`}

function mapCalc(r){
 const minSett = (Number(r.volte)||0)*(Number(r.minuti)||0), nec = Math.min(10,Math.max(1,Number(r.nec)||1));
 const classe = nec<=3 ? 'auto' : nec<=6 ? 'copilota' : 'core';
 const recup = classe==='core' ? 0 : minSett*(10-nec)/10;
 const tipo = classe==='core' ? TIPI.persone : (TIPI[r.tipo] || TIPI.semplice);
 return Object.assign({}, r, {minSett, nec, classe, recup, tipo});
}

 const max = Math.max(...rows.map(r=>r.minSett),1), L=230, W=420, h=38, H=36+rows.length*h;

 return s + '</svg>';

L({id:'p4-regole', p:'p4', t:'Le 5 regole per non sbagliare', sub:'Come ottenere un’app che funziona e resta sicura', min:6, body:()=>`
 ${card('', `<ol class="steps" style="--pc:#7c3aed">
  <li><b>Non reinventare la ruota.</b> Prima di costruire, chiedi all’AI: <i>“Esiste già un programma gratuito (open source) che fa questo?”</i> Spesso esiste già un pezzo, per esempio un programma OCR per leggere i documenti scansionati. Si costruisce solo ciò che manca.</li>
  <li><b>Usa skill pronte per programmare.</b> Esistono skill gratuite che aiutano l’AI a sviluppare meglio: quelle di <b>Matt Pocock</b> per lo sviluppo e la skill di <b>brainstorming</b> della raccolta <b>Superpowers</b> per ragionare sull’app prima di scriverla. Puoi chiedere all’agente di installarle.</li>
  <li><b>Non sempre serve un database.</b> Se in azienda usate Excel, l’app può leggere e scrivere <b>i vostri file Excel</b>. Regola d’oro: prima di modificare un file, l’app ne fa una <b>copia di sicurezza</b>.</li>
  <li><b>Salva le versioni (Git e GitHub).</b> È come la <b>cronologia delle versioni</b> di un documento: se una modifica rompe l’app, torni alla versione che funzionava. Chiedi all’AI di salvare (fare “commit”) ogni volta che l’app funziona. GitHub conserva una copia online delle versioni: chiedi all’AI di aiutarti a collegarlo.</li>
  <li><b>Preferisci web app locali.</b> Un’app che si apre nel browser è più semplice da creare di un’app per Mac o Windows. Se i dati sono riservati, l’app deve funzionare <b>solo sul tuo computer</b>, senza inviare dati all’esterno.</li>
 </ol>`)}
 ${analogy('💾','Le versioni come i salvataggi di un videogioco','<p style="margin:4px 0 0">Prima del boss salvi la partita: se va male, riparti da lì. Con Git e GitHub “salvi” l’app prima di ogni modifica importante.</p>')}
 ${warn('Dati sensibili','<p style="margin:4px 0 0">Scrivi sempre nella richiesta: <i>“I dati sono riservati: l’app deve funzionare solo in locale, senza servizi esterni.”</i> E verifica con l’IT prima di usarla con dati reali.</p>')}
 ${keys(['Cerca prima ciò che esiste.','Excel + copia di sicurezza, niente database se non serve.','Salva le versioni per non perdere mai quella funzionante.'])}
`});

const APP_PRESETS = {

  A.sensibili==='si' ? 'I dati sono riservati: non salvarli da nessuna parte e non inviarli online.' : 'Se l’app ha bisogno di internet, dimmi perché.'
 ] : [
  'Prima di scrivere codice, verifica se esistono programmi open source che fanno già una parte del lavoro e proponimeli.',
  'Prima di iniziare fai un brainstorming con me e fammi le domande necessarie, una alla volta.',
  'Se lavori su file Excel, non usare un database e crea sempre una copia di backup prima di modificarli.',

  'Salva ogni versione funzionante con Git, spiegandomi in una riga cosa hai fatto.',
  'Crea un file da doppio clic per avviarla (Mac e Windows) e un README.md con istruzioni semplici.'
 ];
 return `# CONTESTO
Non sono un programmatore. Voglio una piccola applicazione per il mio lavoro: uno strumento interno, non un prodotto da vendere.
Problema: ${v(A.problema,'che problema vuoi risolvere')}

# RUOLO
Agisci come sviluppatore esperto che lavora con persone non tecniche.

# AZIONE
Costruisci ${chat ? 'una piccola app' : 'una web app locale'} chiamata “${v(A.nome,'nome app')}”.

${regole.map((x,i)=>(i+1)+'. '+x).join('\n')}

Spiegami ogni passo con parole semplici. ${chat ? 'Alla fine dimmi come salvarla sul computer.' : 'Alla fine dammi le istruzioni di avvio in massimo 5 righe.'}

- Prova l’app con dati di esempio e mostrami il risultato.
${chat ? '- Controlla che funzioni anche senza connessione a internet.' : '- Se lo stesso errore si ripete 3 volte, fermati e spiegami il problema.'}`;
}

function prdText(){
 const P = S.prd, fz = lines(P.funzioni), ru = lines(P.ruoli), fu = lines(P.fuori);
 const acc = {nessuno:'Nessun accesso: l’app si apre e basta (solo per dati non riservati).', link:'Chiunque abbia il link (solo per dati non riservati).', login:'Accesso con email e password.', ruoli:'Accesso con password e ruoli diversi (es. dipendente, responsabile, amministratore).'}[P.accesso];
 return `# PRD · ${v(P.nome,'Nome dell’app')}

## Obiettivo e problema
${v(P.problema,'che problema risolve e cosa si fa oggi a mano')}

## Utenti e ruoli
${ru.length ? ru.map(x=>'- '+x).join('\n') : '- [chi la usa: ruoli e numero di persone]'}

## Funzioni della prima versione
${fz.length ? fz.map((x,i)=>`${i+1}. ${x}\n   - Criterio di accettazione: [come verifico che funziona]`).join('\n') : '1. [funzione indispensabile]\n   - Criterio di accettazione: [come verifico che funziona]'}

## Dati
${v(P.dati,'quali dati gestisce, da dove arrivano')}
Dati personali o riservati: ${P.riservati==='si' ? 'SÌ. Coinvolgere IT e responsabile privacy prima della pubblicazione.' : 'no'}

## Accesso e dispositivi
- ${acc}
- Dispositivi: ${({computer:'computer', telefono:'telefono', entrambi:'computer e telefono'})[P.dispositivi]}

## Fuori dalla prima versione
${fu.length ? fu.map(x=>'- '+x).join('\n') : '- [cosa rimandare]'}

## Richieste per chi costruisce l’app
- Prima di scrivere codice fai domande sui punti poco chiari e proponi un piano a tappe.
- Costruisci un pezzo alla volta e fammi provare ogni tappa con dati finti.
- Spiega le scelte in parole semplici, con i costi mensili previsti dei servizi usati.
- Salva le versioni con Git e scrivi un README.md con istruzioni di uso e manutenzione.
- Prima di pubblicare: checklist di sicurezza (password, permessi, backup dei dati).`;
}

const VAGUE = ['meglio','migliore','buono','bene','bello','adeguat','appropriat','ottim','qualità','professionale','corrett','chiaro','giust'];
const OBJ = ['tutt','nessun','vuot','present','uguale','entro','almeno','massimo','minimo','coincid','inizia','contiene','numero','intero','=','<','>','%','@'];
const verifiable = l => { const s = l.toLowerCase(); return /\d/.test(s) || OBJ.some(w=>s.includes(w)) || !VAGUE.some(w=>s.includes(w)); };
function agentText(){
 const A = S.agente, st = lines(A.passi), ct = lines(A.controlli), n = Number(A.maxTent)||3;
 return `# CONTESTO E OBIETTIVO
${v(A.obiettivo,'obiettivo verificabile')}

# RUOLO
Agisci come agente autonomo: porta a termine il compito e verifica da solo il risultato.

# COSA PUOI USARE
${v(A.strumenti,'file, siti, cartelle')}
Lavora sempre su una copia dei file, mai sugli originali.

# COME LAVORI
Ripeti il ciclo: osserva la situazione → decidi il passo successivo → esegui → verifica con i controlli.
Passi previsti:
${st.length ? st.map((x,i)=>(i+1)+'. '+x).join('\n') : '1. [primo passo]'}

# CONTROLLI (devono essere tutti superati)
${ct.length ? ct.map(x=>'- '+x).join('\n') : '- [controllo sì/no]'}

# SE UN CONTROLLO NON È SUPERATO
${v(A.seFallisce,'cosa fare')}

# QUANDO FERMARTI
- Quando tutti i controlli sono superati.
- Dopo ${n} tentativi falliti sullo stesso elemento: segnalo come DA VERIFICARE e vai avanti.

# QUANDO CHIEDERMI
${v(A.umano,'situazioni in cui fermarti e chiedere')}
- Prima di qualsiasi azione irreversibile (invii, cancellazioni, pagamenti).

# RISULTATO FINALE
${v(A.output,'cosa consegnare')}
Chiudi con un report: completati, non completati e perché, anomalie, tentativi usati.`;
}

function cmdText(){
 const C = S.cmd, r = lines(C.regole), k = lines(C.comandi), dt = lines(C.dettagli);
 return `# ${v(C.progetto,'Nome della cartella o del progetto')}

## Di cosa si tratta
${v(C.scopo,'2-3 righe: a cosa serve questa cartella, obiettivo, chi usa i risultati')}

## Regole da seguire sempre
${r.length ? r.map(x=>'- '+x).join('\n') : '- [regola]'}
- Lavora su copie dei file, mai sugli originali
- Salva i file creati nella cartella risultati/
- Prima di azioni irreversibili chiedimi conferma

## File e cartelle importanti
${k.length ? k.map(x=>'- '+x).join('\n') : '- [es. originali/ = copie dei file di partenza]'}

## Dove trovare i dettagli (leggili solo se servono)
${dt.length ? dt.map(x=>'- '+x).join('\n') : '- [es. procedura completa → docs/procedura.md]'}`;
}
