<style>
:root{
 --ink:#0f172a;--ink2:#334155;--muted:#64748b;--line:#e4e9f2;--bg:#eef2f9;--card:#ffffff;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(1100px 600px at 12% -8%,rgba(99,102,241,.16),transparent 60%),radial-gradient(900px 500px at 92% 0%,rgba(13,148,136,.13),transparent 55%);pointer-events:none;z-index:0}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;z-index:1;display:grid;grid-template-columns:302px 1fr;min-height:100vh}

.brand b{display:block;color:#fff;font-size:16.5px;line-height:1.15;letter-spacing:-.2px}
.brand b .tc{color:#e8b964}
.rev-line{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:5px}
.by-tag{font-size:11px;font-weight:700;color:#7e8ea6;letter-spacing:.3px}
.rev-tag{background:#1b2f4d;color:#7dd3fc;border-radius:999px;padding:1px 9px;font-size:11px;font-weight:800}
.sect{margin:18px 10px 8px;font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:#5d6e88}
.grp{margin:10px 0 3px;padding:0 8px;font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--gc);display:flex;align-items:center;gap:8px}
.grp i{width:23px;height:23px;border-radius:8px;background:var(--gc);color:#fff;display:inline-grid;place-items:center;font-style:normal;font-size:12px;flex:none;box-shadow:0 4px 10px color-mix(in srgb,var(--gc) 45%,transparent)}
.li{display:grid;grid-template-columns:17px 1fr;gap:9px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:#bacadd;padding:7px 10px;border-radius:10px;cursor:pointer;font-size:14px;line-height:1.3;transition:.15s}
.li:hover{background:#182944;color:#fff}
.li.on{background:linear-gradient(90deg,#fff,#eef4ff);color:var(--ink);font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.ck{width:15px;height:15px;border-radius:50%;border:2px solid #3d5170;display:grid;place-items:center;font-size:9px;color:#fff}
.ck.ok{background:#22c55e;border-color:#22c55e}
.li.on .ck{border-color:#94a3b8}.li.on .ck.ok{border-color:#22c55e}
/* ricerca per argomento */
.search{position:relative;margin:2px 8px 4px}
/* selettore con id: deve battere la regola generica input[type=text] definita più sotto */
#q,.search input[type=text]{width:100%;box-sizing:border-box;border:1px solid #33486a;background:#0c1829;color:#eaf1fb;border-radius:11px;padding:10px 36px 10px 36px;font-size:14px;line-height:1.3;box-shadow:none}
#q::placeholder,.search input[type=text]::placeholder{color:#7387a3;opacity:1}
#q:focus,.search input[type=text]:focus{outline:none;border-color:#60a5fa;background:#0c1829;color:#eaf1fb;box-shadow:0 0 0 3px rgba(96,165,250,.28)}
.search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#7387a3;font-size:13px;pointer-events:none;line-height:1}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);background:transparent;border:0;color:#8ea2bd;cursor:pointer;font-size:15px;line-height:1;padding:5px 7px;border-radius:7px}
.search .clr:hover{background:#1e2d46;color:#fff}
.res-n{margin:12px 10px 5px;font-size:10.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:#5d6e88}
.li .dot{width:9px;height:9px;border-radius:50%;background:var(--gc,#64748b);display:block;margin:0 auto}
.li .rt{display:block}
.li em{font-style:normal;color:#7e8ea6;font-size:12px;display:block;line-height:1.3;margin-top:1px}
.li.on em{color:#5b6b82}
.no-res{margin:12px 10px;font-size:13.5px;color:#8296b0;line-height:1.5}
.side-reset{display:block;width:calc(100% - 16px);margin:20px 8px 0;background:transparent;border:1px solid #2b3d59;color:#8296b0;border-radius:10px;padding:8px 10px;font-size:13px;cursor:pointer}
.side-reset:hover{color:#fff;border-color:#4c6285}
/* ---------- Barra superiore ---------- */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;align-items:center;gap:16px}
.menu-btn{display:none;border:1.5px solid #cbd5e1;background:#fff;border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
.prog{flex:1;display:grid;gap:5px;min-width:0}
.prog-t{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:10px}
.prog-bar{height:7px;border-radius:99px;background:#dfe6f1;overflow:hidden}

/* Riscrive un blocco senza far perdere il cursore al campo in cui si sta scrivendo */
function setHTML(id,h){
 const e = document.getElementById(id); if(!e) return;
 const a = document.activeElement;
 if(a && e.contains(a) && /^(INPUT|TEXTAREA)$/.test(a.tagName)){
  const sel = [a.selectionStart, a.selectionEnd];
  const q2 = a.dataset.row ? `[data-row="${a.dataset.row}"][data-f="${a.dataset.f}"]` : a.dataset.k ? `[data-k="${a.dataset.k}"]` : a.id ? `#${a.id}` : '';
  e.innerHTML = h;
  const n = q2 ? e.querySelector(q2) : null;
  if(n){ n.focus(); try{ n.setSelectionRange(sel[0], sel[1]); }catch(err){} }
  return;
 }
 e.innerHTML = h;
}

function validaModelli(d){
 const chiavi = Object.keys(TIPI_AZIONE);
 if(!d || typeof d !== 'object' || !/^\d{4}-\d{2}-\d{2}$/.test(String(d.verificato||''))) return 'Manca il campo "verificato" nel formato AAAA-MM-GG.';
 for(const t of ['chatgpt','claude','gemini','copilot']){
  if(!d[t] || !d[t].m) return 'Manca il blocco "' + t + '".';
  for(const k of chiavi){ const x = d[t].m[k];
   if(!Array.isArray(x) || x.length < 2 || !String(x[0]).trim()) return 'In "' + t + '" manca la voce "' + k + '".'; }

# QUANDO FERMARTI

L({id:'t-prompt', p:'t', t:'Scrivere la richiesta', sub:'CRAFT più due blocchi: controlli e condizione di stop. Con generatore e verifica delle parti vaghe', min:10, tag:'Generatore', body:()=>`
 ${card('Lo schema', `

   ['<b>T</b>','Target','Chi legge il risultato','Salta sempre: il testo suona sbagliato pur essendo corretto'],
   ['<b>+1</b>','Controlli','Le verifiche che deve fare da solo, in forma sì/no','Assenti: nessuno verifica nulla'],

  ${rule('CRAFT basta per una chat. Per tutto ciò che deve funzionare senza che tu guardi ogni risultato (skill, assistenti, agenti) servono <b>Controlli</b> e <b>Stop</b>.')}

 `, '', '✍️')}
 ${card('Le due cose che quasi tutti sbagliano', `
  <h3>1 · Nel contesto manca il punto di arrivo</h3>
  <p>Se nel navigatore metti solo la partenza, non arrivi da nessuna parte; se metti solo la destinazione, hai una mappa ferma. Il contesto vuole <b>entrambi</b>: da dove parti e che cosa deve esserci alla fine.</p>

   'Sa da dove parte e dove deve arrivare: il risultato è già indirizzato.',
   'Solo partenza','Partenza e arrivo')}
  <h3>2 · L’azione è un blocco di prosa</h3>
  <p>L’azione va scritta come il <b>post-it che lasceresti a un collega appena arrivato</b>: competente, ma che non sa nulla di questa pratica. Passi numerati, uno per riga. È anche ciò che permette poi di passare dalla chat agli agenti senza riscrivere tutto.</p>
  ${ex('Analizza le vendite della settimana e dimmi come sono andati i venditori.',
   '1. Apri l’esportazione delle vendite della settimana\n2. Aggrega il venduto per venditore\n3. Confronta il venduto con il target settimanale di ciascuno\n4. Indica chi è sopra e chi è sotto, con la differenza in euro e in percentuale\n5. Elenca i tre scostamenti più grandi',
   'Un solo blocco: salta pezzi e non sai dove ha sbagliato.',
   'Ogni passo è un’azione verificabile: se salta il passo 3 te ne accorgi subito.',
   'Prosa','Passi numerati')}
  <h3>E il destinatario cambia la lingua del risultato</h3>
  <p>Stesso contenuto, destinatario diverso, testo diverso: un aggiornamento tecnico scritto <b>per il team marketing</b> non è lo stesso scritto per altri tecnici. È il blocco che salta più spesso ed è quello che fa suonare sbagliato un risultato corretto.</p>
 `, '', '🎯')}
 ${card('Controlli: l’unica regola', ex(
  'Controlla che il documento sia fatto bene e professionale.',
  'Controlli:\n- ogni importo coincide con quello del PDF di origine\n- nessuna riga della tabella è vuota\n- i totali sono ricalcolati con il codice\n- dato assente = NON TROVATO',
  'Non verificabile: chiunque può dichiarare di averlo fatto.',
  'Ogni riga si verifica con un sì o un no, anche da parte di chi non conosce la pratica.',
  'Controlli vaghi','Controlli verificabili'), '', '🎛️')}
 ${tryBox('Generatore di richieste', `
  <div class="presets"><span>Esempio:</span>${Object.entries(PR_PRESETS).map(([k,x])=>`<button class="chip-btn" data-act="preset" data-g="pr" data-p="${k}">${x.label}</button>`).join('')}</div>
  <div class="form">
   ${fld('pr.contesto','C · Contesto (partenza e arrivo)',{wide:true,ta:true,rows:3})}
   ${fld('pr.ruolo','R · Ruolo',{wide:true,ph:'Comportati come…'})}
   ${fld('pr.azione','A · Azione, un passo per riga',{wide:true,ta:true,rows:5})}
   ${fld('pr.formato','F · Formato',{ta:true,rows:2})}
   ${fld('pr.target','T · Destinatario',{ta:true,rows:2})}
   ${fld('pr.materiali','Materiali da usare',{wide:true,ta:true,rows:2})}
   ${fld('pr.vincoli','Vincoli, uno per riga',{wide:true,ta:true,rows:2})}
   ${fld('pr.controlli','Controlli, uno per riga',{wide:true,ta:true,rows:4,hint:'Verificabili con sì o no: confronti, conteggi, campi obbligatori.'})}
   ${fld('pr.stop','Quando fermarsi',{wide:true,ta:true,rows:2})}
   <div class="field wide">${cb('pr.domande','Chiedi fino a tre domande se mancano informazioni')}</div>
  </div>
  <div id="pr-sem"></div>
  ${outBox('pr-out','Richiesta pronta','','richiesta.md')}
 `)}
 ${card('Blocco anti-invenzione', '<p>Da incollare in coda a ogni richiesta che produce un documento destinato a un cliente finale.</p>' + outBox('anti-inv','Affidabilità', ANTI_INV), '', '🛡️')}
 ${modelHint('ragionamento','Sui documenti che escono verso il cliente finale.')}
 ${keys(['Contesto = partenza <b>e</b> arrivo.','Azione numerata, un passo per riga.','Controlli in forma sì/no, sempre.','Senza condizione di stop, davanti a un buco inventa.'])}
`,
 update:()=>{
  setText('pr-out', prText());
  const p = S.pr, ctrl = lines(p.controlli), passi = lines(p.azione);
  const campi = ['contesto','ruolo','azione','formato','target','materiali','vincoli','controlli','stop'];
  const pieni = campi.filter(k=>String(p[k]||'').trim()).length;
  const av = [];
  const vaghi = ctrl.filter(x=>!verificabile(x));
  if(!passi.length) av.push(['ko','Manca l’azione.']);
  else if(passi.length===1) av.push(['ko','Un solo passo: se è davvero un compito singolo va bene, altrimenti spezzalo.']);
  else av.push(['ok',passi.length + ' passi numerati.']);
  if(String(p.contesto||'').trim() && !/(arriv|obiettiv|ottener|deve uscire|serve per|entro)/i.test(p.contesto)) av.push(['ko','Nel contesto non si capisce il punto di arrivo.']);
  vaghi.forEach(x=>av.push(['ko','Controllo non verificabile: «' + x + '»']));
  if(ctrl.length && !vaghi.length) av.push(['ok','Tutti i controlli sono verificabili.']);
  if(!String(p.stop||'').trim()) av.push(['ko','Manca la condizione di stop.']);
  else av.push(['ok','Condizione di stop presente.']);
  setHTML('pr-sem', `<div class="meter"><div class="prog-t"><span>Completezza</span><span>${pieni}/${campi.length}</span></div><div class="meter-bar"><i style="width:${Math.round(pieni/campi.length*100)}%"></i></div></div><div class="ver">${av.map(([c,t])=>`<div class="${c}">${c==='ok'?'✓':'⚠️'} ${esc(t)}</div>`).join('')}</div>`);
 }
});

L({id:'t-affidabilita', p:'t', t:'Evitare le risposte inventate', sub:'L’errore pericoloso non è quello evidente: è quello plausibile', min:9, body:()=>`
 ${card('Perché inventa', `
  <p>Il modello produce la continuazione più plausibile. Se il dato non c’è, la continuazione plausibile è <b>un dato verosimile</b>: una data credibile, un importo ragionevole. Non è un guasto: è il comportamento predefinito in assenza di istruzioni contrarie.</p>
  ${warn('Il punto','<p style="margin:4px 0 0">Una cifra sbagliata dell’8% in un preventivo non salta all’occhio di nessuno. Per questo i controlli sono parte del lavoro, non un extra.</p>')}
 `, '', '🎯')}
 ${card('Le cinque leve, in ordine di efficacia', flow([
  '<b>Dare le fonti.</b> Lavorare sui documenti caricati invece che sulla memoria del modello.',
  '<b>Pretendere la citazione.</b> «Indica file e punto esatto per ogni affermazione».',
  '<b>Autorizzare il non so.</b> «Se non c’è, scrivi NON TROVATO».',
  '<b>Far eseguire i calcoli col codice.</b> I conti «a mente» sono la seconda causa di errori gravi.',
  '<b>Far rileggere da revisore.</b> Secondo passaggio con ruolo di revisore severo, possibilmente con un modello più capace.'
 ]), '', '🔧')}
 ${card('Prompt di revisione', outBox('rev-prompt','Revisione severa', `Rileggi la tua risposta precedente come un revisore severo, non come l'autore.

1. Elenca ogni affermazione NON supportata dai materiali forniti.
2. Elenca ogni numero che non deriva da un calcolo mostrato, e rifai il calcolo con il codice.
3. Elenca ogni riferimento (norma, documento, data, nome) che non compare testualmente nei materiali.
4. Indica dove hai completato un'informazione mancante con una deduzione.
5. Riscrivi le parti problematiche sostituendo le deduzioni con NON TROVATO.

Non difendere la versione precedente. Se non trovi problemi, elenca che cosa hai verificato.`), '', '🔍')}
 ${card('I tre controlli da lasciare a chi usa la soluzione', chk([
  ['Il numero che conta','Totale, importo, data di scadenza: confronto con la fonte, ogni volta.'],
  ['Nomi e riferimenti','Nome cliente, numero pratica, riferimento documento: sono gli errori che si notano di più.'],
  ['La riga che non c’era','Un’affermazione che nessuno ricorda di aver scritto va verificata: è il segnale tipico dell’invenzione.']
 ]), '', '✅')}
 ${modelHint('ragionamento','Per la revisione conviene un modello più capace di quello che ha scritto.')}
 ${keys(['L’errore pericoloso è quello plausibile.','Fonti + citazione + «NON TROVATO» autorizzato.','I calcoli si fanno eseguire, non pensare.','L’ultima verifica è sempre di una persona.'])}
`});

L({id:'t-file', p:'t', t:'Lavorare sui file', sub:'Excel, Word, PDF, presentazioni: i tre modi di trattare un file e quando si rompono', min:10, body:()=>`

 ]), '', '📎')}

 ${howBox('file')}
 ${card('Excel: le cinque regole', chk([
  ['Prima la copia','<code>listino_LAVORO.xlsx</code>, mai l’originale.'],
  ['Dichiara la struttura','Quale foglio, quali colonne, dove iniziano i dati, quali righe sono intestazioni o totali.'],
  ['Chiedi il controllo di coerenza','«Dichiara quante righe hai letto e quante ne hai scritte»: se non tornano, il problema è nel file.'],

  ['Risultato in un file nuovo','Con la data nel nome.']
 ]), '', '📊')}
 ${card('PDF scansionati', `

  ${outBox('file-pdf','Richiesta di estrazione da PDF', `# CONTESTO
Devo estrarre dati strutturati da [numero] PDF dello stesso tipo ([fatture / DDT / contratti]).
Punto di arrivo: un foglio Excel con una riga per documento.

# AZIONE
1. Per ogni PDF estrai: [elenco esatto dei campi]
2. Uniforma date in GG/MM/AAAA e importi con due decimali
3. Scrivi una riga per documento
4. Aggiungi colonna con il nome del file di origine e colonna NOTE

# CONTROLLI
- Righe scritte = PDF letti: dichiara i due numeri

${v(s.quando,'situazioni in cui va richiamata')}

## Che cosa ricevi in ingresso
${v(s.input,'tipo di materiale')}

## Procedura
${numbered(s.passi,'passo')}

## Risultato atteso
${v(s.output,'che cosa esce, in che formato, dove va salvato')}

## Materiale di supporto
${bullets(s.risorse,'file → a che cosa serve')}

## Controlli prima di consegnare
${bullets(s.controlli,'controllo verificabile')}

- Calcoli eseguiti con il codice, mai a mente.

`;

function mapCalc(r){
 const volte = Number(r.volte)||0, minuti = Number(r.minuti)||0, nec = Number(r.nec)||0;
 const minMese = volte*minuti, oreAnno = minMese*12/60;
 const quota = nec<=3 ? 0.8 : nec<=6 ? 0.45 : 0.1;
 return Object.assign({}, r, {minMese, oreAnno, recup:oreAnno*quota, classe: nec<=3 ? 'auto' : nec<=6 ? 'copilota' : 'core'});
}
const mapOrdinata = () => S.map.rows.map(mapCalc).sort((a,b)=> b.recup - a.recup || b.oreAnno - a.oreAnno);
function mapBarre(rows){
 const max = Math.max(...rows.map(r=>r.oreAnno), 1);
 return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Attività</th><th style="width:44%">Ore/anno · recuperabili</th><th>Classe</th></tr></thead><tbody>${
  rows.map(r=>`<tr><td><b>${esc(r.nome || 'senza nome')}</b><br><span class="hint">${fmt(r.volte)}×/mese · ${fmt(r.minuti)} min · necessità ${fmt(r.nec)}/10</span></td>
  <td><div style="position:relative;background:#eef2f8;border-radius:8px;height:26px;overflow:hidden">
   <i style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(r.oreAnno/max*100)}%;background:#dce3ed"></i>
   <i style="position:absolute;left:0;top:0;bottom:0;width:${Math.round(r.recup/max*100)}%;background:${CLASSI[r.classe].c};opacity:.85"></i>
   <em style="position:relative;font-style:normal;font-size:12.5px;font-weight:700;line-height:26px;padding-left:9px;color:#0f172a">${fmt(r.oreAnno)} h · rec. ${fmt(r.recup)} h</em></div></td>
  <td>${badge(CLASSI[r.classe].l, CLASSI[r.classe].c)}</td></tr>`).join('')}</tbody></table></div>`;
}

CONTESTO
- Documento A: prodotto a mano dall'azienda (versione corretta).
- Documento B: prodotto dalla soluzione automatica.
- Criteri di accettazione: [incolla i criteri]

COMPITO
1. Confronta A e B rispetto a ciascun criterio.
2. Per ogni differenza: criterio, valore in A, valore in B, gravità (bloccante / da correggere / trascurabile).

REGOLE

DOCUMENTO A
[incolla]

DOCUMENTO B
[incolla]`)}
 ${keys(['Casi reali già chiusi, con esito noto.','8 su 10 al primo colpo, zero errori silenziosi.','Due casi limite sempre.','L’ultimo giro lo fa chi userà la soluzione.'])}
`,
 update:()=>{
  const c = S.coll, criteri = lines(c.criteri), campione = lines(c.campione), casi = lines(c.casi);
  setText('coll-out', `# Piano di collaudo — ${v(c.nome,'soluzione')}

## Criterio di accettazione
Almeno 8 casi su 10 corretti al primo tentativo e nessun errore silenzioso.

## Campione
${campione.length ? campione.map((x,i)=>`${i+1}. ${x}`).join('\n') : '1. [caso reale già chiuso]'}

## Criteri di verifica
${criteri.length ? criteri.map(x=>`- [ ] ${x}`).join('\n') : '- [ ] [criterio verificabile]'}

## Casi limite
${casi.length ? casi.map(x=>`- [ ] ${x}`).join('\n') : '- [ ] [caso limite]'}

## Esecuzione
| # | Caso | Esito | Scarti | Causa (dato/regola/formato) |
|---|---|---|---|---|
${campione.length ? campione.map((x,i)=>`| ${i+1} | ${x} | | | |`).join('\n') : '| 1 | | | | |'}

## Esito
- Corretti al primo tentativo: ___ su ${campione.length || 10}
- Errori silenziosi: ___
- Esito: PASSATO / NON PASSATO
- Eseguito da: ___ (chi userà la soluzione)
`);
  const av = [];
  const vaghi = criteri.filter(x=>/\b(buon|megli|corrett[oa]\b|adeguat|professional|chiar)/i.test(x) && !/\d/.test(x));
  if(campione.length && campione.length < 5) av.push(['ko','Campione di ' + campione.length + ' casi: troppo piccolo. Almeno 8-10.']);

  if(vaghi.length) av.push(['ko','Criterio non verificabile: «' + vaghi[0] + '»']);
  else if(criteri.length) av.push(['ok','Criteri verificabili.']);
  av.push(casi.length ? ['ok',casi.length + ' casi limite.'] : ['ko','Nessun caso limite: il collaudo passerà e il problema lo troverà il cliente.']);
  setHTML('coll-sem', `<div class="ver">${av.map(([c2,t])=>`<div class="${c2}">${c2==='ok'?'✓':'⚠️'} ${esc(t)}</div>`).join('')}</div>`);
 }
});

   toast(salvato ? 'Modelli aggiornati il ' + dati.quando + ' ✓' : 'Modelli aggiornati per questa sessione (' + dati.quando + ')');
   break; }
  case 'mod-reset': { try{ localStorage.removeItem(MOD_STORE); }catch(err){} MODELLI = MODELLI_DEF; render(); toast('Tabella riportata a quella di serie del ' + modData()); break; }
 }
});
initState();
const saved = loadProgress();
if(saved){ S.done = saved.done || {}; if(TOOLS[saved.tool]) S.tool = saved.tool; }
const hadHash = SCHEDE.some(l=>'#'+l.id===location.hash);
{ let i = SCHEDE.findIndex(l=>'#'+l.id===location.hash); if(i<0 && saved) i = SCHEDE.findIndex(l=>l.id===saved.scheda); if(i>=0) cur = i; }
render();
if(saved && cur>0 && !hadHash) toast('Riprendi da “' + SCHEDE[cur].t + '”');
