function mapCalc(r){
 const volte = Number(r.volte)||0, minuti = Number(r.minuti)||0, nec = Number(r.nec)||5;
 const minSett = volte*minuti;
 const quota = nec<=3 ? .8 : nec<=7 ? .45 : .1;
 return Object.assign({}, r, {minSett, recup: minSett*quota, classe: nec<=3 ? 'auto' : nec<=7 ? 'copilota' : 'core'});
}
const mapRanked = () => S.map.rows.map(mapCalc).sort((a,b)=>b.recup-a.recup || b.minSett-a.minSett);
function mapSugg(r){
 if(r.classe==='core') return 'Tienila per te: è qui che va speso il tempo che recuperi.';
 const lv = lvNow();
 if(r.tipo==='testo') return 'Un buon prompt, o un <b>assistente</b> se la rifai sempre uguale.';
 if(r.tipo==='doc') return 'Un <b>Progetto</b> con dentro i documenti di quel tema.';
 if(r.tipo==='conti') return lv>=3 ? 'Una <b>skill</b> con il tuo foglio come modello, o una <b>mini-app</b>.' : 'Un <b>Progetto</b> con il tuo foglio, e la regola “fai i calcoli con il codice”.';
 if(r.tipo==='ripet') return lv>=3 ? 'Una <b>skill</b>: procedura fissa, modello e controlli.' : 'Un <b>assistente</b> con le istruzioni fisse.';
 if(r.tipo==='tanti') return lv>=3 ? 'Un <b>agente</b> sulla cartella (con copie dei file!).' : 'Per ora falla a mano: gli agenti sono nel livello Avanzato.';
 return 'Fatti aiutare a preparare, ma decidi tu.';
}
function mapBars(rows){
 const max = Math.max(1, ...rows.map(r=>r.minSett));
 return `<div style="display:grid;gap:8px">${rows.map(r=>`<div><div class="prog-t"><span>${esc(trunc(r.nome||'(senza nome)',42))}</span><b>${fmt(r.minSett)} min/sett</b></div>
  <div class="meter-bar"><i style="width:${Math.round(r.minSett/max*100)}%;background:${CLASSI[r.classe].c}"></i></div></div>`).join('')}</div>`;
}
function mapTable(){
 const rows = S.map.rows;
 if(!rows.length) return `<p class="hint">Nessuna attività. Aggiungi la prima riga, oppure carica l’esempio qui sopra.</p>`;
 return tbl(['Attività','Volte a settimana','Minuti a volta','Quanto serve che la faccia tu (1–10)','Tipo',''],
  rows.map(r=>[
   `<input type="text" data-row="${r.id}" data-f="nome" value="${esc(r.nome)}" placeholder="Es. rispondere alle mail">`,
   `<input type="number" min="0" data-row="${r.id}" data-f="volte" value="${r.volte}" style="max-width:90px">`,
   `<input type="number" min="0" data-row="${r.id}" data-f="minuti" value="${r.minuti}" style="max-width:90px">`,
   `<input type="number" min="1" max="10" data-row="${r.id}" data-f="nec" value="${r.nec}" style="max-width:80px">`,
   `<select data-row="${r.id}" data-f="tipo">${Object.entries(TIPI).map(([k,x])=>`<option value="${k}"${r.tipo===k?' selected':''}>${x.l}</option>`).join('')}</select>`,
   `<button class="icon-btn" data-act="del-row" data-id="${r.id}" title="Elimina">✕</button>`
  ]));
}

const VAGUE = ['meglio','migliore','buono','bene','bello','adeguat','appropriat','ottim','qualità','professionale','corrett','chiaro','giust'];
const OBJ = ['tutt','nessun','vuot','present','uguale','entro','almeno','massimo','minimo','coincid','inizia','contiene','numero','intero','=','<','>','%','@'];
const verifiable = l => { const s = l.toLowerCase(); return /\d/.test(s) || OBJ.some(w=>s.includes(w)) || !VAGUE.some(w=>s.includes(w)); };

 {c:'burocrazia', l:'intermedio', w:'proj', t:'Una pratica che dura mesi', s:'Invalidità, successione, ricorso: documenti che si accumulano.', o:'Un posto unico dove sapere sempre a che punto sei.', pr:'Ho creato un progetto con tutti i documenti della pratica.\n\nFammi il punto della situazione:\n1. cronologia dei fatti con le date, ricavata dai documenti\n2. a che punto siamo oggi\n3. cosa manca e chi deve fare la prossima mossa\n4. scadenze da rispettare\n5. cosa conviene preparare adesso\n\nPer ogni punto indica il documento da cui lo ricavi. Se qualcosa non risulta dai documenti, scrivilo: non ricostruire a intuito.', tip:'Aggiorna il progetto ogni volta che arriva un documento nuovo.'},

 {c:'soldi', l:'base', w:'chat', t:'Il confronto prima di comprare', s:'Tre modelli, quaranta recensioni, zero chiarezza.', o:'Le differenze che contano per come lo userai tu.', pr:'Devo comprare [prodotto] e sto valutando questi modelli: [modelli].\n\nLo userò per: [come lo userai davvero], in questa situazione: [spazio, persone, frequenza].\n\nCerca sul web e dimmi:\n1. le differenze concrete tra i modelli, solo quelle che contano per il mio uso\n2. cosa NON mi serve, tra le caratteristiche pubblicizzate\n3. i difetti ricorrenti segnalati dagli utenti, con le fonti\n4. la fascia di prezzo attuale\n\nNon dirmi “dipende dalle esigenze”: dimmi quale sceglieresti al mio posto e perché. Indica le fonti.', tip:'Il punto 2 è quello che ti fa risparmiare di più.'},
 {c:'soldi', l:'base', w:'chat', t:'Gli abbonamenti dimenticati', s:'Piccoli addebiti mensili che nessuno ricorda di aver attivato.', o:'L’elenco di cosa paghi e cosa tagliare.', pr:'Ti incollo l’elenco dei movimenti ricorrenti del mio conto (ho tolto i dati identificativi):\n\n<movimenti>\n[incolla qui]\n</movimenti>\n\nDimmi:\n1. quali sembrano abbonamenti ricorrenti e con che frequenza\n2. quanto mi costano all’anno, uno per uno e in totale\n3. quali sono probabilmente doppioni o servizi sovrapposti\n4. l’ordine in cui li taglierei, dal meno doloroso al più doloroso\n\nFai i calcoli eseguendo il codice. Non inventare il nome del servizio se la descrizione non è chiara: scrivi DA VERIFICARE.', tip:'Togli sempre IBAN e numeri di carta prima di incollare.'},
 {c:'soldi', l:'intermedio', w:'file', t:'Dove finiscono i soldi', s:'La sensazione che il mese finisca prima dello stipendio.', o:'Le categorie di spesa, in chiaro.', pr:'Ti allego l’estratto conto (o un Excel dei movimenti).\n\nPRIMA: dimmi quanti movimenti hai letto e il periodo coperto.\n\nPOI:\n1. assegna una categoria a ogni movimento: casa, spesa, auto/trasporti, salute, svago, abbonamenti, figli, altro\n2. fammi una tabella con il totale per categoria e la percentuale sul totale\n3. dimmi le tre voci dove spendo di più e le tre spese singole più alte\n4. segnala quello che non riesci a categorizzare, senza inventare\n\nFai i calcoli eseguendo il codice. La somma delle categorie deve coincidere con il totale delle uscite: verificalo e dimmi se torna.', tip:'Chiedi anche il file .xlsx per rifarlo ogni mese.'},
 {c:'soldi', l:'intermedio', w:'chat', t:'Capire un preventivo di finanziamento', s:'Rate, TAN, TAEG e la rata “vantaggiosa”.', o:'Quanto costa davvero, in euro.', pr:'Ti allego (o incollo) le condizioni di un finanziamento: importo, durata, rata, TAN, TAEG, spese.\n\nDimmi in euro, non in percentuale:\n1. quanto restituisco in totale\n2. quanto pago di interessi e spese\n3. quanto incide ogni spesa accessoria\n4. cosa cambierebbe allungando o accorciando la durata\n\nFai i calcoli eseguendo il codice e mostrami i passaggi.\nSe un dato non è indicato nel documento, scrivi NON INDICATO: è importante saperlo.\nAlla fine: le tre domande da fare prima di firmare.', tip:'Nessuna AI sostituisce un consulente: usala per arrivare preparato.'},
 /* --- TESTI --- */
 {c:'testi', l:'base', w:'chat', t:'La mail difficile', s:'Devi dire una cosa scomoda a qualcuno che vedrai ancora.', o:'Due versioni e un consiglio su quale usare.', pr:'Devo scrivere a [chi] per [cosa].\n\nCONTESTO\n[la situazione, compresi i rapporti tra voi]\n\nCOSA VOGLIO OTTENERE\n[il risultato concreto]\n\nCOSA NON VOGLIO\n[rompere il rapporto / sembrare aggressivo / aprire una discussione infinita]\n\nDammi due versioni: una più diretta e una più diplomatica. Massimo 10 righe ciascuna.\nPoi dimmi quale consiglieresti e perché, e quali frasi potrebbero essere fraintese.', tip:'Rileggi sempre prima di inviare: il tono lo scegli tu.'},
 {c:'testi', l:'base', w:'chat', t:'Rispondere a un messaggio a caldo', s:'Un messaggio che ti ha fatto arrabbiare, e le dita che vanno da sole.', o:'Una risposta che non peggiora le cose.', pr:'Ho ricevuto questo messaggio e sono arrabbiato:\n\n<messaggio>\n[incolla]\n</messaggio>\n\nPrima dimmi, senza darmi ragione d’ufficio: cosa sta effettivamente chiedendo o dicendo questa persona, e cosa potrebbe aver frainteso.\n\nPoi scrivimi tre risposte possibili: una che chiude la questione, una che chiede un chiarimento, una che prende tempo.\nNessuna deve essere sarcastica o passivo-aggressiva.', tip:'La regola vera: aspetta un’ora. L’AI serve a farla passare meglio.'},
 {c:'testi', l:'base', w:'chat', t:'Il testo che devi scrivere e non sai come iniziare', s:'Discorso per un matrimonio, biglietto di condoglianze, presentazione.', o:'Una bozza da cui partire, con le tue parole.', pr:'Devo scrivere [cosa] per [occasione].\n\nCHI SONO PER LORO\n[il rapporto]\n\nCOSE VERE CHE VOGLIO DIRE\n[tre o quattro fatti, ricordi, dettagli concreti]\n\nTONO\n[commosso ma non retorico / spiritoso / sobrio]\n\nDurata: [minuti o righe].\n\nScrivimi una bozza usando SOLO i fatti che ti ho dato: non inventare ricordi, aneddoti o qualità che non ti ho detto.\nSe ti sembra che manchi qualcosa per renderlo personale, chiedimelo.', tip:'Il valore sta nei dettagli veri che dai tu: dane tanti.'},
 {c:'testi', l:'intermedio', w:'asst', t:'Scrivere come scrivi tu', s:'I testi dell’AI si riconoscono a un chilometro.', o:'Le regole del tuo stile, da riusare sempre.', pr:'Ti incollo tre testi scritti da me:\n\n<testo1>\n[...]\n</testo1>\n<testo2>\n[...]\n</testo2>\n<testo3>\n[...]\n</testo3>\n\nAnalizzali e ricavane le regole del mio modo di scrivere: lunghezza delle frasi, parole che uso e che non uso, come apro e come chiudo, livello di formalità, uso della punteggiatura.\n\nScrivimi queste regole in un elenco di massimo 12 punti, che io possa incollare nelle istruzioni personali.\nPoi riscrivi questo testo seguendo quelle regole: [testo di prova].', tip:'Salva le regole: valgono per anni.'},
 /* --- FAMIGLIA --- */
 {c:'famiglia', l:'base', w:'chat', t:'Spiegare un compito senza litigare', s:'Tuo figlio si blocca, tu ti innervosisci, la serata è rovinata.', o:'Come spiegarglielo, con esempi concreti.', pr:'Mio figlio di [età] deve fare [argomento] e si è bloccato su [punto preciso].\n\nQuando glielo spiego io succede che [cosa succede].\n\nSpiegami:\n1. come spiegarglielo, in massimo 10 righe, con un esempio concreto che possa fare con le mani o con oggetti di casa\n2. tre esercizi semplici da fargli provare, con le soluzioni separate in fondo\n3. l’errore tipico che fanno i bambini di quell’età su questo argomento\n\nNon usare termini tecnici senza spiegarli. Non farmi la lezione sui metodi didattici.', tip:'Non far fare il compito all’AI: fatti spiegare come spiegarlo.'},
 {c:'famiglia', l:'base', w:'file', t:'La circolare della scuola', s:'Due pagine di cui servono tre righe.', o:'Date, cosa serve, cosa devi fare.', pr:'Ti allego la circolare della scuola.\n\nDimmi solo:\n1. cosa devo fare io, in elenco\n2. entro quando, con le date esatte\n3. cosa devo dare a mio figlio (soldi, moduli, materiale)\n4. se serve una firma o una risposta\n\nMassimo 10 righe in tutto. Se una data non è indicata chiaramente, dimmelo.', tip:'Con un assistente dedicato, ogni circolare diventa dieci secondi.'},
 {c:'famiglia', l:'intermedio', w:'chat', t:'Aiutare un genitore anziano con la tecnologia', s:'Spiegare al telefono come si fa una cosa sullo smartphone.', o:'Istruzioni passo passo, scritte per essere seguite da soli.', pr:'Devo spiegare a mia madre di [età] come [fare una cosa] su [dispositivo e sistema: iPhone / Android / Windows].\n\nNon è pratica di tecnologia e si spaventa se vede parole inglesi.\n\nScrivimi le istruzioni:\n- un passaggio per riga, numerati\n- descrivendo cosa vede sullo schermo prima di ogni tocco\n- senza parole inglesi (o spiegandole)\n- con scritto cosa fare se qualcosa non corrisponde\n\nDeve poterle seguire da sola, stampate su un foglio.', tip:'Chiedi anche la versione “cosa NON deve toccare”.'},
 {c:'famiglia', l:'base', w:'chat', t:'Idee regalo che non siano banali', s:'Compleanno tra una settimana e la solita candela.', o:'Idee costruite su chi è la persona.', pr:'Devo fare un regalo a [chi, età, rapporto] per [occasione]. Budget: [importo].\n\nCOSA SO DI LEI/LUI\n[passioni, cosa fa nel tempo libero, cosa ha detto ultimamente, cosa ha già]\n\nCOSA HO GIÀ REGALATO IN PASSATO\n[elenco]\n\nDammi 8 idee divise in: qualcosa da usare, qualcosa da vivere (esperienze), qualcosa di fatto da me.\nPer ognuna dimmi perché c’entra con quello che ti ho raccontato.\nNiente idee generiche tipo “un buon libro”: sii specifico.', tip:'Più dettagli dai sulla persona, meno banali sono le idee.'},
 /* --- SALUTE --- */
 {c:'salute', l:'base', w:'chat', t:'Arrivare preparato alla visita', s:'Dieci minuti dal medico e le domande ti vengono in mente dopo.', o:'La lista delle domande e dei sintomi, in ordine.', pr:'Ho una visita [tipo] per [motivo generico].\n\nSINTOMI\n[cosa senti, da quando, quando peggiora, cosa lo allevia]\n\nCOSA HO GIÀ FATTO\n[esami, farmaci, altre visite]\n\nAiutami a preparare la visita:\n1. riordina i sintomi in modo che il medico capisca subito la cronologia\n2. dammi le domande da fare, in ordine di importanza\n3. dimmi quali informazioni il medico probabilmente mi chiederà, così le preparo\n\nNON darmi diagnosi, NON dirmi cosa potrebbe essere, NON suggerire farmaci. Servi solo a farmi arrivare preparato.', tip:'La diagnosi è del medico. Sempre.'},
 {c:'salute', l:'intermedio', w:'file', t:'Capire le parole di un referto', s:'Sigle, valori, e una notte passata a cercare su internet.', o:'Cosa significano le parole, e cosa chiedere al medico.', pr:'Ti allego un referto da cui ho tolto nome, cognome e dati identificativi.\n\nSpiegami, con parole semplici:\n1. cosa misura ogni valore, in generale\n2. quali risultano fuori dall’intervallo di riferimento indicato nel referto stesso\n3. il significato delle sigle e dei termini tecnici presenti\n\nPoi dammi le domande da fare al medico su questo referto.\n\nNON fare diagnosi, NON dirmi cosa potrebbe essere, NON dirmi se è grave, NON suggerire terapie o integratori. Se sono preoccupato, dimmi solo di parlarne con il medico.', tip:'Usa una chat temporanea e togli sempre i dati identificativi.'},
 {c:'salute', l:'base', w:'chat', t:'Il piano di allenamento realistico', s:'Buone intenzioni a gennaio, divano a febbraio.', o:'Un programma che tiene conto della tua vita vera.', pr:'Voglio [obiettivo: rimettermi in forma / camminare di più / tornare a correre].\n\nSITUAZIONE VERA\nEtà [x], attività fisica attuale [quale, quanta], tempo disponibile [giorni e minuti veri, non ideali], dove posso allenarmi [casa/palestra/all’aperto], limitazioni fisiche [se ce ne sono].\n\nFammi un programma di 4 settimane che:\n- stia dentro il tempo che ho davvero\n- parta da dove sono, non da dove vorrei essere\n- preveda cosa fare quando salto un giorno\n\nSe ho indicato limitazioni fisiche, dimmi di sentire prima un medico o un fisioterapista per quelle.', tip:'Se hai problemi di salute, parlane prima con il medico.'},
 /* --- VIAGGI --- */
 {c:'viaggi', l:'base', w:'chat', t:'Il programma di viaggio che funziona davvero', s:'Le guide propongono giornate da maratoneti.', o:'Un programma sui vostri ritmi.', pr:'Andiamo a [luogo] dal [data] al [data]. Siamo [chi, con età se ci sono bambini o anziani].\n\nCOME SIAMO FATTI\n[camminatori o no, orari, cosa vi piace davvero, cosa vi annoia]\n\nDOVE DORMIAMO\n[zona]\n\nFammi il programma giorno per giorno in una tabella: mattina, pranzo, pomeriggio, sera, spostamenti.\n\nREGOLE\n- massimo due cose impegnative al giorno\n- raggruppa per zona, niente traversate inutili\n- non inventare orari di apertura e prezzi: scrivi “da verificare sul sito”\n- indica un’alternativa al chiuso per ogni giorno, in caso di pioggia', tip:'Chiedi anche “cosa salterei se avessi un giorno in meno”.'},
 {c:'viaggi', l:'base', w:'chat', t:'La valigia senza dimenticanze', s:'Il caricabatterie a casa, ogni volta.', o:'Una lista costruita sul viaggio vero.', pr:'Faccio un viaggio a [luogo] dal [data] al [data]. Ci vado in [mezzo], alloggio in [tipo], e farò soprattutto [attività].\n\nSiamo [chi].\n\nFammi la lista di cosa mettere in valigia, divisa per: abbigliamento, bagno, documenti e soldi, elettronica, medicine, cose per [bambini/cane/altro].\n\nTieni conto del clima previsto in quel periodo in quella zona (dimmi su cosa ti basi).\nAggiungi una sezione “da fare prima di partire” (casa, posta, piante, allarme).\nSegna con ⚠️ le cose che se dimentico non posso comprare sul posto.', tip:'Salva la lista: al prossimo viaggio la riusi.'},
 {c:'viaggi', l:'intermedio', w:'web', t:'La gita del fine settimana', s:'Un sabato libero e nessuna idea.', o:'Tre proposte concrete, raggiungibili davvero.', pr:'Cerca sul web e proponimi tre gite di un giorno partendo da [città], per il [data].\n\nCONDIZIONI\n- massimo [ore] di viaggio all’andata\n- mezzo: [auto/treno]\n- siamo [chi]\n- ci piace [tipo di cose]\n- budget indicativo: [importo]\n\nPer ognuna dimmi: cosa si fa, quanto tempo serve, come ci si arriva, quanto costa indicativamente, e perché potrebbe piacerci.\nControlla se in quella data ci sono eventi, chiusure o sagre, e dammi le fonti.\nNon inventare orari: indica il sito da controllare.', tip:'Chiedi “cosa c’è di brutto in ognuna di queste tre”: risposte più oneste.'},
 /* --- ORDINE --- */
 {c:'ordine', l:'base', w:'chat', t:'La settimana che si incastra', s:'Cinque impegni, due macchine, tre persone.', o:'Un piano che sta in piedi, con i conflitti evidenziati.', pr:'Ti elenco gli impegni della settimana:\n\n<impegni>\n[giorno, ora, chi, dove, chi accompagna]\n</impegni>\n\nVINCOLI\n[chi guida, orari di lavoro, distanze, chi non può fare cosa]\n\nFammi il prospetto della settimana e:\n1. segnala i conflitti (sovrapposizioni, spostamenti impossibili)\n2. proponi come risolverli\n3. dimmi dove c’è del tempo morto che si potrebbe usare meglio\n\nNon spostare niente di tua iniziativa senza dirmelo: proponi e spiega.', tip:'Chiedi il risultato anche come tabella da stampare per il frigo.'},
 {c:'ordine', l:'base', w:'chat', t:'Menù e spesa della settimana', s:'La domanda delle 19:30: “cosa mangiamo?”.', o:'Sette cene e la lista della spesa per reparti.', pr:'Siamo [chi, con età ed esigenze: allergie, intolleranze, gusti].\n\nVINCOLI\n- ho [minuti] per cucinare nei giorni feriali, di più nel weekend\n- budget settimanale: [importo]\n- in dispensa ho già: [elenco]\n- non mi va di mangiare: [elenco]\n\nFammi il menù delle cene per 7 giorni e la lista della spesa divisa per reparti del supermercato.\n\nRiusa gli ingredienti tra un giorno e l’altro per non sprecare, e dimmi dove riciclo gli avanzi.\nNiente ricette che richiedono attrezzature particolari.', tip:'Chiedi di segnare quali piatti si possono preparare in anticipo.'},
 {c:'ordine', l:'intermedio', w:'chat', t:'Il trasloco (o il cambio di stagione)', s:'Un’impresa che si sottovaluta sempre.', o:'Un piano a ritroso dalla data.', pr:'Devo [traslocare/svuotare una casa/fare il cambio di stagione] entro il [data]. Oggi è il [data].\n\nSITUAZIONE\n[metri quadri, persone, cosa c’è da spostare, chi aiuta, cosa è già fatto]\n\nFammi un piano a ritroso dalla data finale: cosa fare ogni settimana e ogni giorno negli ultimi giorni.\n\nIncludi le cose che tutti dimenticano (cambi di residenza, utenze, posta, scuola, medico di base).\nSegnala cosa dipende da altri e va prenotato con anticipo.\nDimmi cosa succede se salto un passaggio.', tip:'Chiedi anche la lista “cosa buttare, cosa regalare, cosa vendere”.'},
 /* --- DIGITALE --- */
 {c:'digitale', l:'base', w:'chat', t:'È una truffa?', s:'Un SMS della banca, una mail del corriere, una telefonata strana.', o:'Un giudizio motivato e cosa fare.', pr:'Ho ricevuto questo messaggio:\n\n<messaggio>\n[incolla il testo, senza cliccare su nessun link]\n</messaggio>\n\nDimmi:\n1. quali elementi fanno pensare a una truffa (o quali fanno pensare che sia autentico)\n2. cosa fanno di solito questi messaggi se ci si clicca\n3. cosa devo fare adesso, in concreto\n4. come verifico se è autentico senza usare i contatti scritti nel messaggio\n\nSe non sei sicuro, dimmi che non sei sicuro e dimmi come controllare.', tip:'Non incollare mai i link cliccandoci: copia il testo.'},
 {c:'digitale', l:'base', w:'chat', t:'Il computer che non fa quello che vuoi', s:'Un’impostazione nascosta in un menu che non trovi.', o:'I passaggi esatti per il tuo sistema.', pr:'Uso [Windows 11 / macOS / Android / iPhone] e devo [cosa vuoi fare].\n\nDammi le istruzioni:\n- un passaggio per riga, numerati\n- dicendo esattamente dove cliccare e cosa vedo sullo schermo\n- senza dare per scontato che conosca i nomi dei menu\n\nSe ci sono più modi, dammi quello più semplice.\nSe il passaggio dipende dalla versione del sistema, dimmi come faccio a sapere quale ho.\nSe qualcosa può avere conseguenze (perdita di dati, impostazioni difficili da ripristinare), avvisami prima.', tip:'Fotografa lo schermo e allega: capisce subito dove sei.'},
 {c:'digitale', l:'base', w:'img', t:'Cosa c’è in questa foto', s:'Una pianta, un insetto, una spia dell’auto, una vite strana.', o:'Il riconoscimento e cosa farne.', pr:'Ti allego una foto.\n\nDimmi:\n1. cosa vedi, con il nome preciso se lo riconosci\n2. quanto sei sicuro (molto/abbastanza/poco)\n3. cosa dovrei fare adesso\n\nSe non sei sicuro, dimmi cosa dovrei fotografare meglio o da quale angolazione per aiutarti a riconoscerlo.\nNon inventare un nome preciso se puoi dirmi solo la categoria generale.', tip:'Il punto 2 è quello che ti evita guai: pretendilo sempre.'},
 {c:'digitale', l:'intermedio', w:'chat', t:'Un invito o un biglietto fatto bene', s:'Festa di compleanno, e le app gratuite fanno tutte schifo.', o:'Un’immagine o un file pronto da stampare.', pr:'Devo fare [un invito / un biglietto / una locandina] per [occasione].\n\nTESTO ESATTO DA METTERE\n"[scrivi qui parola per parola]"\n\nSTILE\n[allegro e colorato / sobrio / a tema specifico]\nFORMATO\n[A5 verticale / quadrato per WhatsApp / A4 da stampare]\n\nCreamelo, poi dimmi cosa posso cambiare.\nControlla che il testo sia scritto esattamente come te l’ho dato, lettera per lettera.', tip:'Il testo nelle immagini esce spesso sbagliato: rileggilo sempre.'},
 /* --- KIT (avanzato) --- */
 {c:'kit', l:'avanzato', w:'app', t:'Uno strumento su misura in mezz’ora', s:'Ti serve una cosa che nessuna app fa esattamente come vuoi tu.', o:'Un file che apri con doppio clic.', pr:'Creami una pagina web in un SOLO file .html che [cosa deve fare].\n\nREQUISITI\n- tutto in italiano\n- funziona anche senza internet e senza librerie esterne\n- i dati restano solo nel mio browser e ci sono ancora quando riapro\n- funziona bene anche sul telefono\n- pulsante per esportare i dati, per stampare e per cancellare tutto\n\nPRIMA di scrivere il codice fammi le domande che ti servono, una alla volta.\nPOI descrivimi come sarà fatta e aspetta il mio ok.\nAlla fine dimmi come si salva e come si apre, passo passo.', tip:'Tieni una copia della versione che funziona prima di ogni modifica.'},
 {c:'kit', l:'avanzato', w:'local', t:'Mettere ordine in una cartella-discarica', s:'“Documenti” con dentro dodici anni di tutto.', o:'Un piano di riordino, da approvare prima.', pr:'Nella cartella [percorso] ci sono anni di file accumulati.\n\nPRIMA FASE (solo analisi, non toccare niente):\n1. dimmi quanti file ci sono, di che tipo, e quanto spazio occupano\n2. raggruppali per tipo e per anno\n3. segnala i doppioni probabili (stesso nome o stesso contenuto)\n4. proponimi una struttura di sottocartelle\n\nMostrami il piano completo e ASPETTA il mio ok prima di spostare qualsiasi cosa.\nQuando ti dico di procedere: lavora su copie, non cancellare niente, e dammi il riepilogo di cosa hai spostato.', tip:'Fai una copia di sicurezza della cartella prima di iniziare.'},
 {c:'kit', l:'avanzato', w:'agent', t:'Documenti in una tabella, in automatico', s:'Decine di PDF con dentro sempre gli stessi dati.', o:'Un Excel pronto, con i controlli.', pr:'Nella cartella "documenti-copie" leggi tutti i PDF ed estrai per ognuno: [elenco dei dati che ti servono].\n\nCrea un Excel nella cartella "risultati" con una riga per documento.\n\nCONTROLLI (sì/no)\n- il numero di righe deve essere uguale al numero di PDF letti\n- ogni riga deve avere [campi obbligatori]\n- i numeri devono essere numeri, le date in gg/mm/aaaa\n\nSTOP\n- dopo 3 tentativi su un file, segnalo come DA VERIFICARE e prosegui\n- non modificare né cancellare i file originali\n\nAlla fine: quanti file letti, quante righe scritte, quali DA VERIFICARE e perché.', tip:'Prova prima su cinque file.'},
 {c:'kit', l:'intermedio', w:'chat', t:'Il prompt che ti scrivi da solo', s:'Non sai come chiedere una cosa complicata.', o:'Un prompt costruito con un’intervista.', pr:'Devo chiedere a un’AI di aiutarmi con [argomento], ma non so come formulare la richiesta.\n\nIntervistami una domanda alla volta, in italiano semplice, per capire:\n1. la situazione di partenza\n2. cosa voglio ottenere davvero\n3. chi leggerà o userà il risultato\n4. come lo voglio (lunghezza, forma, formato)\n5. cosa NON deve fare\n\nQuando hai tutte le risposte, scrivimi il prompt finito in un blocco che posso copiare, includendo la regola "se ti mancano informazioni, chiedimele invece di inventare".\n\nNon scrivere il prompt prima di avermi fatto tutte le domande.', tip:'Funziona ogni volta che ti blocchi davanti alla casella vuota.'}
];
const ricVisible = () => {
 const maxL = lvNow()===1 ? ['base'] : lvNow()===2 ? ['base','intermedio'] : ['base','intermedio','avanzato'];
 return RICETTE.filter(r => maxL.includes(r.l) && (S.ric.f==='tutti' || r.c===S.ric.f) && (S.ric.l==='tutti' || r.l===S.ric.l));
};

const qzAvail = () => QZ.map((q,i)=>i).filter(i=>QZ[i].lv <= lvNow());

const QZ_N = () => Math.min(10, qzAvail().length);
function qzPick(){
 const viste = qzLoad().viste, byArg = {}, n = QZ_N();
 shuffle(qzAvail()).forEach(i=>{ (byArg[QZ[i].a] = byArg[QZ[i].a] || []).push(i); });
 Object.values(byArg).forEach(l=>l.sort((x,y)=>(viste[x]||0)-(viste[y]||0)));
 const out = [], args = shuffle(Object.keys(byArg));
 while(out.length < n){ let added = false; for(const a of args){ if(out.length >= n) break; const l = byArg[a]; if(l.length){ out.push(l.shift()); added = true; } } if(!added) break; }
 return shuffle(out);
}
const qzVoto = () => { const Q = S.qz, n = Q.set.length || 1; return Math.round(Q.risposte.filter(y=>y&&y.ok).length / n * 10); };

const qzColor = v => v>=8 ? '#16a34a' : v>=6 ? '#2563eb' : v>=4 ? '#d97706' : '#dc2626';

 return `<svg viewBox="0 0 140 140" class="qz-ring" role="img" aria-label="Voto ${v} su 10"><circle cx="70" cy="70" r="54" fill="none" stroke="#e2e8f0" stroke-width="14"/><circle cx="70" cy="70" r="54" fill="none" stroke="${c}" stroke-width="14" stroke-linecap="round" stroke-dasharray="${C*v/10} ${C}" transform="rotate(-90 70 70)" class="qz-ring-arc"/><text x="70" y="78" text-anchor="middle" font-size="38" font-weight="800" fill="#0f1b2d">${v}</text><text x="70" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#64748b">su 10</text></svg>`;
}

 ${n ? `<div class="qz-stats">

 const e = $('#toolsel');
 e.classList.toggle('pick', !hasTool());
 e.innerHTML = `<span>${hasTool() ? 'Uso:' : 'Scegli:'}</span>` + Object.entries(TOOLS).map(([k,x])=>`<button class="${S.tool===k?'on':''}" style="--tc:${x.c}" data-act="set-tool" data-tool="${k}">${x.l}</button>`).join('');
 const c = $('#lvchip'), L1 = lvInfo();
 c.style.setProperty('--lc', L1.c);
 c.innerHTML = `${L1.ic} <span>${S.lv ? 'Livello ' + L1.l : 'Fai il test'}</span>`;
 c.title = S.lv ? 'Corso di livello ' + L1.l + ' — clicca per cambiarlo' : 'Fai il test per costruire il tuo corso';
}
const pc = l => l.p && PILLARS[l.p] ? PILLARS[l.p].c : l.p==='fine' ? '#16a34a' : '#38bdf8';
function renderSide(){
 const V = vis();
 $('#side').innerHTML = `<div class="brand"><div class="brand-logo">AI</div><div><b>Corso AI</b><small>Personale</small><div class="rev-line"><span class="by-tag">App by Pippo</span><span class="rev-tag">Rev. ${REV}</span></div></div></div>` +
  `<div class="side-lv"><b>${lvInfo().ic} Livello ${lvInfo().l}</b>${S.lv ? V.length + ' lezioni su ' + LESSONS.length : 'Non hai ancora fatto il test'}<button data-act="go" data-to="livello">${S.lv ? 'Cambia livello' : 'Fai il test →'}</button></div>` +
  GROUPS.map(([k,label,c,n])=>{ const all = LESSONS.filter(l=>l.p===k); if(!all.length) return '';
   const ls = all.filter(l=>l.lv <= lvNow()), lock = all.length - ls.length;
   if(!ls.length && !lock) return '';
   return `<div class="grp" style="--gc:${c}">${n?`<i>${n}</i>`:''}${label}</div>` +
    ls.map(l=>`<button class="li${l.id===curId?' on':''}" data-act="go" data-to="${l.id}"><span class="ck${S.done[l.id]?' ok':''}">${S.done[l.id]?'✓':''}</span><span>${esc(l.t)}</span></button>`).join('') +
    (lock ? `<button class="li lock" data-act="go" data-to="livello"><span class="ck">🔒</span><span>${lock} ${lock===1?'lezione':'lezioni'} nei livelli successivi</span></button>` : ''); }).join('') +
  `<button class="side-reset" data-act="reset">↺ Ricomincia da capo</button>`;
}
function progress(){
 const V = vis(), d = V.filter(l=>S.done[l.id]).length, pct = Math.round(d/V.length*100);
 setText('prog-l', `Lezione ${curIdx()+1} di ${V.length}`); setText('prog-r', `${d} completate · ${pct}%`);
 $('#prog-i').style.width = pct + '%';
}
function render(){
 const V = vis(), i = curIdx(), l = V[i];
 curId = l.id;
 const same = V.filter(x=>x.p===l.p), pos = same.indexOf(l)+1;
 const kick = l.p && PILLARS[l.p] ? `Pilastro ${PILLARS[l.p].n} · ${PILLARS[l.p].t}` : l.p==='fine' ? 'Conclusione' : 'Inizia da qui';
 const prev = V[i-1], next = V[i+1];
 $('#page').innerHTML = `<header class="lhead" style="--pc:${pc(l)}"><div class="lkick">${kick}</div><h1>${esc(l.t)}</h1><p>${esc(l.sub)}</p>
  <div class="meta"><span>📖 Lezione ${pos} di ${same.length}</span><span>⏱ circa ${l.min} minuti</span><span>${lvInfo().ic} ${lvInfo().l}</span>${S.done[l.id]?'<span>✅ Completata</span>':''}</div></header>` +
  l.body() +
  `<nav class="lnav">${prev?`<button class="btn" data-act="go" data-to="${prev.id}">← ${esc(prev.t)}</button>`:'<span></span>'}
   ${next?`<button class="btn primary" data-act="next">Ho capito, avanti →</button>`:`<button class="btn green" data-act="next">✓ Ho finito il corso</button>`}</nav>`;
 renderSide(); renderToolSel(); progress(); update(); saveProgress();
 $('#side').classList.remove('open');
 try{ history.replaceState(null,'','#'+l.id); }catch(e){}
}
function update(){ const l = curLesson(); if(l && l.update) l.update(); }
function toEl(id){ const e = document.getElementById(id) || $('#page'); window.scrollTo({top: Math.max(0, e.getBoundingClientRect().top + window.scrollY - 80), behavior:'smooth'}); }
function goId(id){ const V = vis(); if(V.some(l=>l.id===id)){ curId = id; render(); window.scrollTo({top:0,behavior:'smooth'}); } }
function goIdx(i){ const V = vis(); if(i>=0 && i<V.length) goId(V[i].id); }
async function copyText(t){
 try{ await navigator.clipboard.writeText(t); }
 catch(e){ const ta = document.createElement('textarea'); ta.value = t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
 toast('Copiato negli appunti ✓');
}
function onField(e){
 const t = e.target;
 if(t.dataset.k){
  if(t.type==='radio' && !t.checked) return;
  setPath(t.dataset.k, t.type==='checkbox' ? t.checked : t.type==='number' ? (t.value===''?'':Number(t.value)) : t.value);
  update(); return;
 }
 if(t.dataset.row){
  const r = S.map.rows.find(x=>x.id===t.dataset.row); if(!r) return;
  r[t.dataset.f] = ['volte','minuti','nec'].includes(t.dataset.f) ? (t.value===''?'':Number(t.value)) : t.value;
  update();
 }
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);
document.addEventListener('click', e=>{
 const el = e.target.closest('[data-act]'); if(!el) return;
 const d = el.dataset;
 switch(d.act){
  case 'go': goId(d.to); break;
  case 'next': S.done[curId] = true; { const V = vis(), i = curIdx(); if(i < V.length-1) goIdx(i+1); else { render(); toast('Complimenti, corso completato! 🎉'); } } break;
  case 'menu': $('#side').classList.toggle('open'); break;
  case 'copy': { const p = document.getElementById(d.src); if(p) copyText(p.textContent); break; }
  case 'download': { const p = document.getElementById(d.src); if(p){ download(d.name, p.textContent); toast('File ' + d.name + ' scaricato'); } break; }
  case 'set-tool': {
   const page = $('#page'), block = el.closest('#page > *'), idx = block ? [...page.children].indexOf(block) : -1, top = block ? block.getBoundingClientRect().top : 0;
   S.tool = d.tool; render();
   if(idx >= 0){ const nb = page.children[idx]; if(nb) window.scrollBy(0, nb.getBoundingClientRect().top - top); }
   toast('Istruzioni per ' + TOOLS[d.tool].l); break; }
  case 'test-ans': { S.test[d.q] = Number(d.o); const done = testAnswered()===TEST.length; render(); if(done) toEl('lvres'); break; }
  case 'test-reset': S.test = {}; render(); window.scrollTo({top:0,behavior:'smooth'}); break;
  case 'set-lv': {
   const n = Number(d.lv), prima = S.lv;
   S.lv = n; S.qz = {fase:'home',set:[],i:0,risposte:[],ordine:[]};
   if(!vis().some(l=>l.id===curId)) curId = LESSONS[0].id;
   render(); saveProgress();
   toast(prima===n ? 'Corso di livello ' + LV[n].l : '✓ Corso di livello ' + LV[n].l + ' pronto: ' + vis().length + ' lezioni');
   break; }
  case 'reset': if(confirm('Vuoi azzerare tutto: test, livello, lezioni completate e strumento scelto?')){ try{ localStorage.removeItem(STORE); }catch(e){} initState(); curId = LESSONS[0].id; render(); window.scrollTo({top:0}); toast('Corso azzerato'); } break;
  case 'ric': S.ric.f = d.f; render(); break;
  case 'ric-l': S.ric.l = d.l; render(); break;
  case 'qz-start': { const set = qzPick(); S.qz = {fase:'domanda', set, i:0, risposte:[], ordine:set.map(()=>shuffle([0,1,2,3]))}; render(); toEl('qz'); break; }
  case 'qz-ans': { const Q = S.qz; if(Q.risposte[Q.i]) break; const o = Number(d.o); Q.risposte[Q.i] = {scelta:o, ok:o===0};
   const D = qzLoad(); D.viste[Q.set[Q.i]] = (D.viste[Q.set[Q.i]]||0) + 1; qzSave(D); render(); break; }
  case 'qz-next': { const Q = S.qz; if(Q.i < Q.set.length-1){ Q.i++; render(); toEl('qz'); break; }
   const arg = {}; Q.set.forEach((qi,i)=>{ const a = QZ[qi].a; arg[a] = arg[a] || [0,0]; arg[a][1]++; if(Q.risposte[i] && Q.risposte[i].ok) arg[a][0]++; });
   const D = qzLoad(); D.storico.push({t:Date.now(), voto:qzVoto(), arg}); qzSave(D);
   Q.fase = 'fine'; render(); toEl('qz'); break; }
  case 'qz-home': S.qz.fase = 'home'; render(); toEl('qz'); break;
  case 'qz-reset': if(confirm('Vuoi azzerare tutti i risultati del quiz?')){ qzSave({storico:[], viste:{}}); S.qz.fase = 'home'; render(); toast('Risultati del quiz azzerati'); } break;
  case 'preset': applyPreset(S.prompt, PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'preset-skill': applyPreset(S.skill, SKILL_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'preset-app': applyPreset(S.app, APP_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'preset-agent': applyPreset(S.agente, AGENT_PRESETS[d.p]); render(); toast('Esempio caricato: modificalo come vuoi'); break;
  case 'quiz': S.quiz[d.q] = d.a; render(); break;
  case 'add-row': S.map.rows.push({id:nid(), nome:'', volte:1, minuti:30, nec:5, tipo:'testo'}); render();
   setTimeout(()=>{ const ins = document.querySelectorAll('[data-f="nome"]'); if(ins.length) ins[ins.length-1].focus(); }, 30); break;
  case 'del-row': S.map.rows = S.map.rows.filter(r=>r.id!==d.id); render(); break;
  case 'example-map': S.map.rows = MAP_EXAMPLE.map(r=>Object.assign({id:nid()}, r)); render(); break;
 }
});
initState();
const saved = loadProgress();
if(saved){
 S.done = saved.done || {};
 if(TOOLS[saved.tool]) S.tool = saved.tool;
 if([1,2,3].includes(saved.lv)) S.lv = saved.lv;
 if(saved.test && typeof saved.test === 'object') S.test = saved.test;
}
const hadHash = vis().some(l=>'#'+l.id===location.hash);
if(hadHash) curId = location.hash.slice(1);
else if(saved && saved.lesson && vis().some(l=>l.id===saved.lesson)) curId = saved.lesson;
render();
if(saved && curId!==LESSONS[0].id && !hadHash) toast('Bentornato: riprendi da “' + curLesson().t + '”');
</script>
</body>
</html>
