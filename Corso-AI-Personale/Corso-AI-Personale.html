<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Corso AI Personale</title>
<style>
:root{--navy:#0f1b2d;--navy2:#1a2b44;--ink:#1e293b;--muted:#5b6b82;--line:#e2e8f0;--bg:#f4f6fb;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--sh:0 1px 2px rgba(15,27,45,.05),0 8px 24px rgba(15,27,45,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* Indice */
.side{background:var(--navy);color:#cbd5e1;position:sticky;top:0;height:100vh;overflow:auto;padding:20px 12px 24px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 16px;border-bottom:1px solid #22344f;margin-bottom:12px}
.brand-logo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,#4f46e5,#0d9488 50%,#e11d48);display:grid;place-items:center;color:#fff;font-weight:800}
.brand b{display:block;color:#fff;font-size:16px;line-height:1.2}.brand small{color:#94a3b8;font-size:12.5px}
.grp{margin:12px 0 4px;padding:0 8px;font-size:11.5px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--gc,#94a3b8);display:flex;align-items:center;gap:8px}
.grp i{width:22px;height:22px;border-radius:6px;background:var(--gc);color:#fff;display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:transparent;border:0;color:#cbd5e1;padding:6px 10px;border-radius:9px;cursor:pointer;font-size:14px;line-height:1.3}
.li:hover{background:var(--navy2)}
.li.on{background:#fff;color:var(--ink);font-weight:600}
.ck{width:16px;height:16px;border-radius:50%;border:2px solid #475569;display:grid;place-items:center;font-size:10px;color:#fff}
.ck.ok{background:#22c55e;border-color:#22c55e}
.li.on .ck{border-color:#94a3b8}.li.on .ck.ok{border-color:#22c55e}
.li.lock{opacity:.5}
.li.lock .ck{border-style:dashed;border-color:#64748b}
.side-lv{margin:16px 8px 0;background:#152740;border:1px solid #22344f;border-radius:12px;padding:12px 14px;font-size:13px;color:#94a3b8;line-height:1.5}
.side-lv b{color:#fff;display:block;font-size:14.5px;margin-bottom:2px}
.side-lv button{margin-top:9px;width:100%;background:#2563eb;border:0;color:#fff;border-radius:8px;padding:8px 10px;font-weight:700;cursor:pointer;font-size:13px}
.side-lv button:hover{background:#1d4ed8}
/* Barra superiore */
main{min-width:0}
.topbar{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 28px;display:flex;align-items:center;gap:16px}
.menu-btn{display:none;border:1.5px solid #cbd5e1;background:#fff;border-radius:9px;padding:6px 12px;font-weight:700;cursor:pointer}
.prog{flex:1;display:grid;gap:4px;min-width:150px}
.prog-t{font-size:13px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.prog-bar{height:8px;border-radius:99px;background:#e2e8f0;overflow:hidden}.prog-bar i{display:block;height:100%;background:linear-gradient(90deg,#4f46e5,#0d9488,#16a34a);transition:width .3s}
#page{max-width:980px;margin:0 auto;padding:26px 28px 40px;display:grid;gap:20px}
/* Intestazione lezione */
.lhead{background:linear-gradient(120deg,var(--navy),#1f3a5f);color:#fff;border-radius:18px;padding:24px 28px;position:relative;overflow:hidden;box-shadow:var(--sh)}
.lhead:before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--pc)}
.lkick{font-size:12.5px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:color-mix(in srgb,var(--pc) 45%,#fff)}
.lhead h1{margin:4px 0 6px;font-size:30px;line-height:1.2}
.lhead p{margin:0;color:#cbd5e1;font-size:17px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.meta span{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 12px;font-size:13px}
/* Blocchi di contenuto */
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 26px;box-shadow:var(--sh);min-width:0}
.card h2{margin:0 0 8px;font-size:21px}
.card h3{margin:16px 0 6px;font-size:17px}
.card p{margin:0 0 10px}
.card ul,.card ol{margin:0 0 10px;padding-left:22px}
.card li{margin:3px 0}
.lead{color:var(--muted);margin:0 0 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.analogy{display:grid;grid-template-columns:56px 1fr;gap:14px;align-items:center;background:linear-gradient(90deg,#eef2ff,#fff);border:1px solid #c7d2fe;border-radius:16px;padding:16px 20px}
.analogy .ic{font-size:36px;text-align:center}.analogy b.at{display:block;color:#3730a3}
.keys{background:#f0fdf4;border:1px solid #bbf7d0;border-left:6px solid var(--green);border-radius:14px;padding:16px 22px}
.keys h3{margin:0 0 6px;color:#166534;font-size:15px;text-transform:uppercase;letter-spacing:.8px}
.keys ul{margin:0;padding-left:20px}
.warn{background:#fffbeb;border:1px solid #fde68a;border-left:6px solid var(--amber);border-radius:14px;padding:14px 20px}
.note{background:#eff6ff;border:1px solid #bfdbfe;border-left:6px solid var(--blue);border-radius:14px;padding:14px 20px}
.warn b.t,.note b.t{display:block}
.ex{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ex>div{border-radius:14px;padding:14px 16px;border:1.5px solid}
.ex .bad{background:#fef2f2;border-color:#fecaca}.ex .good{background:#f0fdf4;border-color:#bbf7d0}
.ex .lab{font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px}
.ex .bad .lab{color:#b91c1c}.ex .good .lab{color:#15803d}
.ex pre{margin:0;white-space:pre-wrap;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ex .why{font-size:14px;margin-top:8px;color:#334155}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:10px}
.steps>li{counter-increment:s;position:relative;padding:3px 0 3px 44px;min-height:32px;margin:0}
.steps>li:before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--pc,var(--blue));color:#fff;font-weight:800;display:grid;place-items:center;font-size:15px}
.letters{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.letter-card{border-radius:14px;padding:14px;background:#fff;border:1.5px solid #c7d2fe;text-align:center}
.letter-card .L{width:44px;height:44px;border-radius:12px;background:#4f46e5;color:#fff;font-weight:800;font-size:22px;display:grid;place-items:center;margin:0 auto 6px}
.letter-card b{display:block}.letter-card small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.chat{display:grid;gap:10px}
.bub{max-width:85%;padding:10px 14px;border-radius:14px;font-size:15px}
.bub.u{justify-self:end;background:#2563eb;color:#fff;border-bottom-right-radius:4px}
.bub.a{justify-self:start;background:#f1f5f9;border-bottom-left-radius:4px}
.bub small{display:block;font-size:11.5px;font-weight:700;opacity:.8;margin-bottom:2px}
/* Tabelle */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{background:#f1f5f9;text-align:left;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:#475569;padding:10px 12px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 12px;border-bottom:1px solid #eef2f6;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl input,.tbl select{padding:6px 8px;font-size:14px}
code{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 6px;font-size:.9em}
/* Esercizio */
.try{border:2px solid var(--pc,#2563eb);border-radius:18px;padding:22px 24px;background:#fff;box-shadow:var(--sh)}
.try-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.try-h span{background:var(--pc,#2563eb);color:#fff;font-weight:800;font-size:12.5px;letter-spacing:1px;border-radius:999px;padding:4px 12px}
.try-h h2{margin:0;font-size:21px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px 16px;margin:12px 0}
.field{display:grid;gap:5px;align-content:start}.field.wide{grid-column:1/-1}
.field>span{font-size:14px;font-weight:700;color:#334155}
.hint{color:var(--muted);font-size:13px}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;border:1.5px solid #cbd5e1;border-radius:10px;padding:10px 12px;background:#fff}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
.presets{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 4px}.presets>span{font-size:14px;color:var(--muted);font-weight:600}
.chip-btn{border:1.5px solid #c7d2fe;background:#eef2ff;color:#3730a3;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:600;cursor:pointer}
.chip-btn:hover{background:#e0e7ff}
.btn{border:1.5px solid #cbd5e1;background:#fff;border-radius:11px;padding:10px 16px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:#94a3b8}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.primary:hover{background:#1d4ed8}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.icon-btn{border:0;background:#fee2e2;color:var(--red);width:32px;height:32px;border-radius:8px;cursor:pointer;font-weight:700}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.out{background:#0b1220;border-radius:14px;overflow:hidden;margin-top:12px}
.out-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px;background:#111a2e;color:#93c5fd;font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;flex-wrap:wrap}
.out-h div{display:flex;gap:6px}
.out-h button{background:#2563eb;color:#fff;border:0;border-radius:7px;padding:5px 12px;font-weight:700;cursor:pointer;text-transform:none;letter-spacing:0}
.out-h button.dl{background:#16a34a}
.out pre{margin:0;padding:14px 16px;color:#e2e8f0;white-space:pre-wrap;word-wrap:break-word;font:13.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;max-height:520px;overflow:auto}
.meter{margin:6px 0}.meter-bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}.meter-bar i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#16a34a);transition:width .25s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:#f1f5f9;color:#94a3b8;border:1px solid var(--line)}
.chip.on{background:#dcfce7;color:#166534;border-color:#bbf7d0}
.badge{display:inline-flex;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap;background:color-mix(in srgb,var(--bc) 12%,#fff);color:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 35%,#fff)}
.ver{display:grid;gap:6px;margin-top:8px}.ver div{font-size:14px;border-radius:8px;padding:6px 10px}
.ver .ok{background:#dcfce7;color:#166534}.ver .ko{background:#fef3c7;color:#92400e}
/* Markdown */
.md-live{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.md-live textarea{font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;min-height:340px}
.md-view{border:1.5px solid var(--line);border-radius:10px;padding:12px 16px;background:#fcfdff;min-height:340px;overflow:auto}
.md-view h1{font-size:22px;margin:4px 0 8px}.md-view h2{font-size:18px;margin:12px 0 6px}.md-view h3{font-size:16px;margin:10px 0 4px}
.md-view p{margin:0 0 8px}.md-view ul,.md-view ol{margin:0 0 8px;padding-left:22px}
.md-view .fm{background:#f5f3ff;border:1px dashed #a78bfa;border-radius:8px;padding:8px 12px;font:13px/1.5 ui-monospace,Menlo,monospace;color:#5b21b6;margin-bottom:10px;white-space:pre-wrap}
.tree{font:14.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0b1220;color:#e2e8f0;border-radius:12px;padding:14px 18px;white-space:pre}
.tree b{color:#93c5fd}.tree i{color:#94a3b8;font-style:normal}
/* Niente scorrimento orizzontale della pagina su telefono */
#page>*,.grid2>*,.grid3>*,.form>*,.steps>li,.how-body,.tab-body{min-width:0}
.tree{overflow-x:auto;max-width:100%}
code,.path{overflow-wrap:anywhere}
.card p,.card li,.note,.warn,.keys{overflow-wrap:break-word}
.diagram svg{width:100%;height:auto;max-height:470px;display:block;margin:0 auto;font-family:inherit}
.clickable{cursor:pointer}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.scale>div{border-radius:12px;padding:12px 14px;background:color-mix(in srgb,var(--bc) 9%,#fff);border:1px solid color-mix(in srgb,var(--bc) 30%,#fff);border-left:5px solid var(--bc)}
.scale b{display:block;color:var(--bc)}.scale span{font-size:14.5px}
.quiz{display:grid;gap:10px}
.qopt{text-align:left;border:1.5px solid #cbd5e1;background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer}
.qopt:hover{border-color:#2563eb}
.qres{border-radius:12px;padding:12px 16px;background:#0f1b2d;color:#fff;margin-top:6px}
.plan{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.week{border-radius:14px;border:1px solid var(--line);border-top:5px solid var(--pc);padding:14px;background:#fff}
.week b{display:block;color:var(--pc)}.week ul{padding-left:18px;margin:6px 0 0;font-size:14.5px}
.pillar-cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
.pc{border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:12px;padding:12px;background:#fff;cursor:pointer;text-align:left}
.pc:hover{box-shadow:var(--sh)}.pc b{display:block;color:var(--pc);font-size:13px}.pc span{font-size:14px}
/* Navigazione lezioni */
.lnav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px;padding:16px 0 0;border-top:1px solid var(--line)}
.lnav .btn{padding:13px 20px;font-size:16px;white-space:normal;max-width:100%}
.btn{max-width:100%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0f1b2d;color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:50}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Strumento scelto e livello */
.toolsel{display:flex;align-items:center;gap:3px;background:#f1f5f9;border:1px solid var(--line);border-radius:11px;padding:3px}
.toolsel>span{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px}
.toolsel button{border:0;background:transparent;border-radius:8px;padding:6px 11px;font-weight:700;font-size:13.5px;color:#475569;cursor:pointer}
.toolsel button:hover{background:#e2e8f0}
.toolsel button.on{background:var(--tc);color:#fff}
.toolsel.pick{border-color:#f59e0b;box-shadow:0 0 0 3px rgba(245,158,11,.25)}
.lvchip{display:flex;align-items:center;gap:8px;background:color-mix(in srgb,var(--lc) 10%,#fff);border:1px solid color-mix(in srgb,var(--lc) 35%,#fff);border-radius:11px;padding:5px 10px;font-size:13.5px;font-weight:700;color:var(--lc);cursor:pointer;white-space:nowrap}
.lvchip:hover{background:color-mix(in srgb,var(--lc) 18%,#fff)}
.toolpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.tp{display:grid;gap:4px;align-content:start;text-align:left;border:2px solid var(--line);border-top:6px solid var(--tc);border-radius:14px;padding:14px 16px;background:#fff;cursor:pointer}
.tp:hover{border-color:var(--tc)}
.tp>b{font-size:21px;color:var(--tc)}.tp>small{color:var(--muted);font-size:12.5px;margin-top:-4px}.tp>span{font-size:14px;color:#334155;line-height:1.5}
.tp>i{font-style:normal;font-weight:800;font-size:13px;color:var(--tc);margin-top:6px}
.tp.on{background:color-mix(in srgb,var(--tc) 8%,#fff);border-color:var(--tc)}
.how{border:1px solid color-mix(in srgb,var(--tc,#94a3b8) 40%,#fff);border-radius:14px;overflow:hidden;margin:6px 0;min-width:0}
.how-bar{display:flex;align-items:center;gap:8px;padding:8px 16px;background:color-mix(in srgb,var(--tc,#94a3b8) 10%,#fff);font-size:13.5px;color:#334155}
.how-bar b{color:var(--tc)}
.how-dot{width:10px;height:10px;border-radius:50%;background:var(--tc)}
.how-body{padding:14px 18px;background:#fff;min-width:0}
.how-body h3:first-child{margin-top:0}
.path{background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:1px 7px;font-weight:700;font-size:.92em}
.rule{margin-top:12px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:10px 14px;font-size:15px}
.rule>b:first-child{display:block;color:#166534;font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:2px}
.dl-badge,.ok-badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700;line-height:1.6}
.dl-badge{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.ok-badge{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.aimake{border:2px dashed #a78bfa;border-radius:18px;padding:18px 22px;background:linear-gradient(135deg,#faf5ff,#fff);min-width:0}
.aimake-h span{font-size:12px;font-weight:800;letter-spacing:1px;color:#7c3aed}
.aimake-h h2{margin:2px 0 6px;font-size:20px}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:10px}
.levels>div{display:grid;gap:4px;align-content:start;border:1px solid var(--line);border-top:5px solid var(--pc);border-radius:12px;padding:12px;background:#fff}
.levels b{color:var(--pc);font-size:14.5px}.levels span{font-size:13.5px;color:#334155;line-height:1.45}.levels em{font-style:normal;font-size:12px;font-weight:700;color:var(--muted)}
.where{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14.5px;margin-top:10px}
.where>span:first-child{color:var(--muted);font-weight:600}
.where .alt{flex-basis:100%;color:#475569;font-size:13.5px}
.case,.recipe{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 22px;box-shadow:var(--sh);min-width:0}
.case{border-left:6px solid #e11d48}
.case-h{display:flex;gap:14px;align-items:flex-start}.case-ic{font-size:32px;line-height:1}
.case-h h2{margin:0 0 4px;font-size:19px}.case-h p{margin:0;color:#334155}
.recipe-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.recipe-h h3{margin:0;font-size:17px;flex-basis:100%}
.recipe-desc{margin-top:8px;font-size:15px}.recipe-desc p{margin:0 0 4px}
.recipe-tip{margin:10px 0 0;font-size:14.5px;color:#334155;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip-btn small{opacity:.7;font-weight:600}
.chip-btn.on{background:#4f46e5;border-color:#4f46e5;color:#fff}
.side-reset{display:block;width:calc(100% - 16px);margin:18px 8px 0;background:transparent;border:1px solid #334155;color:#94a3b8;border-radius:9px;padding:7px 10px;font-size:13px;cursor:pointer}
.side-reset:hover{color:#fff;border-color:#64748b}
/* Quiz e test di livello */
.qz-hero{display:flex;gap:20px;align-items:center;background:linear-gradient(120deg,#4f46e5,#0d9488 55%,#e11d48);color:#fff;border-radius:22px;padding:28px 30px;box-shadow:0 14px 34px rgba(79,70,229,.25);position:relative;overflow:hidden}

.qz-dots .ok{background:#16a34a;color:#fff}.qz-dots .ko{background:#dc2626;color:#fff}.qz-dots .cur{background:#4f46e5;color:#fff;box-shadow:0 0 0 3px #c7d2fe}

.qz-letter{flex:none;width:34px;height:34px;border-radius:10px;background:#eef2ff;color:#4338ca;display:grid;place-items:center;font-weight:800}

<div id="toast"></div>
<script>
'use strict';
const REV = '1.1';

/* ============ I 5 PILASTRI (versione vita quotidiana) ============ */
const PILLARS = {
 p1:{n:'I',  t:'Saper chiedere', short:'Chiedere', c:'#4f46e5', step:'p1-brief', det:'Richieste chiare e lavoro sui tuoi file: PDF, foto, Excel, Word.'},
 p2:{n:'II', t:'Non rispiegare tutto ogni volta', short:'Frizione', c:'#0d9488', step:'p2-attrito', det:'Istruzioni personali, progetti e assistenti: l’AI ti conosce già.'},
 p3:{n:'III',t:'Scegli cosa affidare all’AI', short:'Scelte', c:'#d97706', step:'p3-perche', det:'Quali cose della tua settimana conviene davvero passare all’AI.'},
 p4:{n:'IV', t:'Il tuo piccolo kit su misura', short:'Kit', c:'#7c3aed', step:'p4-app', det:'Mini-app personali e l’AI installata sul tuo computer.'},
 p5:{n:'V',  t:'Dal supporto alla delega', short:'Agenti', c:'#e11d48', step:'p5-chatbot', det:'Agenti che lavorano sui tuoi file, con controlli e limiti chiari.'}
};

/* ============ I TRE LIVELLI DEL CORSO ============ */
const LV = {
 1:{l:'Base', ic:'🌱', c:'#16a34a', sub:'Parto da zero',
    d:'Parole semplici, tutto spiegato dall’inizio, esempi di tutti i giorni. Niente installazioni, niente tecnicismi.',
    inc:['Come si parla all’AI per ottenere risposte utili','Come capire quando l’AI si inventa le cose','Come farle leggere una bolletta, un PDF, una foto','Come farti ricordare chi sei, una volta per tutte','Un ricettario di casi pronti da copiare'],
    esc:'Skill, mini-app e agenti restano fuori: li sbloccherai quando ti sentirai pronto.'},
 2:{l:'Intermedio', ic:'🚀', c:'#2563eb', sub:'Conosco le basi',
    d:'Si va più a fondo, ma senza tecnicismi e senza mai scrivere codice: organizzi, personalizzi e lavori sui tuoi file come si deve.',
    inc:['Tutto il livello Base, spiegato più a fondo','Consumi, limiti e chat che rallentano','Lavori lunghi divisi in passaggi','Progetti e assistenti personalizzati','La mappa delle tue attività di casa'],
    esc:'Creare app, skill e agenti resta fuori: è il livello Avanzato.'},
 3:{l:'Avanzato', ic:'🏆', c:'#7c3aed', sub:'Voglio tutto',
    d:'Il corso completo, con le parti che richiedono di installare qualcosa: skill, mini-app su misura e agenti che lavorano da soli.',
    inc:['Tutto quello che c’è nei livelli Base e Intermedio','Le Skill e i file .md','L’AI installata sul tuo computer','Mini-app personali, senza programmare','Agenti: controlli, stop e primo avvio'],
    esc:'Niente: vedi tutte le lezioni del corso.'}
};

/* ============ STATO (nel browser si salvano solo avanzamento, livello, strumento e voti) ============ */
let S, uid = 0;
const nid = () => 'r' + (++uid);
function initState(){
 S = {
  tool:'', lv:0, done:{}, test:{}, testDone:false,
  prompt:{contesto:'',ruolo:'',azione:'',formato:'',tono:'',destinatario:'',materiali:'',vincoli:'',domande:true,assunzioni:true},
  file:{tipo:'pdf',nome:'',contenuto:'',obiettivo:'',passi:'',uscita:'testo'},
  dec:{file:'pochi',riserv:'no',web:'no',consulta:'no',ripeti:'no'},
  pers:{chi:'',vita:'',tono:'tu',lunghezza:'sintetiche',lingua:'',evitare:'',fonti:true,nonloso:true,ipotesi:true,calcoli:true,web:true},
  proj:{nome:'',descr:'',docs:'',regole:''},
  asst:{nome:'',compito:'',input:'',regole:'',formato:''},
  md:{text:`# Spesa della settimana

Questa è una **frase in grassetto** e questa è normale.

## Cosa serve
- Frutta e verdura
- Pane e latte
- Detersivo per la lavastoviglie

## Passi
1. Controlla cosa manca in dispensa
2. Scrivi la lista per reparti
3. Aggiungi il budget massimo`},
  skill:{nome:'',quando:'',input:'',passi:'',template:'',controlli:''},
  quiz:{},
  map:{rows:[]},
  app:{nome:'',livello:'chat',problema:'',input:'',output:'',sensibili:'si'},
  agente:{obiettivo:'',strumenti:'',passi:'',controlli:'',seFallisce:'',maxTent:3,umano:'',output:''},
  ric:{f:'tutti',l:'tutti'},
  qz:{fase:'home',set:[],i:0,risposte:[],ordine:[]},
  tok:{msg:30,parole:200,pagine:20,ogni:6}
 };
}

/* ============ HELPER ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const v = (x, ph) => (x != null && String(x).trim()) ? String(x).trim() : '[' + ph + ']';
const fmt = n => Math.round(Number(n)||0).toLocaleString('it-IT');
const fmt1 = n => (Number(n)||0).toLocaleString('it-IT',{maximumFractionDigits:1});
const trunc = (s,n) => { s = String(s||''); return s.length > n ? s.slice(0,n-1) + '…' : s; };
const slug = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
const lines = t => String(t||'').split('\n').map(s=>s.trim().replace(/^[-•]\s*/,'')).filter(Boolean);
function getPath(p){ return p.split('.').reduce((o,k)=> o == null ? undefined : o[k], S); }
function setPath(p,val){ const ks=p.split('.'); let o=S; for(let i=0;i<ks.length-1;i++) o=o[ks[i]]; o[ks[ks.length-1]]=val; }
function setHTML(id,h){ const e=document.getElementById(id); if(e) e.innerHTML=h; }
function setText(id,t){ const e=document.getElementById(id); if(e) e.textContent=t; }
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(e._t); e._t=setTimeout(()=>e.classList.remove('show'),1800); }
function badge(l,c){ return `<span class="badge" style="--bc:${c}">${esc(l)}</span>`; }
const applyPreset = (target, p) => { const {label, ...val} = p; Object.assign(target, val); };

/* Livello attuale: 1 finché non si fa il test */
const lvNow = () => S.lv || 1;
const lvInfo = () => LV[lvNow()];
const byLv = o => o[lvNow()] ?? o.any ?? '';
const upTo = (n, html) => lvNow() >= n ? html : '';
const lvTag = n => `<span class="lv-tag" style="--lc:${LV[n].c}">${LV[n].ic} ${LV[n].l}</span>`;

/* Mini renderer Markdown: titoli, elenchi, grassetto, corsivo, codice, frontmatter */
function mdToHtml(src){
 let t = String(src||''), fm = '';
 const m = t.match(/^---\n([\s\S]*?)\n---\n?/);
 if(m){ fm = `<div class="fm">---\n${esc(m[1])}\n---</div>`; t = t.slice(m[0].length); }
 const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*/g,'$1<i>$2</i>').replace(/`(.+?)`/g,'<code>$1</code>');
 const out = []; let list = null;
 const close = () => { if(list){ out.push(`</${list}>`); list = null; } };
 t.split('\n').forEach(l=>{
  let r;
  if((r = l.match(/^(#{1,3})\s+(.*)/))){ close(); out.push(`<h${r[1].length}>${inline(r[2])}</h${r[1].length}>`); }
  else if((r = l.match(/^\s*[-*]\s+(.*)/))){ if(list!=='ul'){ close(); out.push('<ul>'); list='ul'; } out.push(`<li>${inline(r[1])}</li>`); }
  else if((r = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ close(); out.push('<ol>'); list='ol'; } out.push(`<li>${inline(r[1])}</li>`); }
  else if(!l.trim()){ close(); }
  else { close(); out.push(`<p>${inline(l)}</p>`); }
 });
 close();
 return fm + out.join('');
}

/* ============ MATTONCINI DELLE LEZIONI ============ */
function fld(k,label,o={}){
 const val = getPath(k) ?? '';
 let ctl;
 if(o.type==='area') ctl = `<textarea data-k="${k}" rows="${o.rows||3}" placeholder="${esc(o.ph||'')}">${esc(val)}</textarea>`;
 else if(o.type==='select') ctl = `<select data-k="${k}">${o.opts.map(([x,l])=>`<option value="${esc(x)}"${String(x)===String(val)?' selected':''}>${esc(l)}</option>`).join('')}</select>`;
 else ctl = `<input type="${o.type||'text'}" data-k="${k}" value="${esc(val)}" placeholder="${esc(o.ph||'')}"${o.min!=null?` min="${o.min}"`:''}>`;
 return `<label class="field${o.wide?' wide':''}"><span>${label}</span>${ctl}${o.hint?`<small class="hint">${o.hint}</small>`:''}</label>`;
}
function cb(k,label){ return `<label style="display:flex;gap:8px;align-items:center;font-size:15px"><input type="checkbox" data-k="${k}"${getPath(k)?' checked':''}> ${label}</label>`; }
const card = (h, body, lead) => `<section class="card">${h?`<h2>${h}</h2>`:''}${lead?`<p class="lead">${lead}</p>`:''}${body}</section>`;
const analogy = (ic, t, h) => `<div class="analogy"><div class="ic">${ic}</div><div><b class="at">${t}</b>${h}</div></div>`;
const keys = arr => `<div class="keys"><h3>✅ Da ricordare</h3><ul>${arr.map(x=>`<li>${x}</li>`).join('')}</ul></div>`;
const warn = (t,h) => `<div class="warn"><b class="t">⚠️ ${t}</b>${h}</div>`;
const note = (t,h) => `<div class="note"><b class="t">ℹ️ ${t}</b>${h}</div>`;
const ex = (bad, good, whyBad, whyGood, labBad='Così no', labGood='Così sì') => `<div class="ex"><div class="bad"><div class="lab">✗ ${labBad}</div><pre>${esc(bad)}</pre>${whyBad?`<div class="why">${whyBad}</div>`:''}</div><div class="good"><div class="lab">✓ ${labGood}</div><pre>${esc(good)}</pre>${whyGood?`<div class="why">${whyGood}</div>`:''}</div></div>`;
const tryBox = (t, body) => `<section class="try"><div class="try-h"><span>PROVA TU</span><h2>${t}</h2></div>${body}</section>`;
function outBox(id, title, text, dl){ return `<div class="out"><div class="out-h"><span>${title}</span><div>${dl?`<button class="dl" data-act="download" data-src="${id}" data-name="${esc(dl)}">⬇ Scarica ${esc(dl)}</button>`:''}<button data-act="copy" data-src="${id}">Copia</button></div></div><pre id="${id}">${esc(text||'')}</pre></div>`; }
const tbl = (head, rows) => `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
function download(name, text){
 const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'})); a.download = name;
 document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/* ============ GRAFICI E SCHEMI (SVG) ============ */
const ARROW = id => `<defs><marker id="${id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs>`;

function pillarsSVG(){
 const lab = {p1:['Saper','chiedere'],p2:['Non rispiegare','tutto ogni volta'],p3:['Scegli cosa','affidare all’AI'],p4:['Il tuo kit','su misura'],p5:['Dal supporto','alla delega']};
 const cw=132, gap=30, x0=60;
 let s = `<svg viewBox="0 0 900 320" role="img" aria-label="I cinque pilastri"><defs><linearGradient id="shine" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#000" stop-opacity=".1"/></linearGradient></defs>`;

  '<b>Gratis o a pagamento</b>: con il piano gratuito fai già moltissimo, ma dopo un po’ di messaggi passi a un modello più leggero. Se lo usi tutti i giorni, il piano a pagamento toglie quasi tutti i limiti.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  '<b>Crea l’account</b> su <b>claude.ai</b>. Scarica l’<b>app sul telefono</b>: è quella che userai di più. L’app per computer (claude.com/download) serve per Cowork e Claude Code.',
  `<b>Attiva la creazione di file</b>: ${mp('Impostazioni › Funzionalità')} → <b>“Esecuzione codice e creazione file”</b>. Senza questa spunta Claude non ti consegna Excel, Word e PowerPoint veri.`,
  `<b>Privacy</b>: ${mp('Impostazioni › Privacy')} → scegli se le tue chat possono essere usate per migliorare i modelli.`,
  `<b>Presentati una volta sola</b>: ${mp('Impostazioni › Profilo')} → preferenze personali. Il testo pronto lo prepari nella lezione “Personalizza la tua AI”.`,
  '<b>Gratis o a pagamento</b>: il piano gratuito ha un tetto di utilizzo che si ricarica ogni poche ore. Se lo usi tutti i giorni o vuoi Cowork, serve un piano a pagamento.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  '<b>Entra</b> su <b>gemini.google.com</b> con il tuo account Google: se hai Gmail, ce l’hai già. Sul telefono Android è spesso già installata; su iPhone scarichi l’app Gemini.',
  `<b>Privacy</b>: ${mp('Impostazioni › Mantieni attività')} → disattivala se non vuoi che le conversazioni vengano conservate e usate per migliorare i servizi.`,
  `<b>Presentati una volta sola</b>: ${mp('Impostazioni › Contesto personale')} → scrivi chi sei e come vuoi le risposte.`,
  `<b>App collegate</b>: ${mp('Impostazioni › App')} → attiva Gmail, Drive e Documenti se vuoi poter dire <i>“prendi il file X dal mio Drive”</i>. Attiva solo quello che ti serve davvero.`,
  '<b>Gratis o a pagamento</b>: gratis hai già l’essenziale; con Google AI Pro aumentano i limiti e le funzioni di ricerca approfondita.'
 ])
},
/* ---- Personalizzazione ---- */
personal:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  `<b>Dove si incolla</b>: ${mp('Impostazioni › Personalizzazione')}. Nel campo “su di te” metti la parte <b>CHI SONO</b>; nel campo delle istruzioni metti <b>COME VOGLIO LE RISPOSTE</b> e <b>AFFIDABILITÀ</b>. Valgono per tutte le chat nuove.`,
  '<b>Stile di base</b>: nella stessa pagina puoi scegliere una personalità (per esempio più sintetica). Le tue istruzioni restano comunque valide.',
  `<b>Memoria</b>: in ${mp('Impostazioni › Personalizzazione › Memoria')} vedi tutto quello che ChatGPT ricorda di te e cancelli ciò che è sbagliato o troppo personale. Controllala ogni tanto.`,
  '<b>Insegnare al volo</b>: in chat scrivi <i>“Ricorda che sono celiaco”</i> oppure <i>“Ricorda che i miei figli hanno 6 e 9 anni”</i>: lo salva in memoria e non dovrai ripeterlo.',
  '<b>Chat temporanea</b>: non resta nella cronologia e non crea memorie. Usala per cose delicate (salute, soldi, famiglia).'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  `<b>Dove si incolla</b>: ${mp('Impostazioni › Profilo')} → incolla tutto il testo che prepari qui sotto. Vale per tutte le chat.`,
  '<b>Stili</b>: nella casella dove scrivi apri il menu degli stili e scegli <b>Normale, Conciso, Esplicativo o Formale</b>. Puoi anche creare uno stile caricando due o tre tuoi testi: Claude imparerà il tuo modo di scrivere.',
  `<b>Memoria</b>: in ${mp('Impostazioni › Funzionalità')} attivi la memoria; con <b>Visualizza e modifica memoria</b> controlli e correggi. Ogni Progetto ha una memoria separata.`,
  '<b>Insegnare al volo</b>: in chat scrivi <i>“Ricorda che sono celiaco”</i> oppure <i>“Ricorda che i miei figli hanno 6 e 9 anni”</i>.',
  '<b>Chat in incognito</b> (icona del fantasmino in alto): non resta nella cronologia e non legge le memorie. Usala per cose delicate.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  `<b>Dove si incolla</b>: ${mp('Impostazioni › Contesto personale')} → incolla il testo che prepari qui sotto. Vale per tutte le chat.`,
  `<b>Chat passate</b>: sempre in ${mp('Contesto personale')} decidi se Gemini può usare le conversazioni precedenti per risponderti in modo più personale.`,
  '<b>Insegnare al volo</b>: in chat scrivi <i>“Ricorda che sono celiaco”</i> oppure <i>“Ricorda che i miei figli hanno 6 e 9 anni”</i>.',
  '<b>Chat temporanea</b>: non compare nella cronologia e non viene usata per personalizzare. Usala per cose delicate.',
  '<b>Gem</b>: se un compito torna sempre uguale (tradurre, correggere, riassumere) creane uno con istruzioni proprie: le trovi nella lezione sugli assistenti.'
 ])
},
/* ---- Contro gli errori ---- */
verify:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  `<b>Cerca sul web</b>: per prezzi, leggi, orari, scadenze scrivi <i>“cerca sul web”</i> o attiva la ricerca dal ${mp('+')}. Nella risposta compaiono le <b>fonti</b>: aprine almeno una.`,
  '<b>Ricerca approfondita</b> (Deep research): per decisioni importanti (un acquisto, una pratica) produce un riassunto con le citazioni.',
  '<b>Sui tuoi documenti</b>: chiedi sempre <i>“dimmi la pagina e la frase esatta tra virgolette”</i>. Se non la trova, deve scrivere NON TROVATO.',
  '<b>Conti e numeri</b>: chiedi di <i>“fare il calcolo con il codice”</i>: esegue un piccolo programma invece di andare a occhio.',
  '<b>Seconda opinione</b>: incolla la risposta in una <b>chat temporanea</b> nuova e chiedi <i>“trova gli errori in questo testo”</i>.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  '<b>Cerca sul web</b>: per prezzi, leggi, orari, scadenze attiva la ricerca dal menu degli strumenti nella casella dove scrivi. Le affermazioni avranno le <b>fonti</b>: aprine almeno una.',
  '<b>Ricerca</b> (Research): per decisioni importanti produce un riassunto con le citazioni.',
  '<b>Sui tuoi documenti</b>: chiedi sempre <i>“dimmi la pagina e la frase esatta tra virgolette”</i>. Se non la trova, deve scrivere NON TROVATO.',
  '<b>Conti e numeri</b>: con “Esecuzione codice e creazione file” attiva, chiedi di <i>“fare il calcolo con il codice”</i>.',
  '<b>Seconda opinione</b>: incolla la risposta in una <b>chat in incognito</b> e chiedi <i>“trova gli errori in questo testo”</i>.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  `<b>Ricontrolla la risposta</b>: sotto la risposta apri ${mp('Altro (⋮) › Ricontrolla la risposta')}. Gemini cerca con Google e colora le frasi: <b>verde</b> = ha trovato conferme, <b>arancione</b> = ha trovato qualcosa di diverso o niente. È il controllo più veloce che esista.`,
  '<b>Gemini Notebook</b>: risponde solo con i documenti che hai caricato e ogni frase ha un numero cliccabile che ti porta al punto esatto.',
  '<b>Deep Research</b>: per decisioni importanti produce un riassunto con le fonti.',
  '<b>Conti e numeri</b>: portali in <b>Fogli Google</b> e fatti scrivere le formule: le controlli cella per cella.',
  '<b>Seconda opinione</b>: incolla la risposta in una <b>chat temporanea</b> e chiedi <i>“trova gli errori in questo testo”</i>.'
 ])
},
/* ---- File ---- */
file:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  `<b>Allega</b>: trascina il file nella chat o usa il ${mp('+')} (PDF, Word, Excel, foto, scansioni). Dal telefono puoi <b>fotografare</b> direttamente una bolletta o un modulo.`,
  '<b>Verifica sempre per prima cosa</b>: <i>“quante pagine (o righe) hai letto? riportami le prime tre voci”</i>. Se il file è stato letto male, te ne accorgi subito.',
  '<b>Chiedi un file in uscita</b>: <i>“ridammi un file .xlsx da scaricare”</i>. Funziona anche per Word, PowerPoint e PDF.',
  '<b>Tabelle e conti</b>: aggiungi <i>“fai i calcoli eseguendo il codice”</i>, così i totali sono esatti.',
  '<b>Tanti file insieme</b> (per esempio tutte le bollette dell’anno): mettili in un <b>Progetto</b>, oppure usa <b>Work</b> su una cartella del computer.'+DL
 ]),
 claude: stepsL(TOOLS.claude.c,[
  `<b>Allega</b>: trascina il file nella chat o usa la ${mp('graffetta')} (PDF, Word, Excel, foto, scansioni). Dal telefono puoi <b>fotografare</b> direttamente una bolletta o un modulo.`,
  '<b>Verifica sempre per prima cosa</b>: <i>“quante pagine (o righe) hai letto? riportami le prime tre voci”</i>.',
  '<b>Chiedi un file in uscita</b>: con “Esecuzione codice e creazione file” attiva, chiedi <i>“ridammi un .xlsx da scaricare”</i>.',
  '<b>Tabelle e conti</b>: aggiungi <i>“fai i calcoli eseguendo il codice”</i>, così i totali sono esatti.',
  '<b>Tanti file insieme</b> (per esempio tutte le bollette dell’anno): mettili in un <b>Progetto</b>, oppure usa <b>Cowork</b> su una cartella del computer.'+DL
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  `<b>Allega</b>: usa il ${mp('+')} nell’app Gemini (PDF, Word, Excel, foto, scansioni) oppure prendi il file direttamente dal tuo <b>Drive</b>. Dal telefono puoi <b>fotografare</b> una bolletta o un modulo.`,
  '<b>Verifica sempre per prima cosa</b>: <i>“quante pagine (o righe) hai letto? riportami le prime tre voci”</i>.',
  '<b>File Google</b>: se il documento è su Drive, conviene aprirlo e usare l’icona <b>Gemini</b> dentro Documenti o Fogli: lavora direttamente sul file.',
  '<b>Tabelle e conti</b>: in <b>Fogli</b> fatti scrivere le formule; in chat chiedi <i>“usa il codice per i calcoli”</i>.',
  '<b>Tanti documenti insieme</b> (manuali, contratti, dispense): caricali in <b>Gemini Notebook</b>: risponde solo con quelli e cita il punto esatto.'
 ])
},
/* ---- Immagini e foto ---- */
immagini:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  '<b>Capire una foto</b>: allega la foto e chiedi <i>“cosa c’è scritto?”</i>, <i>“che pianta è?”</i>, <i>“che significa questa spia dell’auto?”</i>. Dal telefono puoi scattare e chiedere subito.',
  '<b>Creare un’immagine</b>: descrivila a parole in chat (<i>“un invito per una festa di compleanno, tema mare, con scritto…”</i>). Poi chiedi le modifiche: <i>“più semplice”</i>, <i>“sfondo bianco”</i>, <i>“formato verticale”</i>.',
  '<b>Ritoccare</b>: allega una tua foto e chiedi la modifica (togliere lo sfondo, schiarirla, trasformarla in disegno).',
  '<b>Testo dentro l’immagine</b>: scrivilo tra virgolette e controllalo sempre: le lettere possono uscire storte o sbagliate.',
  '<b>Attenzione</b>: non caricare foto di documenti d’identità, carte di credito o persone che non ti hanno dato il permesso.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  '<b>Capire una foto</b>: allega la foto e chiedi <i>“cosa c’è scritto?”</i>, <i>“che pianta è?”</i>, <i>“che significa questa spia dell’auto?”</i>. Dal telefono puoi scattare e chiedere subito.',
  '<b>Claude non crea fotografie</b>: se ti serve un’immagine disegnata, può però creare un <b>Artifact</b> con grafiche, schemi, biglietti e locandine fatti con testo e forme, da stampare o salvare.',
  '<b>Scansioni e documenti fotografati</b>: li legge bene, ma i numeri vanno controllati a campione.',
  '<b>Schemi e diagrammi</b>: chiedi <i>“fammi uno schema dei passaggi”</i>: lo disegna in un Artifact che puoi salvare.',
  '<b>Attenzione</b>: non caricare foto di documenti d’identità, carte di credito o persone che non ti hanno dato il permesso.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  '<b>Capire una foto</b>: allega la foto o inquadrala con la fotocamera e chiedi <i>“cosa c’è scritto?”</i>, <i>“che pianta è?”</i>, <i>“che significa questa spia dell’auto?”</i>.',
  '<b>Creare un’immagine</b>: descrivila a parole in chat. Gemini è molto forte sulle immagini: puoi anche caricarne una tua e chiedere di modificarla.',
  '<b>Ritoccare</b>: <i>“togli lo sfondo”</i>, <i>“mettila in verticale”</i>, <i>“trasformala in disegno per i bambini”</i>.',
  '<b>Testo dentro l’immagine</b>: scrivilo tra virgolette e ricontrollalo sempre.',
  '<b>Attenzione</b>: non caricare foto di documenti d’identità, carte di credito o persone che non ti hanno dato il permesso.'
 ])
},
/* ---- Telefono e voce ---- */
mobile:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  '<b>Installa l’app</b> (Android e iPhone) ed entra con lo stesso account: le chat sono le stesse del computer.',
  '<b>Parla invece di scrivere</b>: tieni premuto il microfono e detta. C’è anche la <b>modalità vocale</b> per fare una vera conversazione, comoda mentre cucini o guidi (da fermo).',
  '<b>Fotocamera</b>: inquadra un’etichetta, un modulo, un errore sullo schermo, una vite da riconoscere.',
  '<b>Condividi da altre app</b>: dal menu “Condividi” del telefono puoi mandare un PDF o una foto direttamente a ChatGPT.',
  '<b>Widget e scorciatoia</b>: mettila in home; ti servirà più spesso di quanto credi (al supermercato, in negozio, allo sportello).'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  '<b>Installa l’app</b> (Android e iPhone) ed entra con lo stesso account: le chat sono le stesse del computer.',
  '<b>Detta invece di scrivere</b>: usa il microfono della tastiera o quello dell’app.',
  '<b>Fotocamera</b>: fotografa un’etichetta, un modulo, un errore sullo schermo, una vite da riconoscere.',
  '<b>Condividi da altre app</b>: dal menu “Condividi” del telefono puoi mandare un PDF o una foto direttamente a Claude.',
  '<b>Progetti</b>: sono gli stessi del computer, quindi la pratica che hai aperto a casa la ritrovi in coda alla posta.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  '<b>App Gemini</b>: su Android è spesso già presente (puoi anche sostituire l’assistente vocale), su iPhone la scarichi.',
  '<b>Parla invece di scrivere</b>: c’è la conversazione vocale, comoda mentre cucini o cammini.',
  '<b>Fotocamera</b>: inquadra e chiedi. Funziona anche su quello che vedi sullo schermo del telefono.',
  '<b>Gmail e Drive dal telefono</b>: se hai attivato le app collegate, puoi dire <i>“cercami la mail della scuola di settembre”</i>.',
  '<b>Condividi da altre app</b>: dal menu “Condividi” mandi un PDF o una foto direttamente a Gemini.'
 ])
},
/* ---- Progetti ---- */
progetti:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  `<b>Crea il progetto</b>: nella barra a sinistra ${mp('Progetti › Nuovo progetto')}. Dagli il nome del tema: “Casa”, “Vacanza in Sardegna”, “Pratica pensione mamma”.`,
  '<b>Carica i file</b> che riguardano quel tema: contratto, bollette, preventivi, biglietti, referti.',
  '<b>Scrivi le istruzioni del progetto</b>: le regole valide solo lì dentro (il testo lo prepari qui sotto).',
  '<b>Lavora dentro il progetto</b>: ogni chat nuova creata lì conosce già documenti e regole. Non rispieghi più niente.',
  '<b>Tieni in ordine</b>: un progetto per tema. Quando la pratica è chiusa, archivia o cancella.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  `<b>Crea il progetto</b>: nella barra a sinistra ${mp('Progetti › Crea progetto')}. Dagli il nome del tema: “Casa”, “Vacanza in Sardegna”, “Pratica pensione mamma”.`,
  '<b>Carica i file</b> nella <b>Conoscenza del progetto</b>: contratto, bollette, preventivi, biglietti, referti.',
  '<b>Scrivi le istruzioni del progetto</b> nell’apposito riquadro: le regole valide solo lì dentro.',
  '<b>Lavora dentro il progetto</b>: ogni chat nuova conosce già documenti e regole, e ha una memoria separata.',
  '<b>Tieni in ordine</b>: un progetto per tema. Quando la pratica è chiusa, archivia o cancella.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  `<b>Crea il Notebook</b>: nell’app Gemini apri ${mp('Notebook')} e creane uno nuovo con il nome del tema: “Casa”, “Vacanza in Sardegna”, “Pratica pensione mamma”.`,
  '<b>Aggiungi le fonti</b>: i file dal computer o direttamente da Drive.',
  '<b>Scrivi le istruzioni</b> del notebook: le regole valide solo lì dentro.',
  '<b>Se i documenti sono tanti e devi consultarli</b> (manuali, contratti, dispense scolastiche), usa <b>Gemini Notebook</b>: risponde solo con quelli e cita il punto esatto.',
  '<b>Tieni in ordine</b>: un notebook per tema; quando la pratica è chiusa, eliminalo.'
 ])
},
/* ---- Assistenti ---- */
assistenti:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  '<b>Come si fa oggi</b>: i GPT personalizzati sono in via di dismissione. Per un compito sempre uguale conviene un <b>Progetto dedicato</b> con le istruzioni scritte bene, oppure una <b>Skill</b> se hai un piano aziendale.',
  '<b>Crea il progetto “assistente”</b>: nome del compito (“Correttore delle mie mail”), istruzioni fisse, ed eventuali esempi caricati come file.',
  '<b>Aggiungi 2–3 esempi</b> di risultato giusto: è quello che fa la differenza.',
  '<b>Usalo</b>: apri una chat nel progetto e incolla solo il testo da lavorare, senza rispiegare le regole.',
  '<b>Migliora</b>: quando una risposta non va, aggiungi una riga alle istruzioni invece di correggere a mano ogni volta.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  '<b>Come si fa con Claude</b>: per un compito sempre uguale crea un <b>Progetto dedicato</b> con le istruzioni fisse, oppure una <b>Skill</b> (la vedrai nel livello avanzato).',
  '<b>Crea il progetto “assistente”</b>: nome del compito (“Correttore delle mie mail”), istruzioni fisse nel riquadro delle istruzioni.',
  '<b>Aggiungi 2–3 esempi</b> di risultato giusto nella Conoscenza del progetto.',
  '<b>Usalo</b>: apri una chat nel progetto e incolla solo il testo da lavorare.',
  '<b>Migliora</b>: quando una risposta non va, aggiungi una riga alle istruzioni invece di correggere a mano ogni volta.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  `<b>Crea un Gem</b>: nell’app Gemini apri ${mp('Gem › Nuovo Gem')}.`,
  '<b>Dai un nome e le istruzioni</b>: cosa deve fare, con quali regole, in che formato. Il testo pronto lo prepari qui sotto.',
  '<b>Carica gli esempi</b> nella sezione <b>Conoscenza</b>: 2–3 risultati giusti valgono più di dieci righe di spiegazioni.',
  '<b>Provalo e correggi</b>: modifica le istruzioni del Gem invece di correggere a mano ogni volta.',
  '<b>Usalo</b>: lo trovi sempre nell’elenco dei Gem, anche dal telefono.'
 ])
},
/* ---- Skill (livello avanzato) ---- */
skill:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  `<b>Dove sono</b>: ${mp('barra laterale › Plugin › Skill')}, ma sono disponibili <b>solo nei piani aziendali</b>. Con un account personale ottieni lo stesso risultato con un <b>Progetto dedicato</b> o con <b>Codex</b>.`+DL,
  '<b>Struttura</b>: una cartella con dentro <code>SKILL.md</code> (nome, quando usarla, procedura) ed eventuali modelli in <code>assets/</code>.',
  '<b>Provala su un caso vero</b> prima di considerarla finita.',
  '<b>Con Codex</b>: metti il file <code>SKILL.md</code> nella cartella di lavoro: verrà letto quando serve.',
  '<b>Tienila corta</b>: sotto le 500 righe; i dettagli lunghi in file separati.'
 ]),
 claude: stepsL(TOOLS.claude.c,[
  `<b>Dove sono</b>: ${mp('Personalizza › Skill')}. Trovi già quelle pronte (Excel, Word, PowerPoint, PDF) e puoi aggiungere le tue caricando un file <b>.zip</b>.`,
  '<b>Struttura</b>: una cartella con <code>SKILL.md</code> (name, description, procedura) e, se servono, <code>assets/</code> (modelli), <code>references/</code> (dettagli), <code>scripts/</code> (piccoli programmi).',
  '<b>Comprimi la cartella</b> in .zip e caricala. Claude la userà da sola quando la richiesta corrisponde alla description.',
  '<b>Provala su un caso vero</b> prima di considerarla finita.',
  '<b>Tienila corta</b>: sotto le 500 righe; i dettagli lunghi in <code>references/</code>.'
 ]),
 gemini: stepsL(TOOLS.gemini.c,[
  '<b>Con Gemini</b> l’equivalente della skill è un <b>Gem</b> con istruzioni dettagliate e file di esempio nella Conoscenza.',
  '<b>Per le cartelle del computer</b>: con <b>Antigravity</b>'+DL+' puoi mettere le istruzioni in un file <code>GEMINI.md</code> dentro la cartella: viene letto a ogni avvio.',
  '<b>Struttura consigliata</b>: descrivi quando usarla, i passaggi, il formato del risultato e i controlli finali.',
  '<b>Carica i modelli</b> (il tuo foglio tipo, la tua lettera tipo) come file: l’AI li seguirà.',
  '<b>Provala su un caso vero</b> prima di considerarla finita.'
 ])
},
/* ---- File .md ---- */
md:{
 chatgpt: stepsL(TOOLS.chatgpt.c,[
  '<b>Cos’è</b>: un normale file di testo con qualche simbolo per titoli ed elenchi. Si apre con Blocco note (Windows) o TextEdit (Mac).',
  '<b>Come crearlo</b>: apri l’editor di testo, scrivi, e salva con estensione <code>.md</code> (per esempio <code>istruzioni.md</code>).',

function decide(){
 const d = S.dec, sc = {chatgpt:1, claude:1, gemini:1};
 if(d.google==='si') sc.gemini += 3;
 if(d.office==='si'){ sc.claude += 2; sc.chatgpt += 1; }
 if(d.testi==='si'){ sc.claude += 3; sc.chatgpt += 1; }
 if(d.telefono==='si'){ sc.chatgpt += 2; sc.gemini += 2; }
 if(d.immagini==='si'){ sc.gemini += 2; sc.chatgpt += 2; }
 const best = Object.entries(sc).sort((a,b)=>b[1]-a[1]);
 return {best:best[0][0], sc, pari: best[0][1]===best[1][1]};
}

const BRIEF = [['C','contesto','Contesto'],['R','ruolo','Ruolo'],['A','azione','Azione'],['F','formato','Formato'],['T','tono','Tono'],['','destinatario','Destinatario'],['','materiali','Materiali'],['','vincoli','Vincoli']];
function buildPrompt(){
 const p = S.prompt, out = [];
 out.push('CONTESTO\n' + v(p.contesto,'descrivi la situazione in due o tre righe'));
 if(p.ruolo.trim()) out.push('RUOLO\n' + p.ruolo.trim());
 out.push('COSA DEVI FARE\n' + v(p.azione,'di’ esattamente cosa deve produrre e a cosa ti serve'));
 if(p.destinatario.trim()) out.push('PER CHI È\n' + p.destinatario.trim());
 out.push('FORMATO\n' + v(p.formato,'lunghezza e forma: elenco, tabella, mail…'));
 if(p.tono.trim()) out.push('TONO\n' + p.tono.trim());
 if(p.materiali.trim()) out.push('MATERIALI\n<materiali>\n' + p.materiali.trim() + '\n</materiali>');
 const vin = lines(p.vincoli);
 const reg = [];
 if(p.domande) reg.push('Se ti mancano informazioni per fare un buon lavoro, fammi prima le domande invece di inventare.');
 if(p.assunzioni) reg.push('Alla fine elenca in due righe le cose che hai dato per scontate.');
 if(vin.length || reg.length) out.push('REGOLE\n' + [...vin, ...reg].map(x=>'- ' + x).join('\n'));
 return out.join('\n\n');
}

const FILE_TIPI = {pdf:'un PDF', excel:'un foglio di calcolo', word:'un documento Word', foto:'una foto o scansione'};
const USCITE = {testo:'Rispondi direttamente nella chat, in modo ordinato.', xlsx:'Alla fine dammi un file .xlsx da scaricare, con una riga di intestazione.', docx:'Alla fine dammi un documento .docx da scaricare.', tabella:'Dammi il risultato in una tabella che posso copiare.'};
function fileText(){
 const f = S.file, p = lines(f.passi);
 return `Ti allego ${FILE_TIPI[f.tipo]}: ${v(f.nome,'nome del file')}.
Contiene: ${v(f.contenuto,'descrivi cosa c’è dentro')}.

PRIMA DI TUTTO
Dimmi quante ${f.tipo==='excel' ? 'righe e colonne' : 'pagine'} hai letto e riportami le prime tre voci, così controllo che sia il file giusto e che tu l'abbia letto tutto.

COSA DEVI FARE
${v(f.obiettivo,'cosa vuoi ottenere')}${p.length ? '\n\nPASSAGGI\n' + p.map((x,i)=>`${i+1}. ${x}`).join('\n') : ''}

RISULTATO
${USCITE[f.uscita]}

REGOLE
- Usa solo quello che c'è nel file: se un dato non c'è, scrivi NON TROVATO.
- Per ogni informazione importante indica dove l'hai trovata (pagina o riga) e riporta la frase esatta tra virgolette.
- Fai i calcoli eseguendo il codice, non a mente, e dimmi su quante righe li hai fatti.${f.tipo==='foto' ? "\n- È una foto: se una cifra non è leggibile con certezza, segnalala invece di indovinare." : ''}`;
}

L({id:'p1-token', p:'p1', lv:2, t:'Perché a un certo punto rallenta o si blocca', sub:'Token, consumi e limiti spiegati con la benzina, e un simulatore per vederlo', min:10,
 body:()=>`
 ${card('Cos’è un token, senza tecnicismi', `
  <p>L’AI non conta le parole: conta i <b>token</b>, cioè pezzetti di parola. In italiano una parola vale circa 1,5 token. È l’unità con cui si misura tutto quello che legge e tutto quello che scrive.</p>
  ${analogy('⛽','La benzina','Ogni messaggio consuma. Il punto che quasi nessuno sa: <b>a ogni tuo messaggio l’AI rilegge da capo tutta la conversazione</b>, allegati compresi. Al quarantesimo messaggio, un semplice “grazie” costa quanto rileggere un libretto.')}
  <p>Ecco perché una chat lunga diventa lenta, perde il filo e ti fa arrivare prima al limite del piano.</p>
 `)}
 ${tryBox('Quanto consuma una chat lunga?', `
  <div class="form">
   ${fld('tok.msg','Quanti messaggi dura la chat',{type:'number',min:1})}
   ${fld('tok.parole','Parole per messaggio (in media)',{type:'number',min:1})}
   ${fld('tok.pagine','Pagine di allegati',{type:'number',min:0})}
   ${fld('tok.ogni','Ogni quanti messaggi riparti da una chat nuova',{type:'number',min:1,hint:'Con il riassunto: il consiglio è 6–8'})}
  </div>
  <div id="tok-res"></div>
 `)}
 ${card('Le sei mosse che fanno la differenza', `
  ${stepsL(P1,[
   '<b>Chat nuova quando cambi argomento.</b> È la mossa che pesa di più.',
   '<b>Chiedi il riassunto e riparti.</b> Dopo 30–40 messaggi: <i>“Riassumi questa conversazione per ripartire in una chat nuova: decisioni prese, dati stabiliti, cosa resta da fare”</i>. Copialo nella chat nuova.',
   '<b>Modifica il messaggio sbagliato</b> invece di aggiungerne uno di correzione: quello sbagliato sparisce dalla rilettura.',
   '<b>Allega il capitolo, non il libro.</b> Se ti serve un pezzo, dai quel pezzo.',
   '<b>Usa il modello leggero</b> per le cose semplici: tradurre, riassumere, sistemare un testo. Quello “che ragiona” tienilo per i problemi veri.',
   '<b>Quello che fai ogni mese</b> mettilo in un progetto o in un assistente invece di rispiegarlo: lo vedrai nel prossimo pilastro.'
  ])}
  ${howBox('tokens')}
 `)}
 ${outBox('rias-out','Prompt per il riassunto di fine chat', `Riassumi questa conversazione per continuarla in una chat nuova.

Scrivi in elenco:
1. OBIETTIVO: cosa sto cercando di ottenere
2. DATI STABILITI: numeri, nomi, date e decisioni già prese
3. COSA ABBIAMO ESCLUSO e perché
4. PROSSIMO PASSO: da dove si riparte

Massimo 25 righe. Solo quello che serve per continuare: niente convenevoli.`)}
 ${keys(['A ogni messaggio l’AI rilegge tutta la chat: le chat lunghe costano tanto.','Riassunto + chat nuova ogni 30–40 messaggi.','Modifica il messaggio sbagliato, non aggiungerne uno.','Modello leggero per le cose semplici.'])}
`,
 update:()=>{
  const t = S.tok, msg = Math.max(1,Number(t.msg)||1), par = Math.max(1,Number(t.parole)||1), pag = Math.max(0,Number(t.pagine)||0), ogni = Math.max(1,Number(t.ogni)||1);
  const tk = par*1.5, all = pag*450*1.5;
  let tot = 0; for(let i=1;i<=msg;i++) tot += all + tk*i;
  let tot2 = 0; for(let i=1;i<=msg;i++){ const pos = ((i-1)%ogni)+1; tot2 += all + tk*pos + (i>ogni?tk*3:0); }
  const risp = Math.round((1-tot2/tot)*100);
  const bar = (l,val,max,c) => `<div style="margin:8px 0"><div class="prog-t"><span>${l}</span><b>${fmt(val)} token</b></div><div class="meter-bar"><i style="width:${Math.round(val/max*100)}%;background:${c}"></i></div></div>`;
  setHTML('tok-res', `<div class="qres" style="background:#0f1b2d">
   ${bar('Tutto in una chat sola', tot, tot, '#dc2626')}
   ${bar('Ripartendo ogni ' + ogni + ' messaggi con il riassunto', tot2, tot, '#16a34a')}
   <p style="margin:10px 0 0">Risparmio stimato: <b style="font-size:20px">${risp > 0 ? risp : 0}%</b>. Non è solo una questione di limiti: una chat corta è anche più precisa, perché l’AI ha meno roba da tenere a mente.</p></div>`);
 }});

/* ---------- Istruzioni personali ---------- */
function persText(){
 const p = S.pers, r = [];
 r.push('CHI SONO\n' + v(p.chi,'due righe su di te: età, famiglia, lavoro se serve') + (p.vita.trim() ? '\n' + p.vita.trim() : ''));
 const how = ['Rispondi in italiano.'];
 how.push(p.lunghezza==='sintetiche' ? 'Vai al punto: risposte brevi, senza premesse e senza riassumere la mia domanda.' : p.lunghezza==='spiegate' ? 'Spiegami le cose passo passo, dando per scontato poco: preferisco capire che avere la risposta veloce.' : 'Prima la risposta in due righe, poi i dettagli per chi vuole approfondire.');
 how.push(p.tono==='lei' ? 'Dammi del lei.' : 'Dammi del tu, tono cordiale ma non sdolcinato.');
 how.push('Niente complimenti iniziali, niente “ottima domanda”, niente emoji se non le chiedo.');
 if(p.lingua.trim()) how.push(p.lingua.trim());
 if(p.evitare.trim()) lines(p.evitare).forEach(x=>how.push('Evita: ' + x));
 r.push('COME VOGLIO LE RISPOSTE\n' + how.map(x=>'- ' + x).join('\n'));
 const aff = [];
 if(p.nonloso) aff.push('Se non hai un’informazione, scrivi NON LO SO invece di ipotizzare.');
 if(p.fonti) aff.push('Per fatti recenti (leggi, prezzi, scadenze, orari) cerca sul web e dammi i link.');
 if(p.ipotesi) aff.push('Se la mia richiesta è ambigua, fammi le domande prima di rispondere.');
 if(p.calcoli) aff.push('Per i calcoli esegui il codice invece di andare a mente, e dimmi su quali dati li hai fatti.');
 if(p.web) aff.push('Quando lavori su un mio documento, riporta la frase esatta e dove l’hai trovata.');
 if(aff.length) r.push('AFFIDABILITÀ\n' + aff.map(x=>'- ' + x).join('\n'));
 return r.join('\n\n');
}

/* ---------- Progetti ---------- */
function projText(){
 const p = S.proj, d = lines(p.docs), r = lines(p.regole);
 return `ISTRUZIONI DEL PROGETTO "${v(p.nome,'nome del progetto')}"

DI COSA SI TRATTA
${v(p.descr,'descrivi il tema in due o tre righe: cosa c’è in ballo, da quando, chi è coinvolto')}

DOCUMENTI CHE TROVI QUI
${d.length ? d.map(x=>'- ' + x).join('\n') : '- [elenca i file che carichi nel progetto]'}

COME DEVI COMPORTARTI
${r.length ? r.map(x=>'- ' + x).join('\n') : '- [le regole che valgono solo per questo tema]'}
- Rispondi usando prima di tutto i documenti di questo progetto.
- Quando citi un documento, indica quale e riporta la frase esatta tra virgolette.
- Se un'informazione non è nei documenti, dillo chiaramente invece di ipotizzare.
- Se ti chiedo di scrivere qualcosa che andrà spedito, ricordami cosa devo controllare prima di inviarlo.`;
}

name: riepilogo-spese

# Riepilogo spese del mese

## Quando usare questa skill
Quando l'utente fornisce movimenti bancari o di carta (PDF, Excel, CSV o testo incollato) e vuole capire dove sono finiti i soldi in un periodo.

## Cosa ricevo in ingresso
Un elenco di movimenti con almeno: data, descrizione, importo. Se manca una di queste tre informazioni, la chiedo prima di procedere.

## Procedura
1. Conto i movimenti letti e dichiaro il periodo coperto (dal … al …). Aspetto conferma se il periodo non corrisponde a quello richiesto.
2. Separo entrate e uscite.
3. Assegno a ogni uscita una sola categoria tra: casa, spesa alimentare, trasporti, salute, svago, abbonamenti, figli, altro.
4. I movimenti la cui descrizione non permette di capire la categoria li metto in "da verificare": non indovino mai.
5. Calcolo i totali per categoria eseguendo il codice, mai a mente.
6. Se ho i dati del mese precedente, calcolo la differenza in euro e in percentuale.
7. Individuo i movimenti che si ripetono con lo stesso importo e la stessa descrizione: sono probabili abbonamenti.

## Come deve uscire il risultato
- Tabella 1: categoria, totale, percentuale sul totale uscite, differenza con il mese precedente.
- Tabella 2: le cinque uscite singole più alte.
- Tabella 3: abbonamenti ricorrenti individuati, con il costo annuo.
- Elenco finale dei movimenti "da verificare".

## Controlli prima di consegnare
- La somma delle categorie coincide con il totale delle uscite: sì/no.
- Ogni movimento compare in una sola categoria: sì/no.
- Il numero di movimenti categorizzati più quelli "da verificare" è uguale al numero di movimenti letti: sì/no.
- Tutti gli importi sono numeri, con due decimali: sì/no.

## Cosa NON devo fare
- Non inventare la categoria di un movimento poco chiaro.
- Non dare giudizi su come l'utente spende.
- Non suggerire prodotti finanziari.`},

name: controllo-bolletta
description: Da usare quando l'utente allega una bolletta di luce, gas, acqua o telefono e vuole capire se l'importo è normale o perché è aumentato. Produce il confronto voce per voce con un periodo precedente e le domande da fare al fornitore.

# Controllo della bolletta

## Quando usare questa skill
Quando arriva una bolletta che sembra alta, o quando si vuole controllare che gli importi corrispondano al contratto.

## Cosa ricevo in ingresso
Una o più bollette in PDF o foto. Idealmente due: quella da controllare e quella dello stesso periodo dell'anno precedente.

## Procedura
1. Dichiaro quante pagine ho letto per ogni documento e riporto periodo, importo totale e consumo di ciascuna.
2. Estraggo le voci di spesa separando: quota fissa, quota a consumo, imposte, accise, IVA, eventuali conguagli e rate.
3. Confronto le stesse voci tra i due periodi, in euro e in percentuale.
4. Distinguo quanto dell'aumento dipende dal maggior consumo e quanto dal maggior prezzo unitario, eseguendo il codice.
5. Segnalo le voci presenti in una bolletta e assenti nell'altra.
6. Segnalo conguagli, letture stimate invece che effettive e cambi di tariffa.

## Come deve uscire il risultato
- Riepilogo in tre righe: quanto è aumentato, quanto per consumo, quanto per prezzo.
- Tabella di confronto voce per voce.
- Elenco delle anomalie riscontrate.
- Cinque domande precise da fare al servizio clienti.

## Controlli prima di consegnare
- La somma delle voci coincide con il totale della bolletta: sì/no.
- Ogni cifra citata è presente nel documento: sì/no.
- Il consumo è espresso nella stessa unità di misura nei due periodi: sì/no.

## Cosa NON devo fare
- Non stimare un dato che non riesco a leggere: scrivo NON TROVATO.
- Non consigliare di cambiare fornitore se non mi è stato chiesto.
- Non citare normative o delibere se non sono sicuro del riferimento.`},

# Lettera formale, reclamo o disdetta

## Quando usare questa skill
Ogni volta che serve un testo che potrebbe finire in una controversia: deve essere chiaro, datato e verificabile.

## Cosa ricevo in ingresso
Il racconto della situazione, eventuali documenti (contratti, ricevute, mail precedenti) e il risultato che l'utente vuole ottenere.

## Procedura
1. Estraggo i fatti in ordine cronologico, SOLO quelli che l'utente mi ha detto o che risultano dai documenti.
2. Se una data o un importo essenziale manca, lo chiedo prima di scrivere.
3. Individuo la richiesta precisa: deve essere una sola e misurabile.
4. Scrivo la lettera: intestazione del mittente, destinatario, luogo e data, oggetto, esposizione dei fatti, richiesta, termine di risposta, formula di chiusura, firma.
5. Metto tra parentesi quadre tutti i dati che deve compilare l'utente.
6. Preparo anche una versione breve per email o messaggio.

## Come deve uscire il risultato
- Lettera formale di massimo una pagina.
- Sotto: la versione breve per email.
- Sotto: l'elenco dei documenti da allegare e il modo di invio consigliato (raccomandata, PEC, modulo del sito).

## Controlli prima di consegnare
- Ogni fatto citato è tra quelli forniti dall'utente: sì/no.
- Non compaiono articoli di legge o numeri di delibera che non mi sono stati forniti: sì/no.
- La richiesta finale è una sola ed è esplicita: sì/no.
- È indicato un termine di risposta: sì/no.

## Cosa NON devo fare
- Non minacciare azioni legali di mia iniziativa.
- Non aggiungere motivazioni personali o emotive non richieste.
- Non fare consulenza legale: se la questione è complessa, lo dico.`},

# Confronto preventivi

## Quando usare questa skill
Quando bisogna scegliere tra più offerte che descrivono la stessa cosa con parole diverse.

## Cosa ricevo in ingresso
Due o più preventivi in PDF, foto o testo.

## Procedura
1. Dichiaro quanti preventivi ho letto e a chi appartengono.
2. Da ognuno estraggo: importo totale, importo IVA esclusa, aliquota IVA, voci incluse, voci escluse, tempi di esecuzione, garanzia, condizioni di pagamento, validità dell'offerta.
3. Costruisco una tabella comparativa con una colonna per preventivo.
4. Evidenzio le voci presenti in un preventivo e assenti negli altri: sono la causa principale delle differenze di prezzo.
5. Evidenzio le voci scritte in modo generico ("materiali vari", "opere accessorie"): sono la causa principale delle sorprese.
6. Calcolo eseguendo il codice il prezzo a parità di perimetro, quando è possibile.

## Come deve uscire il risultato
- Tabella comparativa.
- Elenco "presente solo in…" e "mancante in…".
- Elenco delle voci da far chiarire, con la domanda già formulata per ciascun fornitore.
- Tre righe di sintesi: dove stanno davvero le differenze.

## Controlli prima di consegnare
- Ogni importo riportato compare identico nel preventivo di origine: sì/no.
- L'IVA è indicata separatamente per tutti: sì/no.
- I dati non presenti sono marcati NON INDICATO e non stimati: sì/no.

## Cosa NON devo fare
- Non dire quale preventivo scegliere: elenco pro e contro e lascio decidere.
- Non giudicare la congruità dei prezzi di mercato se non ho fonti.`},
 {id:'comunicazioni-scuola', ic:'🎒', cat:'famiglia', t:'Comunicazioni della scuola', d:'Due pagine di circolare in tre righe di cose da fare.', md:`---
name: comunicazioni-scuola
description: Da usare quando l'utente allega o incolla una circolare, un avviso o una comunicazione della scuola e vuole sapere cosa deve fare e entro quando. Produce un elenco di azioni con le scadenze.
---

# Comunicazioni della scuola

## Quando usare questa skill
Ogni volta che arriva una circolare: il contenuto utile è quasi sempre il 10% del testo.

## Cosa ricevo in ingresso
La circolare in PDF, foto o testo incollato.

## Procedura
1. Identifico a chi è rivolta (quale classe, quale sezione, quali famiglie): se riguarda solo alcuni, lo dico subito.
2. Estraggo le azioni richieste ai genitori, una per riga, all'imperativo.
3. Per ogni azione estraggo la scadenza esatta. Se la scadenza è espressa in modo relativo ("entro tre giorni"), calcolo la data partendo da quella della circolare.
4. Estraggo cosa deve portare o avere il bambino.
5. Estraggo se serve una firma, un pagamento o una risposta, e con quale modalità.
6. Segnalo eventuali allegati da compilare.

## Come deve uscire il risultato
Massimo 12 righe, in questo ordine:
- COSA DEVO FARE IO (elenco con le date)
- COSA DEVE PORTARE (elenco)
- SCADENZA PIÙ VICINA (data in grassetto)
- Eventuale nota su firme o pagamenti

## Controlli prima di consegnare
- Ogni data indicata risulta dal testo o è calcolata da una data presente: sì/no.
- Nessuna azione inventata: ognuna corrisponde a una frase della circolare: sì/no.

## Cosa NON devo fare
- Non riassumere le parti burocratiche o di contorno.
- Non commentare le scelte della scuola.`},
 {id:'preparazione-visita', ic:'🩺', cat:'salute', t:'Preparazione di una visita medica', d:'Sintomi in ordine e domande da fare. Nessuna diagnosi.', md:`---
name: preparazione-visita
description: Da usare quando l'utente deve andare da un medico o da uno specialista e vuole arrivare preparato. Produce la cronologia ordinata dei sintomi e l'elenco delle domande da fare. Non produce mai diagnosi.
---

# Preparazione di una visita medica

## Quando usare questa skill
Prima di una visita, quando il tempo a disposizione è poco e ci si dimentica metà delle cose.

## Cosa ricevo in ingresso
Il racconto dei sintomi, la terapia in corso, gli esami già fatti (anonimizzati) e il motivo della visita.

## Procedura
1. Riordino i sintomi in ordine cronologico: da quando, con quale andamento, cosa li peggiora, cosa li allevia.
2. Separo i fatti osservabili (misurazioni, date, farmaci assunti) dalle impressioni.
3. Preparo l'elenco delle domande da fare, ordinate per importanza, includendo sempre: cosa comporta, quali alternative ci sono, cosa succede se non faccio niente, quando devo ricontattarla.
4. Preparo l'elenco delle informazioni che il medico probabilmente chiederà, così l'utente le ha pronte.
5. Ricordo quali documenti portare.

## Come deve uscire il risultato
Un foglio da stampare, diviso in: CRONOLOGIA, TERAPIE IN CORSO, DOMANDE DA FARE, DOCUMENTI DA PORTARE.

## Controlli prima di consegnare
- Non compare nessuna ipotesi diagnostica: sì/no.
- Non compare nessun nome di farmaco che non sia già assunto dall'utente: sì/no.
- Ogni informazione riportata proviene dall'utente: sì/no.

## Cosa NON devo fare
- Non formulare diagnosi, nemmeno come ipotesi o come "potrebbe essere".
- Non dire se una situazione è grave o no.
- Non suggerire terapie, integratori o dosaggi.
- Se l'utente è spaventato, lo invito a parlarne con il medico e non aggiungo altro.`},
 {id:'menu-settimanale', ic:'🥗', cat:'ordine', t:'Menù e spesa della settimana', d:'Sette cene, la lista per reparti, gli avanzi riutilizzati.', md:`---
name: menu-settimanale
description: Da usare quando l'utente chiede il menù della settimana e la lista della spesa, tenendo conto di vincoli alimentari, tempo disponibile e budget. Produce la tabella dei sette giorni e la lista divisa per reparti.
---

# Menù e spesa della settimana

## Quando usare questa skill
Una volta a settimana, tipicamente prima della spesa grossa.

## Cosa ricevo in ingresso
Numero di persone ed età, vincoli alimentari (allergie, intolleranze, scelte), minuti disponibili nei giorni feriali e nel weekend, budget, cosa c'è già in dispensa, cosa non gradiscono.

## Procedura
1. Riepilogo i vincoli che ho capito e chiedo conferma se ne manca uno importante (soprattutto allergie).
2. Costruisco sette cene rispettando il tempo disponibile di ogni giorno.
3. Faccio in modo che almeno tre ingredienti vengano riutilizzati in due piatti diversi, per ridurre gli sprechi.
4. Uso prima quello che c'è già in dispensa.
5. Costruisco la lista della spesa aggregando le quantità per ingrediente, non per ricetta.
6. Divido la lista per reparti nell'ordine in cui si attraversa un supermercato: ortofrutta, banco freschi, macelleria e pescheria, scaffali, surgelati, casa.
7. Stimo la spesa totale e la confronto con il budget, eseguendo il codice.

## Come deve uscire il risultato
- Tabella: giorno, piatto, minuti, cosa si può preparare in anticipo.
- Lista della spesa per reparti, con le quantità.
- Riga finale: stima di spesa e differenza rispetto al budget.

## Controlli prima di consegnare
- Nessun piatto contiene ingredienti vietati dai vincoli dichiarati: sì/no.
- Nessun piatto feriale supera i minuti disponibili: sì/no.
- Ogni ingrediente dei piatti compare nella lista della spesa o è dichiarato già in dispensa: sì/no.

## Cosa NON devo fare
- Non proporre ricette che richiedono attrezzature non comuni.
- Non dare consigli nutrizionali o dietetici: non è il mio compito.`},
 {id:'stato-pratica', ic:'🧾', cat:'burocrazia', t:'A che punto è la pratica', d:'Cronologia, prossima mossa, scadenze. Dai documenti, non a memoria.', md:`---
name: stato-pratica
description: Da usare quando l'utente ha una pratica burocratica in corso (invalidità, successione, ricorso, rimborso, permesso) con documenti accumulati nel tempo e vuole sapere a che punto è e cosa deve fare adesso.
---

# A che punto è la pratica

## Quando usare questa skill
Quando la pratica dura da mesi e non si ricorda più chi deve fare cosa.

## Cosa ricevo in ingresso
I documenti della pratica: domande inviate, ricevute di protocollo, risposte degli enti, PEC, solleciti.

## Procedura
1. Dichiaro quanti documenti ho letto e il periodo che coprono.
2. Costruisco la cronologia: data, cosa è successo, chi ha fatto cosa, documento di riferimento.
3. Individuo lo stato attuale: l'ultimo evento e chi ha la palla in mano.
4. Estraggo tutte le scadenze citate nei documenti e calcolo quelle espresse in giorni.
5. Individuo cosa manca per procedere e quale documento lo dice.
6. Se due documenti si contraddicono, lo segnalo invece di scegliere.

## Come deve uscire il risultato
- CRONOLOGIA (tabella: data, evento, documento)
- SITUAZIONE ATTUALE (tre righe)
- CHI DEVE MUOVERSI ADESSO
- SCADENZE (in ordine, con i giorni che mancano)
- COSA PREPARARE ORA

## Controlli prima di consegnare
- Ogni riga della cronologia rimanda a un documento preciso: sì/no.
- Nessun evento ricostruito per deduzione: sì/no.
- Le date calcolate sono state ottenute eseguendo il codice: sì/no.

## Cosa NON devo fare
- Non dare interpretazioni giuridiche.
- Non prevedere l'esito della pratica.
- Non ricostruire passaggi mancanti "perché di solito funziona così".`},
 {id:'programma-viaggio', ic:'✈️', cat:'viaggi', t:'Programma di viaggio', d:'Giorni costruiti sui ritmi veri, con l’alternativa se piove.', md:`---
name: programma-viaggio
description: Da usare quando l'utente ha prenotato un viaggio e vuole il programma giorno per giorno costruito sui ritmi reali del gruppo, con gli spostamenti raggruppati per zona e le alternative in caso di maltempo.
---

# Programma di viaggio

## Quando usare questa skill
Dopo aver prenotato, quando si sa dove si dorme e quanti giorni ci sono.

## Cosa ricevo in ingresso
Destinazione, date, composizione del gruppo (con le età), zona dell'alloggio, interessi reali, ritmo sopportabile, budget indicativo.

## Procedura
1. Riepilogo i vincoli e segnalo se le giornate disponibili sono meno di quelle necessarie per le aspettative dichiarate.
2. Raggruppo le cose da vedere per zona geografica, in modo da non attraversare la città più volte al giorno.
3. Assegno massimo due attività impegnative al giorno, meno se ci sono bambini piccoli o persone anziane.
4. Inserisco sempre una pausa nel primo pomeriggio se nel gruppo ci sono bambini sotto i dieci anni.
5. Per ogni giorno indico un'alternativa al chiuso, in caso di pioggia.
6. Indico i tempi di spostamento a piedi o con i mezzi tra un punto e l'altro.
7. Segnalo cosa va prenotato in anticipo.

## Come deve uscire il risultato
- Tabella: giorno, mattina, pranzo (zona), pomeriggio, sera, spostamenti.
- Elenco "da prenotare in anticipo".
- Elenco "se piove".
- Riga finale: cosa taglierei per primo se avessi un giorno in meno.

## Controlli prima di consegnare
- Nessun orario di apertura o prezzo indicato come certo: ogni voce dice "da verificare sul sito": sì/no.
- Nessun giorno supera le due attività impegnative: sì/no.
- Gli spostamenti indicati sono coerenti con la zona dell'alloggio: sì/no.

## Cosa NON devo fare
- Non inventare orari, prezzi, giorni di chiusura o nomi di locali.
- Non proporre itinerari da guida turistica ignorando i ritmi dichiarati.`},
 {id:'archivio-garanzie', ic:'🛡️', cat:'casa', t:'Archivio garanzie e scadenze', d:'Scontrini e garanzie sparsi in una tabella ordinata per scadenza.', md:`---
name: archivio-garanzie

# Archivio garanzie e scadenze

## Quando usare questa skill
Una volta all'anno, o ogni volta che si accumulano nuovi acquisti importanti.

## Cosa ricevo in ingresso
Foto di scontrini, fatture e certificati di garanzia.

## Procedura
1. Dichiaro quanti documenti ho letto.
2. Per ognuno estraggo: prodotto, marca e modello, venditore, data di acquisto, importo, durata della garanzia dichiarata.
3. Se la durata non è indicata, scrivo NON INDICATO e non applico durate standard di mia iniziativa.
4. Calcolo la data di scadenza eseguendo il codice.
5. Ordino per scadenza più vicina.
6. Segnalo i documenti illeggibili e cosa andrebbe rifotografato.

## Come deve uscire il risultato
- Tabella ordinata per scadenza: prodotto, venditore, data acquisto, importo, durata, scadenza, giorni rimanenti.
- Elenco dei documenti da rifotografare.
- Elenco delle garanzie che scadono nei prossimi 90 giorni.

## Controlli prima di consegnare
- Una riga per ogni documento letto: sì/no.
- Tutte le date sono in formato gg/mm/aaaa: sì/no.
- Le scadenze sono state calcolate con il codice, non a mente: sì/no.
- Nessuna durata di garanzia inventata: sì/no.

## Cosa NON devo fare
- Non dedurre la durata della garanzia dal tipo di prodotto.
- Non dare indicazioni legali sui diritti del consumatore: segnalo solo cosa risulta dai documenti.`}
